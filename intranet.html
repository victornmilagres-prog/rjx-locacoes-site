<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --paper:#faf7f2; --paper-soft:#f1ebe1; --line:#e4dccd;
  --ink:#17130f; --ink-soft:#362f29; --gray:#5c554e; --gray-soft:#8a8377;
  --wine:#7a1220; --wine-dark:#591019; --wine-bright:#b81f2b; --gold:#a9813f;
  --ok:#3f6b52; --ok-bg:#eaf1ec; --alert:#8a2e1f; --alert-bg:#f6e6e0;
  --wait:#8a5a12; --wait-bg:#f7ecd9; --info:#2c4a66; --info-bg:#e9eef3;
  --radius:3px;
  --dark:#17130f;
}
*{box-sizing:border-box;}
html,body{margin:0;background:#dedcc8;font-family:'Source Sans 3',-apple-system,sans-serif;color:var(--ink);min-height:100vh;}
#app{min-height:100vh;}
.topbar{background:var(--ink);color:#fff;padding:0 20px;display:flex;align-items:center;gap:16px;height:56px;}
.topbar .logo{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:19px;letter-spacing:.3px;}
.topbar .logo span{color:var(--gold);font-weight:400;font-size:11px;letter-spacing:1.5px;margin-left:6px;text-transform:uppercase;}
.topbar-user{margin-left:auto;font-size:13px;color:#cfc9bd;display:flex;align-items:center;gap:12px;}
.btn-logout{background:transparent;border:1px solid #55504a;color:#fff;padding:6px 12px;border-radius:var(--radius);font-size:12.5px;cursor:pointer;}
.btn-logout:hover{border-color:var(--wine-bright);}

.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.login-box{width:100%;max-width:360px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:36px 32px;box-shadow:0 10px 30px rgba(0,0,0,.15);}
.login-box .brand{text-align:center;margin-bottom:22px;}
.login-box .brand .rjx{font-family:'Fraunces',Georgia,serif;font-size:28px;font-weight:600;}
.login-box .brand .tag{font-size:11px;letter-spacing:2px;color:var(--gold);text-transform:uppercase;margin-top:2px;}
.login-box p.hint{font-size:13px;color:var(--gray);margin:0 0 18px;text-align:center;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:5px;}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;font-size:14px;font-family:inherit;}
.field textarea{resize:vertical;}
.btn{display:inline-block;padding:11px 18px;border-radius:var(--radius);font-size:14px;font-weight:700;cursor:pointer;border:1px solid var(--wine);text-align:center;background:var(--paper);color:var(--wine);}
.btn-primary{background:var(--wine);color:#fff;border-color:var(--wine);}
.btn-primary:disabled{opacity:.6;cursor:default;}
.btn-outline{background:transparent;color:var(--wine);}
.btn-block{width:100%;}
.btn-sm{padding:8px 14px;font-size:12.5px;}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--gray);}
.btn-ghost:disabled{opacity:.35;cursor:default;}
.login-error{background:var(--alert-bg);color:var(--alert);border-radius:var(--radius);padding:9px 12px;font-size:13px;margin-bottom:14px;}
.login-success{background:var(--ok-bg);color:var(--ok);border-radius:var(--radius);padding:9px 12px;font-size:13px;margin-bottom:14px;}

/* ===== shell with sidebar ===== */
.shell{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 56px);}
.sidebar{background:var(--dark);color:#cfc9bd;padding:20px 0;}.nav-label{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#7d766b;padding:0 22px;margin:14px 0 6px;}
.mod-link{display:flex;align-items:center;gap:10px;padding:11px 22px;font-size:14px;font-weight:600;color:#cfc9bd;cursor:pointer;border-left:3px solid transparent;}
.mod-link:hover{background:rgba(255,255,255,.05);}
.mod-link.active{background:rgba(122,18,32,.28);border-left-color:var(--wine-bright);color:#fff;}
.mod-link.soon{color:#6f695f;cursor:default;}
.mod-link .tag{margin-left:auto;font-size:10px;color:#6f695f;}
.main{padding:0;overflow:auto;}
.pagehead{background:var(--paper);border-bottom:1px solid var(--line);padding:22px 32px;}
.pagehead .crumb{font-size:12px;color:var(--gray-soft);}
.pagehead h1{font-family:'Fraunces',Georgia,serif;font-size:23px;margin:4px 0 0;font-weight:600;}
.pagehead .sub{font-size:13px;color:var(--gray);margin-top:3px;}
.subnav{background:var(--paper);border-bottom:1px solid var(--line);padding:0 32px;display:flex;gap:4px;}
.subnav{flex-wrap:wrap;gap:8px;border-bottom:none !important;padding:0 0 4px;}
.subtab{font-weight:600;font-size:13px;color:var(--gray);background:#fff;border:1px solid var(--line);padding:9px 18px;border-radius:24px;cursor:pointer;font-family:inherit;}
.subtab.active{background:var(--wine);border-color:var(--wine);color:#fff;}
.subtab:hover{border-color:var(--wine);}
.content{padding:28px 32px 60px;max-width:1300px;margin:0 auto;}

.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);}
.form-card{padding:26px;margin-bottom:24px;}
.form-card h3{font-size:16px;margin:0 0 4px;font-family:'Fraunces',Georgia,serif;font-weight:600;}
.form-card .cardsub{font-size:13px;color:var(--gray);margin:0 0 18px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.list-title{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--gray);margin:0 0 12px;font-weight:700;}

.status-pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:100px;white-space:nowrap;}
.status-pill .dot{width:6px;height:6px;border-radius:50%;}
.status-wait{background:var(--wait-bg);color:var(--wait);} .status-wait .dot{background:var(--wait);}
.status-info{background:var(--info-bg);color:var(--info);} .status-info .dot{background:var(--info);}
.status-ok{background:var(--ok-bg);color:var(--ok);} .status-ok .dot{background:var(--ok);}

.loc-card{padding:16px 20px;margin-bottom:12px;}
.loc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;}
.loc-eq{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--wine);}
.loc-name{font-size:16px;margin-top:3px;font-weight:600;}
.loc-meta{color:var(--gray);font-size:13px;margin-top:5px;}
.loc-actions{margin-top:12px;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;}
.insumo-row{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);}
.insumo-row:last-child{border-bottom:none;}
.insumo-row input[type=text]{flex:1;}
.insumo-row input[type=number]{width:80px;}
.insumo-remove{color:var(--wine);font-size:12.5px;font-weight:700;cursor:pointer;background:none;border:none;white-space:nowrap;}
.dup-pill{padding:8px 12px;border:1.5px solid var(--line);border-radius:100px;font-size:12.5px;font-weight:700;color:var(--gray);cursor:pointer;user-select:none;background:var(--paper);}
.dup-pill.sel{border-color:var(--wine);background:#f7e9ea;color:var(--wine);}
.add-row{display:flex;gap:8px;margin-top:10px;}

.job-card{padding:14px 18px;margin-bottom:12px;display:flex;gap:14px;align-items:center;}
.job-time{flex:none;width:60px;text-align:center;}
.job-time b{font-family:'Fraunces',Georgia,serif;font-size:17px;display:block;}
.job-time span{font-size:10px;color:var(--gray-soft);text-transform:uppercase;}
.job-body{flex:1;}
.job-body h4{font-size:15px;margin:0 0 3px;}
.job-eq{font-size:11px;color:var(--wine);font-weight:700;text-transform:uppercase;}
.job-flags{display:flex;flex-direction:column;gap:6px;align-items:flex-end;flex:none;}
.notice-box{display:flex;gap:12px;align-items:flex-start;background:var(--alert-bg);border-left:4px solid var(--wine-bright);padding:14px 16px;border-radius:var(--radius);margin-bottom:18px;font-size:13px;color:var(--alert);}
.empty-hint{color:var(--gray);font-size:13.5px;padding:20px;text-align:center;}
.placeholder-screen{max-width:600px;margin:60px auto;text-align:center;padding:0 20px;}
.placeholder-screen h1{margin-bottom:10px;}

@media (max-width:860px){
  .shell{grid-template-columns:1fr;}
  .sidebar{display:flex;overflow-x:auto;padding:10px;}
  .grid2{grid-template-columns:1fr;}
}

/* ===== Premiacao Logistica: metricas, etapas, premio, contestacao ===== */
.metrics{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:22px;}
.metric{background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:16px 18px;}
.metric .num{font-family:Fraunces,serif; font-size:26px; font-weight:600;}
.metric .lbl{font-size:11.5px; color:var(--gray); text-transform:uppercase; letter-spacing:.3px; margin-top:2px;}
.metric.atraso{border-color:#e8cabd; background:var(--alert-bg);}
.metric.atraso .num{color:var(--alert);}

.locacao-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:4px;}
.locacao-head h3{font-size:17px;}
.locacao-sub{color:var(--gray); font-size:12.5px; margin-bottom:14px;}
.progresso-barra{height:6px; border-radius:4px; background:var(--paper-soft); overflow:hidden; margin-bottom:14px;}
.progresso-fill{height:100%; background:var(--ok);}

.etapa-row{display:flex; align-items:center; gap:12px; padding:9px 0; border-bottom:1px solid var(--line);}
.etapa-row:last-child{border-bottom:none;}
.etapa-row.feita .etapa-label{color:var(--gray-soft);}
.etapa-check{width:18px; height:18px; accent-color:var(--wine); flex-shrink:0;}
.etapa-num{color:var(--gray-soft); font-size:12.5px; width:18px; flex-shrink:0;}
.etapa-label{flex:1; font-size:13.5px;}
.etapa-pts{font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px; white-space:nowrap; background:var(--ok-bg); color:var(--ok);}
.etapa-quem{font-size:12px; color:var(--gray); width:70px; text-align:right; flex-shrink:0;}

.atraso-box{margin-top:10px; padding:14px 16px; border:1px dashed #e8cabd; border-radius:8px; background:#fdf8f5; display:flex; align-items:center; gap:12px;}
.atraso-box input{width:18px; height:18px; accent-color:var(--alert);}
.atraso-box label{font-size:13.5px; font-weight:600; color:var(--alert); cursor:pointer;}

.ver-link{font-size:12px; color:var(--wine); text-decoration:underline; cursor:pointer; background:none; border:none;}

/* premio / leaderboard */
.premio-card{padding:20px 22px; margin-bottom:22px;}
.premio-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
.premio-head h3{font-size:16px;}
.premio-valor{font-family:Fraunces,serif; font-size:15px; color:var(--gold); font-weight:600;}
.premio-barra{height:14px; border-radius:8px; background:var(--paper-soft); overflow:hidden; position:relative; margin:10px 0 8px;}
.premio-fill{height:100%; background:var(--ok); transition:width .3s;}
.premio-fill.abaixo{background:var(--wait);}
.premio-meta-marca{position:absolute; top:0; bottom:0; width:2px; background:var(--ink);}
.premio-rodape{display:flex; justify-content:space-between; font-size:12px; color:var(--gray);}
.premio-status{font-size:12.5px; font-weight:700; padding:4px 11px; border-radius:20px; display:inline-flex; align-items:center; gap:5px;}

.lider-row{display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--line);}
.lider-row:last-child{border-bottom:none;}
.lider-nome{width:100px; font-size:13.5px; font-weight:600; flex-shrink:0;}
.lider-barra-wrap{flex:1; height:10px; background:var(--paper-soft); border-radius:6px; overflow:hidden; position:relative;}
.lider-barra-fill{height:100%; background:var(--ok);}
.lider-barra-fill.abaixo{background:var(--wait);}
.lider-meta-marca{position:absolute; top:0; bottom:0; width:2px; background:var(--ink);}
.lider-pct{width:80px; text-align:right; font-size:12.5px; font-weight:700; color:var(--gray); flex-shrink:0;}

/* contestacoes */
.contest-alert{padding:16px 18px; margin-bottom:20px; background:var(--alert-bg); border:1px solid #e8cabd;}
.contest-alert h3{color:var(--alert); font-size:16px;}
.contest-row{display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid #ecd3c8; gap:10px;}
.contest-row:last-child{border-bottom:none;}
.contest-badge{font-size:11px; font-weight:700; padding:3px 10px; border-radius:20px;}
.contest-pendente{background:var(--status-wait-bg, #f7ecd9); color:var(--wait);}
.contest-aceita{background:var(--ok-bg); color:var(--ok);}
.contest-rejeitada{background:var(--alert-bg); color:var(--alert);}

.modal-overlay{position:fixed; inset:0; background:rgba(23,19,15,.45); display:flex; align-items:center; justify-content:center; z-index:200;}
.modal-box{max-width:520px; width:92%; margin:0; max-height:85vh; overflow-y:auto;}
textarea.field-textarea{width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:6px; font-size:13.5px; font-family:inherit;}

/* sininho de alerta na sidebar */
.badge-alerta{background:var(--wine); color:#fff; font-size:10.5px; font-weight:700; border-radius:20px; padding:1px 7px; min-width:16px; text-align:center; display:inline-block; margin-left:6px;}

/* resumo pessoal (transportes) */
.resumo{display:flex; align-items:center; gap:18px; padding:18px 20px; margin-bottom:14px; background:linear-gradient(135deg,#221a15,#17130f); border-radius:10px; color:#f1ebe1;}
.resumo .pontos{font-family:Fraunces,serif; font-size:36px; font-weight:600; color:#fff;}
.resumo .pontos-lbl{font-size:11px; color:var(--gold); text-transform:uppercase; letter-spacing:.5px;}
.resumo .divisor{width:1px; align-self:stretch; background:rgba(255,255,255,.15);}
.resumo .mini{font-size:12px; color:#d8cfc2;}
.resumo .mini b{color:#fff; font-size:15px; display:block; font-family:Fraunces,serif; font-weight:600;}

/* historico expansivel (transportes) */
.hist-row{border-bottom:1px solid var(--line);}
.hist-row:last-child{border-bottom:none;}
.hist-cab{display:flex; align-items:center; gap:10px; padding:12px; cursor:pointer;}
.hist-cab:hover{background:var(--paper-soft);}
.hist-cab b{flex:1; font-size:13.5px;}
.hist-detalhe{padding:0 16px 16px; display:none;}
.hist-detalhe.aberto{display:block;}
.hist-etapa-ro{display:flex; align-items:center; gap:10px; padding:6px 0; font-size:13px; border-bottom:1px solid var(--paper-soft);}
.hist-etapa-ro:last-child{border-bottom:none;}
.hist-etapa-ro .ico{width:16px; text-align:center; flex-shrink:0;}
.hist-etapa-ro.feita .ico{color:var(--ok);}
.hist-etapa-ro.nfeita .ico{color:var(--gray-soft);}
.hist-etapa-ro.nfeita .lbl{color:var(--gray-soft);}

/* manual de entrega */
.manual-header{background:var(--wine); color:#fff; padding:24px 22px; border-radius:10px; margin-bottom:20px;}
.manual-header .kicker{font-size:11px; letter-spacing:2px; text-transform:uppercase; color:#e8c9c9; margin-bottom:6px;}
.manual-header h2{font-size:24px; font-family:Fraunces,serif;}
.manual-header .sub{font-size:13px; color:#e8c9c9; margin-top:6px;}
.manual-secao{margin-bottom:22px;}
.manual-secao-titulo{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
.manual-num{width:30px; height:30px; border-radius:50%; border:2px solid var(--wine); color:var(--wine); display:flex; align-items:center; justify-content:center; font-weight:700; font-family:Fraunces,serif; flex-shrink:0;}
.manual-secao-titulo h3{font-size:15px; text-transform:uppercase; letter-spacing:.3px;}
.manual-step{background:var(--paper); border:1px solid var(--line); border-left:3px solid var(--wine); border-radius:6px; padding:12px 14px; margin:0 0 8px 15px; font-size:13.5px; line-height:1.5;}
.manual-diferencas-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:10px;}
.manual-equip-card{border-radius:8px; padding:16px 18px; border-top:4px solid; background:var(--paper);}
.manual-equip-card h4{font-size:15px; margin-bottom:8px;}
.manual-equip-card ul{margin:0; padding-left:18px; font-size:12.5px; line-height:1.6; color:var(--ink-soft);}
.manual-equip-mpt{border-color:#a83246;}
.manual-equip-crio{border-color:#2c7a7a;}
.manual-equip-endo{border-color:#c9761f;}
.manual-equip-lav{border-color:#3f8f7a;}
.manual-footer{background:#221a15; color:#e8ddd2; padding:16px 20px; border-radius:10px; font-size:13px; text-align:center; margin-top:20px;}
</style>
</head>

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function toast(msg){
  let t = document.getElementById('toast-global');
  if(!t){
    t = document.createElement('div');
    t.id = 'toast-global';
    t.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#17130f;color:#fff;padding:10px 18px;border-radius:6px;font-size:13px;z-index:999;opacity:0;transition:opacity .2s;';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(t._timer);
  t._timer = setTimeout(function(){ t.style.opacity = "0"; }, 2200);
}


function papelLabel(p){

/* ================= BOOT ================= */
async function boot(){
  const hash = window.location.hash || '';
  const isRecoveryLink = hash.indexOf('access_token=') !== -1 && (hash.indexOf('type=invite') !== -1 || hash.indexOf('type=recovery') !== -1 || hash.indexOf('type=signup') !== -1 || hash.indexOf('type=magiclink') !== -1 || hash.indexOf('type=email_change') !== -1);
  const sessionResult = await sb.auth.getSession();
  const session = sessionResult.data.session;
  if(!session){ screenLogin(); return; }
  if(isRecoveryLink){ screenSetPassword(); return; }

  const rowsResult = await sb.from('usuarios').select('*').eq('id', session.user.id);
  if(rowsResult.error || !rowsResult.data || !rowsResult.data.length){
    app.innerHTML = '<div class="login-wrap"><div class="login-box"><p>Seu usuário ainda não foi cadastrado na intranet. Fale com o Gerencial.</p><button class="btn btn-outline btn-block" id="btn-sair">Sair</button></div></div>';
    document.getElementById('btn-sair').addEventListener('click', async function(){ await sb.auth.signOut(); screenLogin(); });
    return;
  }
  currentUsuario = rowsResult.data[0];
  if(!currentUsuario.ativo){
    app.innerHTML = '<div class="login-wrap"><div class="login-box"><p>Sua conta está desativada. Fale com o Gerencial.</p><button class="btn btn-outline btn-block" id="btn-sair">Sair</button></div></div>';
    document.getElementById('btn-sair').addEventListener('click', async function(){ await sb.auth.signOut(); screenLogin(); });
    return;
  }
  renderShell();
}

  if(!permitido || !permitido.enabled){ const fb = permMods.find(function(m){ return m.enabled; }); modId = fb ? fb.id : modId; }
  document.querySelectorAll('.mod-link[data-mod]').forEach(function(l){ l.classList.toggle('active', l.dataset.mod === modId); });
  const mainArea = document.getElementById('main-area');
  if(modId === 'gerencial'){ renderGerencial(mainArea); }
  else if(modId === 'comercial'){ renderComercial(mainArea); }  else if(modId === 'transportes'){ renderTransportes(mainArea); }
else if(modId === 'operacional'){ renderOperacional(mainArea); }
}

/* ================= API HELPER (usuarios via serverless) ================= */
async function apiCall(method, body){
  const sessionResult = await sb.auth.getSession();
  const session = sessionResult.data.session;
  const resp = await fetch('/api/intranet-usuarios', {
    method: method,
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + session.access_token },
    body: body ? JSON.stringify(body) : undefined
  });
  const data = await resp.json().catch(function(){ return {}; });
  if(!resp.ok){ throw new Error(data.error || 'Erro na requisição.'); }
  return data;
}

/* ================= ASSINATURA (canvas) ================= */
function initSignaturePad(canvasId){
  const canvas = document.getElementById(canvasId);
  const ctx = canvas.getContext('2d');
  function resize(){
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * 2;
    canvas.height = rect.height * 2;
    ctx.scale(2,2);
    ctx.strokeStyle = '#17130f';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
  }
  resize();
  let drawing = false;
  function pos(e){
    const rect = canvas.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return { x: p.clientX - rect.left, y: p.clientY - rect.top };
  }
  function start(e){ drawing = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); e.preventDefault(); }
  function move(e){ if(!drawing) return; const p = pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); e.preventDefault(); }
  function end(){ drawing = false; }
  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, {passive:false});  canvas.addEventListener('touchmove', move, {passive:false});
  canvas.addEventListener('touchend', end);
  return {
    clear: function(){ ctx.clearRect(0,0,canvas.width,canvas.height); },
    isEmpty: function(){
      const blank = document.createElement('canvas');
      blank.width = canvas.width; blank.height = canvas.height;
      return canvas.toDataURL() === blank.toDataURL();
    },
    toDataURL: function(){ return canvas.toDataURL('image/png'); }
  };
}

async function criarClienteComissao(){

const LEADS_PRAZOS = { contato1: 2, retomada1: 3, retomada2: 5, retomada3: 99 };
const LEADS_ETAPA_LABEL = { contato1: "1º contato", retomada1: "Retomada 1", retomada2: "Retomada 2", retomada3: "Retomada 3", sem_retorno: "Sem retorno" };
const LEADS_PROXIMA_ETAPA = { contato1: "retomada1", retomada1: "retomada2", retomada2: "retomada3", retomada3: "sem_retorno" };

function leadsDataBR(iso){
  if(!iso) return "-";
  const p = iso.split("-");
  return p[2] + "/" + p[1];
}
function leadsDiasEntre(iso1, iso2){
  const d1 = new Date(iso1 + "T00:00:00");
  const d2 = new Date(iso2 + "T00:00:00");
  return Math.round((d2 - d1) / 86400000);
}
function leadsStatus(lead){
  if(lead.etapa === "sem_retorno" || lead.alugou !== null){ return { relevante:false }; }
  if(!lead.aguardando){ return { relevante:true, aguardando:false }; }
  const hoje = premiacaoIsoHoje(0);
  const dias = leadsDiasEntre(lead.data_ultimo_envio, hoje);
  const prazo = LEADS_PRAZOS[lead.etapa];
  return { relevante:true, aguardando:true, dias:dias, prazo:prazo, atrasado: dias >= prazo };
}
function leadsRowClass(lead){
  if(lead.alugou === true) return "row-alugou";
  if(lead.alugou === false) return "row-nao";
  if(lead.estrela) return "row-estrela";
  return "row-default";
}
function equipamentoParaPremio(texto){
  if(!texto) return null;
  const t = texto.trim().toLowerCase();
  if(t.indexOf("criodermis") !== -1) return "Criodermis";
  if(t.indexOf("mpt") !== -1) return "Ultraformer MPT";
  if(t.indexOf("iii") !== -1) return "Ultraformer III";
  if(t.indexOf("lavieen") !== -1 || t.indexOf("laser") !== -1) return "Lavieen";
  if(t.indexOf("endolaser") !== -1) return "Endolaser";
  return texto;
}
function calcularPremioLead(equipamento){ return (equipamento === "Criodermis") ? 25 : 50; }

async function leadsRegistrarContato(id, respondeu){
  const lead = (window.__leadsAtuais||[]).find(function(l){ return l.id === id; });
  if(!lead) return;
  let updates;
  if(respondeu){
    updates = { aguardando: false };
    toast(lead.nome + " respondeu — conversa em andamento.");
  } else {
    const proxima = LEADS_PROXIMA_ETAPA[lead.etapa];
    updates = { etapa: proxima, data_ultimo_envio: premiacaoIsoHoje(0), aguardando: proxima !== "sem_retorno" };
    toast(proxima === "sem_retorno" ? (lead.nome + " — 3 tentativas sem retorno.") : ("Avançou pra " + LEADS_ETAPA_LABEL[proxima] + "."));
  }
  await sb.from("comercial_leads").update(updates).eq("id", id);
  await carregarLeadsComercial();
}

async function leadsMarcarParado(id){
  await sb.from("comercial_leads").update({ aguardando: true, data_ultimo_envio: premiacaoIsoHoje(0) }).eq("id", id);
  toast("Reiniciada a contagem de dias.");
  await carregarLeadsComercial();
}

async function leadsToggleEstrela(id){
  const lead = (window.__leadsAtuais||[]).find(function(l){ return l.id === id; });
  if(!lead) return;
  await sb.from("comercial_leads").update({ estrela: !lead.estrela }).eq("id", id);
  await carregarLeadsComercial();
}

async function leadsAtualizarObs(id, valor){
  await sb.from("comercial_leads").update({ obs: valor }).eq("id", id);
  const lead = (window.__leadsAtuais||[]).find(function(l){ return l.id === id; });
  if(lead) lead.obs = valor;
}

async function leadsAtualizarAlugou(id, valor){
  const lead = (window.__leadsAtuais||[]).find(function(l){ return l.id === id; });
  if(!lead) return;
  const alugou = valor === "sim" ? true : (valor === "nao" ? false : null);
  await sb.from("comercial_leads").update({ alugou: alugou }).eq("id", id);
  lead.alugou = alugou;
  await carregarLeadsComercial();
  if(alugou === true){
    const quer = confirm(lead.nome + " alugou! Deseja lançar o prêmio de comissão dela agora?");
    if(quer) abrirModalPremioLead(lead);
  }
}

async function criarLocacaoPremiacao(){
  const numero = document.getElementById('pc-numero').value.trim();
  const equipamento = document.getElementById('pc-equipamento').value;
  const motoristaId = document.getElementById('pc-motorista').value;
  const data = document.getElementById('pc-data').value;
  const errEl = document.getElementById('pc-error');
  const okEl = document.getElementById('pc-success');
  errEl.style.display='none'; okEl.style.display='none';
  if(!numero || !motoristaId || !data){ errEl.textContent = 'Preencha número, motorista e data.'; errEl.style.display='block'; return; }
  const btn = document.getElementById('btn-abrir-locacao-premiacao');
  btn.disabled = true; btn.textContent = 'Abrindo...';
  const insertLoc = await sb.from('premiacao_locacoes').insert({ numero: numero, equipamento: equipamento, motorista_id: motoristaId, data_locacao: data, criado_por: currentUsuario.id }).select('id').single();
  if(insertLoc.error){ errEl.textContent = 'Erro ao abrir: ' + insertLoc.error.message; errEl.style.display='block'; btn.disabled=false; btn.textContent='Abrir locação'; return; }
  const locId = insertLoc.data.id;
  const etapasNomes = premiacaoEtapasBase(equipamento);
  const etapasRows = etapasNomes.map(function(nome, i){ return { locacao_id: locId, ordem: i+1, nome: nome }; });
  await sb.from('premiacao_etapas').insert(etapasRows);
  okEl.textContent = 'Locação ' + numero + ' aberta.'; okEl.style.display = 'block';
  document.getElementById('pc-numero').value = '';
  btn.disabled = false; btn.textContent = 'Abrir locação';
  await carregarListaAbertasComercial();
}

async function carregarListaAbertasComercial(){
  const wrap = document.getElementById('pc-lista-abertas');
  const motoristas = await getMotoristas();
  const motoristaNome = {};
  motoristas.forEach(function(m){ motoristaNome[m.id] = m.nome; });
  const result = await sb.from('premiacao_locacoes').select('id,numero,equipamento,motorista_id,data_locacao,status,atraso').eq('status','aberta').order('data_locacao');
  if(result.error){ wrap.innerHTML = '<p class="empty-hint">Erro ao carregar: ' + escapeHtml(result.error.message) + '</p>'; return; }
  const rows = result.data || [];
  if(!rows.length){ wrap.innerHTML = '<p class="empty-hint">Nenhuma locação aberta no momento.</p>'; return; }
  wrap.innerHTML = rows.map(function(loc){
    const eq = PREMIACAO_EQUIP[loc.equipamento] || { label: loc.equipamento };
    const nomeMot = motoristaNome[loc.motorista_id] || '-';
    let actionHtml;
    if(pcEditandoId === loc.id){
      const opts = motoristas.map(function(m){
        return '<option value="' + m.id + '"' + (m.id===loc.motorista_id?' selected':'') + '>' + escapeHtml(m.nome) + '</option>';
      }).join('');
      actionHtml = '<div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;"><select id="pc-edit-select-' + loc.id + '">' + opts + '</select>' +
        '<button class="btn btn-primary" onclick="salvarEdicaoMotoristaPremiacao(&quot;' + loc.id + '&quot;)">Salvar</button>' +
        '<button class="btn btn-ghost" onclick="cancelarEdicaoMotoristaPremiacao()">Cancelar</button></div>';
    } else {
      actionHtml = '<button class="btn btn-ghost" style="margin-top:8px;" onclick="abrirEdicaoMotoristaPremiacao(&quot;' + loc.id + '&quot;)">Editar motorista</button>';
    }
    return '<div class="card" style="padding:12px 14px;margin-bottom:8px;"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;">' +
      '<div><b>Locação #' + escapeHtml(loc.numero) + '</b><div style="font-size:12px;color:var(--gray);">' + eq.label + ' - ' + premiacaoDataBR(loc.data_locacao) + '</div></div>' +
      '<span class="status-pill status-wait"><span class="dot"></span>' + escapeHtml(nomeMot) + '</span></div>' + actionHtml + '</div>';
  }).join('');
}

function abrirEdicaoMotoristaPremiacao(locId){ pcEditandoId = locId; carregarListaAbertasComercial(); }
function cancelarEdicaoMotoristaPremiacao(){ pcEditandoId = null; carregarListaAbertasComercial(); }
async function salvarEdicaoMotoristaPremiacao(locId){
  const sel = document.getElementById('pc-edit-select-' + locId);
  await sb.from('premiacao_locacoes').update({ motorista_id: sel.value, atualizado_em: new Date().toISOString() }).eq('id', locId);
  pcEditandoId = null;
  await carregarListaAbertasComercial();
}

async function carregarControlesComercial(){
  const lista = document.getElementById('ci-lista');
  const result = await sb.from('controles_insumos').select('*').neq('status','fechado').order('criado_em', { ascending: false });
  if(result.error){
    lista.innerHTML = '<p class="empty-hint">Erro ao carregar: ' + escapeHtml(result.error.message) + '</p>';
    return;
  }
  const rows = result.data || [];
  if(!rows.length){
    lista.innerHTML = '<p class="empty-hint">Nenhum controle ativo no momento.</p>';
    return;
  }
  const motoristas = await getMotoristas();
  const nomeMotorista = function(id){ const m = motoristas.find(function(x){ return x.id === id; }); return m ? m.nome : '—'; };

  let html = '';
  rows.forEach(function(r){
    const st = STATUS_LABEL[r.status] || { text: r.status, cls: 'status-wait' };
    const podefechar = r.status === 'retirado';
    html +=
      '<div class="card loc-card">' +
        '<div class="loc-top">' +
          '<div>' +
            '<div class="loc-eq">' + (EQUIP_LABEL[r.equipamento] || r.equipamento) + '</div>' +
            '<div class="loc-name">' + escapeHtml(r.cliente_nome) + ' — #' + escapeHtml(r.numero_locacao || r.locacao_ref) + '</div>' +
            '<div class="loc-meta">Entrega: ' + escapeHtml(nomeMotorista(r.motorista_entrega_id)) + ' &middot; Retirada: ' + escapeHtml(nomeMotorista(r.motorista_retirada_id)) + '</div>' +
          '</div>' +
          '<span class="status-pill ' + st.cls + '"><span class="dot"></span>' + st.text + '</span>' +
        '</div>' +
        '<div class="loc-actions">' +
          (r.assinatura_entrega_url ? '<button class="btn btn-ghost btn-sm act-ver-ass" data-tipo="entrega" data-id="' + r.id + '">Ver assinatura de entrega</button>' : '') +          (r.assinatura_fechamento_url ? '<button class="btn btn-ghost btn-sm act-ver-ass" data-tipo="fechamento" data-id="' + r.id + '">Ver assinatura de fechamento</button>' : '') +
          (r.pdf_entrega_url ? '<button class="btn btn-ghost btn-sm act-baixar-pdf" data-tipo="entrega" data-id="' + r.id + '">Baixar PDF entrega</button>' : '') +
          (r.pdf_fechamento_url ? '<button class="btn btn-ghost btn-sm act-baixar-pdf" data-tipo="fechamento" data-id="' + r.id + '">Baixar PDF fechamento</button>' : '') +
          '<button class="btn btn-ghost btn-sm act-fechar" data-id="' + r.id + '" ' + (podefechar ? '' : 'disabled') + '>Fechar logística</button>' +
        '</div>' +
      '</div>';
  });
  lista.innerHTML = html;

  lista.querySelectorAll('.act-ver-ass').forEach(function(btn){
    btn.addEventListener('click', async function(){
      const row = rows.find(function(r){ return r.id === btn.dataset.id; });
      const url = btn.dataset.tipo === 'entrega' ? row.assinatura_entrega_url : row.assinatura_fechamento_url;
      const w = window.open('', '_blank');
      w.document.write('<img src="' + url + '" style="max-width:100%;">');
    });
  });

  lista.querySelectorAll('.act-baixar-pdf').forEach(function(btn){
    btn.addEventListener('click', function(){
      const row = rows.find(function(r){ return r.id === btn.dataset.id; });
      const url = btn.dataset.tipo === 'entrega' ? row.pdf_entrega_url : row.pdf_fechamento_url;
      const a = document.createElement('a');
      a.href = url;
      a.download = 'controle-' + (row.numero_locacao || row.locacao_ref) + '-' + btn.dataset.tipo + '.pdf';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    });

  lista.querySelectorAll('.act-fechar').forEach(function(btn){

      if(!confirm('Fechar logística? Os dados deste controle serão removidos.')) return;

  });
}

async function tsCarregarLocacoesInner(){
  const content = document.getElementById('ts-prem-content');
  content.innerHTML = '<p class="empty-hint">Carregando...</p>';
  const result = await sb.from('premiacao_locacoes').select('id,numero,equipamento,data_locacao,status,atraso').eq('motorista_id', currentUsuario.id).order('data_locacao', { ascending: false });
  if(result.error){
    content.innerHTML = '<p class="empty-hint">Erro ao carregar: ' + escapeHtml(result.error.message) + '</p>';
    return;
  }
  const locs = result.data || [];
  const idsLocs = locs.map(function(l){ return l.id; });
  let etapasPorLoc = {};
  if(idsLocs.length){
    const rEtapas = await sb.from('premiacao_etapas').select('id,locacao_id,concluida,motorista_id').in('locacao_id', idsLocs);
    (rEtapas.data||[]).forEach(function(e){
      if(!etapasPorLoc[e.locacao_id]) etapasPorLoc[e.locacao_id] = [];
      etapasPorLoc[e.locacao_id].push(e);
    });
  }

  // dias distintos em que o motorista tem locacao (selfie e por dia, nao por locacao)
  const diasSet = {};
  locs.forEach(function(loc){ diasSet[loc.data_locacao] = true; });
  const dias = Object.keys(diasSet).sort().reverse();

  let selfiesPorDia = {};
  if(dias.length){
    const rSelfies = await sb.from('premiacao_selfies_dia').select('*').eq('motorista_id', currentUsuario.id).in('data_ref', dias);
    (rSelfies.data||[]).forEach(function(s){ selfiesPorDia[s.data_ref] = s; });
  }

  let pontos = 0, possiveis = 0;
  locs.forEach(function(loc){
    const etapas = etapasPorLoc[loc.id] || [];
    etapas.forEach(function(e){
      possiveis += 1;
      if(e.concluida && e.motorista_id === currentUsuario.id) pontos += 1;
    });
  });
  let selfiesValidasCount = 0;
  dias.forEach(function(dia){
    const s = selfiesPorDia[dia];
    possiveis += PONTOS_UNIFORME_PREMIACAO;
    if(s && s.validada === true){ pontos += PONTOS_UNIFORME_PREMIACAO; selfiesValidasCount++; }
    else if(s && s.validada === false && s.motivo === 'expirada') pontos -= PONTOS_UNIFORME_PREMIACAO;
  });
  const pct = possiveis > 0 ? Math.round((pontos/possiveis)*100) : 0;
  let html = '';
  

  html += '<div class="card form-card"><h3>Selfie de uniforme do dia</h3><p class="cardsub">Uma selfie por dia cobre todas as suas locações daquele dia. Sem envio até o fim do dia, você perde ' + PONTOS_UNIFORME_PREMIACAO + ' pontos.</p>';
  html += '<div id="pt-lista-selfies-dia">';
  if(!dias.length){
    html += '<p class="empty-hint">Nenhuma locação atribuída a você ainda.</p>';
  } else {
    html += dias.map(function(dia){
      const s = selfiesPorDia[dia] || {};
      let statusLabel, statusCls, acaoHtml = '';
      if(s.validada === true){ statusLabel = 'Validada (+' + PONTOS_UNIFORME_PREMIACAO + ')'; statusCls = 'status-ok'; }
      else if(s.validada === false && s.motivo === 'expirada'){ statusLabel = 'Prazo expirado (-' + PONTOS_UNIFORME_PREMIACAO + ')'; statusCls = 'status-wait'; }
      else if(s.validada === false && s.motivo === 'reprovada'){
        statusLabel = 'IA reprovou'; statusCls = 'status-wait';
        acaoHtml = '<button class="btn btn-primary" style="margin-top:8px;" onclick="iniciarSelfiePremiacao(&quot;' + dia + '&quot;)">Tentar de novo</button>';
      } else if(s.enviada){ statusLabel = 'Aguardando validação'; statusCls = 'status-info'; }
      else {
        statusLabel = 'Selfie pendente'; statusCls = 'status-wait';
        acaoHtml = '<button class="btn btn-primary" style="margin-top:8px;" onclick="iniciarSelfiePremiacao(&quot;' + dia + '&quot;)">Tirar selfie do uniforme</button>';
      }
      return '<div class="card" style="padding:12px 14px;margin-bottom:8px;"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:center;">' +
        '<b>' + premiacaoDataBR(dia) + '</b>' +
        '<span class="status-pill ' + statusCls + '"><span class="dot"></span>' + statusLabel + '</span></div>' + acaoHtml + '</div>';
    }).join('');
  }
  html += '</div></div>';

  html += '<div class="card form-card"><h3>Minhas locações</h3>';
  html += '<div id="pt-lista-locacoes">';
  if(!locs.length){
    html += '<p class="empty-hint">Nenhuma locação atribuída a você ainda.</p>';
  } else {
    html += locs.map(function(loc){
      const eq = PREMIACAO_EQUIP[loc.equipamento] || { label: loc.equipamento };
      const etapas = etapasPorLoc[loc.id] || [];
      const feitas = etapas.filter(function(e){ return e.concluida; }).length;
      const total = etapas.length;
      return '<div class="card" style="padding:12px 14px;margin-bottom:8px;"><b>Locação #' + escapeHtml(loc.numero) + '</b><div style="font-size:12px;color:var(--gray);">' + eq.label + ' - ' + premiacaoDataBR(loc.data_locacao) + ' - ' + (loc.status==='aberta'?'em andamento':'finalizada') + ' - ' + feitas + '/' + total + ' etapas</div></div>';
    }).join('');
  }
  html += '</div></div>';
  content.innerHTML = html;
  const locsFechadasTransp = (result.data||[]).filter(function(l){ return l.status === "fechada"; });
  const resumoCardHtml = '<div class="resumo">' +
      '<div><div class="pontos">' + pontos + '</div><div class="pontos-lbl">Pontos este mês</div></div>' +
      '<div class="divisor"></div>' +
      '<div class="mini"><b>' + locsFechadasTransp.length + '</b>Locações fechadas</div>' +
      '<div class="mini"><b>' + locsFechadasTransp.filter(function(l){ return l.atraso; }).length + '</b>Com atraso</div>' +
      '<div class="mini"><b>' + selfiesValidasCount + '</b>Selfies validadas</div>' +
      '</div>';
  const locIdsTransp = locsFechadasTransp.map(function(l){ return l.id; });
  const rEtapasTransp = locIdsTransp.length ? await sb.from("premiacao_etapas").select("locacao_id,concluida").in("locacao_id", locIdsTransp) : { data: [] };
  const etapasTransp = rEtapasTransp.data || [];
  const possiveisTransp = locsFechadasTransp.reduce(function(a,l){ return a + etapasTransp.filter(function(e){ return e.locacao_id===l.id; }).length; }, 0);
  const ganhosTransp = locsFechadasTransp.reduce(function(a,l){ return a + (l.atraso ? 0 : etapasTransp.filter(function(e){ return e.locacao_id===l.id && e.concluida; }).length); }, 0);
  const pctTransp = possiveisTransp ? Math.round((ganhosTransp/possiveisTransp)*100) : 0;
  const ganhandoTransp = pctTransp >= 80;
  const premioCardHtml = '<div class="card premio-card"><div class="premio-head"><h3>🏆 Prêmio Logística</h3><span class="premio-valor">R$ 500,00</span></div>' +
    '<p class="cardsub" style="margin-bottom:2px;">Bate 80% das metas do mês pra ganhar.</p>' +
    '<div class="premio-barra"><div class="premio-fill ' + (ganhandoTransp?"":"abaixo") + '" style="width:' + Math.min(pctTransp,100) + '%;"></div><div class="premio-meta-marca" style="left:80%;"></div></div>' +
    '<div class="premio-rodape"><span>' + ganhosTransp + " / " + possiveisTransp + " pontos (" + pctTransp + '%)</span><span class="premio-status ' + (ganhandoTransp?"status-ok":"status-wait") + '">' + (ganhandoTransp ? "🏆 Ganhando o prêmio" : ("Faltam " + (80-pctTransp) + " pontos percentuais")) + "</span></div></div>";
  content.insertAdjacentHTML("afterbegin", premioCardHtml);
  content.insertAdjacentHTML("afterbegin", resumoCardHtml);
}

let premiacaoSelfieAlvo = null;
function iniciarSelfiePremiacao(dataRef){
  premiacaoSelfieAlvo = dataRef;
  let input = document.getElementById('premiacao-input-camera');
  if(!input){
    input = document.createElement('input');
    input.type = 'file'; input.accept = 'image/*'; input.capture = 'user';
    input.id = 'premiacao-input-camera'; input.style.display = 'none';
    document.body.appendChild(input);
    input.addEventListener('change', onPremiacaoSelfieFile);
  }
  input.click();
}
function premiacaoFileToDataURL(file){
  return new Promise(function(resolve, reject){
    const reader = new FileReader();
    reader.onload = function(){ resolve(reader.result); };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function onPremiacaoSelfieFile(e){
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if(!file || !premiacaoSelfieAlvo) return;
  const dataRef = premiacaoSelfieAlvo;
  const getGeo = function(){
    return new Promise(function(resolve){
      if(!navigator.geolocation){ resolve(null); return; }
      navigator.geolocation.getCurrentPosition(
        function(pos){ resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude }); },
        function(){ resolve(null); },
        { timeout: 4000 }
      );
    });
  };
  const dataUrl = await premiacaoFileToDataURL(file);
  const geo = await getGeo();
  await sb.from('premiacao_selfies_dia').upsert({
    motorista_id: currentUsuario.id, data_ref: dataRef,
    enviada: true, validada: null, motivo: null,
    geo_lat: geo ? geo.lat : null, geo_lng: geo ? geo.lng : null,
    enviada_em: new Date().toISOString()
  }, { onConflict: 'motorista_id,data_ref' });
  await tsCarregarLocacoesInner();
  try {
    const resp = await fetch('/api/validar-selfie', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ image: dataUrl })
    });
    const json = await resp.json();
    if(json && typeof json.aprovado === 'boolean'){
      if(json.aprovado){
        await sb.from('premiacao_selfies_dia').update({ validada: true, motivo: null, validada_em: new Date().toISOString() }).eq('motorista_id', currentUsuario.id).eq('data_ref', dataRef);
      } else {
        await sb.from('premiacao_selfies_dia').update({ validada: false, motivo: 'reprovada', validada_em: new Date().toISOString() }).eq('motorista_id', currentUsuario.id).eq('data_ref', dataRef);
      }
    }
  } catch(err){}
  await tsCarregarLocacoesInner();
}


function expandCartuchos(list, duplicados){
  const dup = duplicados || [];
  const out = [];
  list.forEach(function(item){
    if(dup.indexOf(item.key) !== -1){
      out.push({ key: item.key + '__1', label: item.label + ' (1)' });
      out.push({ key: item.key + '__2', label: item.label + ' (2)' });
    } else {
      out.push(item);
    }
  });
  return out;
}

function baseCartKey(key){ return key.split('__')[0]; }

function cartuchoFieldsHtml(rId, prefix, listaLinear, listaBooster, valoresBase, duplicados){
  const expLinear = expandCartuchos(listaLinear, duplicados);
  const expBooster = expandCartuchos(listaBooster, duplicados);
  function linha(item){
    const base = (valoresBase && valoresBase[item.key] != null) ? valoresBase[item.key] : '';
    const hint = base !== '' ? ' <span class="field-hint" style="color:var(--gray-soft);">(entrega: ' + base + ')</span>' : '';
    const inputId = 'cart-' + prefix + '-' + rId + '-' + item.key;
    return '<div class="insumo-row"><span style="flex:1;font-size:13.5px;">' + item.label + hint + '</span>' +      '<input type="number" min="0" class="cart-input" id="' + inputId + '" data-key="' + item.key + '" data-label="' + item.label + '" style="width:90px;" placeholder="0">' +
      '<label class="btn btn-ghost btn-sm cart-photo-btn" style="cursor:pointer;padding:8px 10px;">📷' +
        '<input type="file" accept="image/*" capture="environment" class="cart-photo-input" data-target="' + inputId + '" style="display:none;">' +
      '</label>' +
      '</div>';
  }
  let html = '<div class="field"><label>Cartuchos Linear <span style="font-weight:400;color:var(--gray-soft);">(tire foto da tela pra ler automaticamente)</span></label>' + expLinear.map(linha).join('') + '</div>';
  html += '<div class="field"><label>Cartuchos Booster</label>' + expBooster.map(linha).join('') + '</div>';
  return html;
}

function fileToDataURL(file){
  return new Promise(function(resolve, reject){
    const reader = new FileReader();
    reader.onload = function(){ resolve(reader.result); };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function wireCartPhotoInputs(container){
  container.querySelectorAll('.cart-photo-input').forEach(function(inp){
    inp.addEventListener('change', async function(){
      const file = inp.files[0];
      if(!file) return;
      const targetInput = document.getElementById(inp.dataset.target);
      const label = inp.closest('.cart-photo-btn');
      const original = label.firstChild.textContent;
      label.firstChild.textContent = '...';
      try{
        const dataUrl = await fileToDataURL(file);
        const resp = await fetch('/api/ler-disparo', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ image: dataUrl }) });
        const data = await resp.json();
        if(data && data.valor != null){ targetInput.value = data.valor; }
        else{ alert('Não consegui ler o número na foto. Preencha manualmente.'); }
      }catch(e){
        alert('Erro ao ler foto: ' + e.message);
      }finally{
        label.firstChild.textContent = original;
      }
    });
  });
}

    let cartuchos = r.cartuchos || {linear:[], booster:[]};

function abrirPainelRetirada(r){
  const isCrio = r.equipamento === 'crio';
  const panel = document.getElementById('panel-' + r.id);
  const valoresEntregaLinear = (!isCrio && r.cartuchos && r.cartuchos.linear && r.cartuchos.linear[0]) ? r.cartuchos.linear[0].valores : {};
  const valoresEntregaBooster = (!isCrio && r.cartuchos && r.cartuchos.booster && r.cartuchos.booster[0]) ? r.cartuchos.booster[0].valores : {};
  const valoresEntregaTudo = Object.assign({}, valoresEntregaLinear, valoresEntregaBooster);
  const mantaEntregaQtd = (isCrio && r.manta && r.manta.entrega) ? (r.manta.entrega.quantidade || 0) : 0;

  panel.innerHTML =
    '<div class="card" style="margin-top:14px;background:var(--paper-soft);">' +
      '<h3 style="font-size:14px;margin-bottom:12px;">Registro de retirada</h3>' +
      (isCrio
        ? '<div class="field"><label>Quantidade de manta retirada <span style="color:var(--gray-soft);font-weight:400;">(entregue: ' + mantaEntregaQtd + ')</span></label><input type="number" min="0" id="manta-retirada-' + r.id + '" placeholder="0"></div>'
        : cartuchoFieldsHtml(r.id, 'ret', LINEAR, BOOSTER, valoresEntregaTudo, r.cartuchos_duplicados)
      ) +
      '<div class="field"><label>Assinatura da doutora (fechamento)</label><canvas class="sig-canvas" id="sig-fechamento-' + r.id + '" style="width:100%;height:140px;background:#fff;border:1.5px dashed var(--line);border-radius:4px;"></canvas>' +
        '<button type="button" class="btn btn-ghost btn-sm" style="margin-top:6px;" id="btn-limpar-sig2-' + r.id + '">Limpar assinatura</button>' +
      '</div>' +
      '<div id="err-retirada-' + r.id + '" class="login-error" style="display:none;"></div>' +
      '<button class="btn btn-primary btn-block" id="btn-confirmar-retirada-' + r.id + '">Confirmar retirada</button>' +
    '</div>';

  wireCartPhotoInputs(panel);
  const pad = initSignaturePad('sig-fechamento-' + r.id);  document.getElementById('btn-limpar-sig2-' + r.id).addEventListener('click', function(){ pad.clear(); });

  document.getElementById('btn-confirmar-retirada-' + r.id).addEventListener('click', async function(){
    const errEl = document.getElementById('err-retirada-' + r.id);
    errEl.style.display = 'none';
    if(pad.isEmpty()){ errEl.textContent = 'Colete a assinatura antes de confirmar.'; errEl.style.display='block'; return; }

    let cartuchos = r.cartuchos || {linear:[], booster:[]};
    let manta = r.manta || {entrega:{}, retorno:{}};
    const leituras = [];

    if(isCrio){
      const qtd = parseInt(document.getElementById('manta-retirada-' + r.id).value, 10) || 0;
      manta = { entrega: manta.entrega || {}, retorno: { quantidade: qtd, ts: new Date().toISOString() } };
      leituras.push('Manta retirada: ' + qtd + ' (entregue: ' + mantaEntregaQtd + ')');
    } else {
      const retiradaLinear = {};
      const retiradaBooster = {};
      panel.querySelectorAll('.cart-input').forEach(function(inp){
        const key = inp.dataset.key;
        const val = parseInt(inp.value, 10) || 0;
        const isBooster = BOOSTER.some(function(b){ return b.key === baseCartKey(key); });
        if(isBooster) retiradaBooster[key] = val; else retiradaLinear[key] = val;
        const base = valoresEntregaTudo[key];
        const diff = (base != null) ? (base - val) : null;
        leituras.push(inp.dataset.label + ': ' + val + (diff != null ? ' (usados: ' + diff + ')' : ''));
      });
      const entregaEntry = cartuchos.linear && cartuchos.linear[0] ? cartuchos.linear[0] : { valores: {} };
      const entregaEntryB = cartuchos.booster && cartuchos.booster[0] ? cartuchos.booster[0] : { valores: {} };
      cartuchos = {
        linear: [entregaEntry, { etapa: 'retirada', valores: retiradaLinear, ts: new Date().toISOString() }],
        booster: [entregaEntryB, { etapa: 'retirada', valores: retiradaBooster, ts: new Date().toISOString() }]
      };
    }

    const btn = document.getElementById('btn-confirmar-retirada-' + r.id);
    btn.disabled = true; btn.textContent = 'Salvando...';

    const assinaturaUrl = pad.toDataURL();
    let pdfUrl = null;
    try{ pdfUrl = gerarPDFControle(r, 'fechamento', assinaturaUrl, leituras); }catch(e){}

    const result = await sb.from('controles_insumos').update({
      cartuchos: cartuchos,
      manta: manta,
      assinatura_fechamento_url: assinaturaUrl,
      pdf_fechamento_url: pdfUrl,
      status: 'retirado',
      retirado_em: new Date().toISOString()
    }).eq('id', r.id);

    if(result.error){ errEl.textContent = 'Erro: ' + result.error.message; errEl.style.display='block'; btn.disabled=false; btn.textContent='Confirmar retirada'; return; }
    await carregarControlesTransportes();
  });
}

var last = new Date(y, m+1, 0).toISOString().slice(0,10);

function opDataBR(iso){ if(!iso) return "-"; const p = iso.split("-"); return p[2] + "/" + p[1] + "/" + p[0]; }
function opMesAnoLabel(iso){
  const nomes = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
  const p = iso.split("-");
  return nomes[parseInt(p[1],10)-1] + "/" + p[0];
}
function opSomaMeses(iso, n){
  const p = iso.split("-").map(Number);
  const dt = new Date(p[0], p[1]-1+n, p[2]);
  return dt.getFullYear() + "-" + String(dt.getMonth()+1).padStart(2,"0") + "-" + String(dt.getDate()).padStart(2,"0");
}
function opMesesEntre(hoje, alvo){
  const a = hoje.split("-").map(Number), b = alvo.split("-").map(Number);
  return (b[0]-a[0])*12 + (b[1]-a[1]);
}
function opStatusDe(renovacao){
  const hoje = premiacaoIsoHoje(0);
  const meses = opMesesEntre(hoje, renovacao);
  if(meses <= 0) return { cls:"vermelho", label:"No mês da renovação" };
  if(meses <= 2) return { cls:"amarelo", label: meses + " mes(es) pra renovar" };
  return { cls:"verde", label: meses + " mes(es) pra renovar" };
}
const OP_STATUS_CLASS = { verde:"status-ok", amarelo:"status-wait", vermelho:"status-wait", cotacao:"status-info" };

function opManutRenderAlerta(){
  const wrap = document.getElementById("op-manut-alerta");
  const equip = window.__opManutEquip || [];
  const emCotacao = equip.filter(function(e){ return e.status === "em_cotacao"; });
  const proximos = equip.filter(function(e){ return e.status !== "em_cotacao"; })
    .map(function(e){ return { e:e, meses: opMesesEntre(premiacaoIsoHoje(0), e.renovacao) }; })
    .filter(function(x){ return x.meses <= 1; })
    .sort(function(a,b){ return a.meses - b.meses; });
  if(!emCotacao.length && !proximos.length){
    wrap.innerHTML = '<div class="card" style="padding:14px 18px;margin-bottom:20px;color:var(--gray);font-size:13px;">✅ Nenhuma manutenção precisando de atenção agora.</div>';
    return;
  }
  wrap.innerHTML = '<div class="card" style="padding:16px 18px;margin-bottom:20px;background:var(--alert-bg);border-color:#e8cabd;"><h3 style="color:var(--alert);font-size:16px;">🔔 ' + (emCotacao.length+proximos.length) + ' equipamento(s) pra realizar</h3>' +
    '<p class="cardsub" style="color:#7a5c14;">Faltando 1 mês ou menos, ou já em cotação.</p>' +
    emCotacao.map(function(e){ return '<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #ecd3c8;"><b>' + escapeHtml(e.nome) + '</b><span class="status-pill status-info"><span class="dot"></span>Em cotação</span></div>'; }).join("") +
    proximos.map(function(x){ const st = opStatusDe(x.e.renovacao); return '<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #ecd3c8;"><div><b>' + escapeHtml(x.e.nome) + '</b> — renovação em ' + opDataBR(x.e.renovacao) + '</div><span class="status-pill ' + OP_STATUS_CLASS[st.cls] + '"><span class="dot"></span>' + st.label + '</span></div>'; }).join("") +
    '</div>';
}

function opManutRenderHistorico(){
  const tbody = document.getElementById("op-manut-hist-tbody");
  const busca = (document.getElementById("om-busca").value || "").toLowerCase();
  const hist = window.__opManutHist || [];
  const filtrado = hist.filter(function(h){
    return !busca || [h.nome, h.quem, h.laudo_path, h.nfe_path].some(function(v){ return (v||"").toLowerCase().includes(busca); });
  });
  if(!filtrado.length){ tbody.innerHTML = '<tr><td colspan="6" class="empty-hint">Nenhum registro encontrado.</td></tr>'; return; }
  tbody.innerHTML = filtrado.map(function(h){
    const anexos = [
      h.laudo_path ? '<a href="' + h.laudo_path + '" target="_blank" rel="noopener" style="color:var(--wine);text-decoration:underline;font-size:12.5px;">📄 Laudo</a>' : "",
      h.nfe_path ? '<a href="' + h.nfe_path + '" target="_blank" rel="noopener" style="color:var(--wine);text-decoration:underline;font-size:12.5px;">🧾 NFe</a>' : ""

async function opUploadArquivo(file){
  if(!file) return null;
  const path = Date.now() + "_" + Math.random().toString(36).slice(2) + "_" + file.name;
  const up = await sb.storage.from("manutencoes").upload(path, file);
  if(up.error){ toast("Erro ao enviar arquivo: " + up.error.message); return null; }
  const pub = sb.storage.from("manutencoes").getPublicUrl(path);
  return pub.data.publicUrl;
}

function opSegRenderAlerta(){
  const wrap = document.getElementById("op-seg-alerta");
  const seguros = window.__opSeguros || [];
  const emCotacao = seguros.filter(function(s){ return s.status === "em_cotacao"; });
  const proximos = seguros.filter(function(s){ return s.status !== "em_cotacao"; })
    .map(function(s){ return { s:s, meses: opMesesEntre(premiacaoIsoHoje(0), s.renovacao) }; })
    .filter(function(x){ return x.meses <= 1; })
    .sort(function(a,b){ return a.meses - b.meses; });
  if(!emCotacao.length && !proximos.length){
    wrap.innerHTML = '<div class="card" style="padding:14px 18px;margin-bottom:20px;color:var(--gray);font-size:13px;">✅ Nenhum seguro precisando de atenção agora.</div>';
    return;
  }
  wrap.innerHTML = '<div class="card" style="padding:16px 18px;margin-bottom:20px;background:var(--alert-bg);border-color:#e8cabd;"><h3 style="color:var(--alert);font-size:16px;">🔔 ' + (emCotacao.length+proximos.length) + ' seguro(s) pra renovar</h3>' +
    '<p class="cardsub" style="color:#7a5c14;">Faltando 1 mês ou menos, ou já em cotação.</p>' +
    emCotacao.map(function(s){ return '<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #ecd3c8;"><b>' + escapeHtml(s.nome) + '</b><span class="status-pill status-info"><span class="dot"></span>Em cotação</span></div>'; }).join("") +
    proximos.map(function(x){ const st = opStatusDe(x.s.renovacao); return '<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #ecd3c8;"><div><b>' + escapeHtml(x.s.nome) + '</b> — renovação em ' + opDataBR(x.s.renovacao) + '</div><span class="status-pill ' + OP_STATUS_CLASS[st.cls] + '"><span class="dot"></span>' + st.label + '</span></div>'; }).join("") +

    const cotar = opMesAnoLabel(opSomaMeses(s.renovacao, -1));
    let statusHtml, acaoHtml;
    if(s.status === "em_cotacao"){
      statusHtml = '<span class="status-pill status-info"><span class="dot"></span>Em cotação</span>';

        });
        html += '</div>';
      }
    }    window.__opLocacoes = locs; window.__opEtapasPorLoc = etapasPorLoc; window.__opMotoristaNome = motoristaNome;
  window.__opLocsAbertasExp = window.__opLocsAbertasExp || {};
  if(opTabAtual === "aberta"){
    html += locsFiltradas.map(function(loc){
      const eq = PREMIACAO_EQUIP[loc.equipamento] || { label: loc.equipamento };
      const etapas = etapasPorLoc[loc.id] || [];
      const feitas = etapas.filter(function(e){ return e.concluida; }).length;
      const total = etapas.length;
      const nomeMotor = escapeHtml(motoristaNome[loc.motorista_id]||"");
      const dias = Math.max(0, Math.floor((Date.now() - new Date(loc.data_locacao).getTime()) / 86400000));

          '<div style="display:flex;align-items:center;gap:12px;flex-shrink:0;">' +
          '<span style="font-size:12.5px;color:var(--gray);">' + feitas + "/" + total + ' etapas</span>' +
          '<span style="font-size:14px;color:var(--gray);">' + (aberto?"▴":"▾") + '</span></div>' +

  } else {
    html += '<div class="card" style="padding:4px 0;overflow-x:auto;"><table style="width:100%;border-collapse:collapse;font-size:13px;">' +
      '<thead><tr><th style="text-align:left;padding:9px 10px;border-bottom:2px solid var(--line);font-size:11px;text-transform:uppercase;color:var(--gray);">#</th><th style="text-align:left;padding:9px 10px;border-bottom:2px solid var(--line);font-size:11px;text-transform:uppercase;color:var(--gray);">Equipamento</th><th style="text-align:left;padding:9px 10px;border-bottom:2px solid var(--line);font-size:11px;text-transform:uppercase;color:var(--gray);">Motorista</th><th style="text-align:left;padding:9px 10px;border-bottom:2px solid var(--line);font-size:11px;text-transform:uppercase;color:var(--gray);">Etapas</th><th style="text-align:left;padding:9px 10px;border-bottom:2px solid var(--line);font-size:11px;text-transform:uppercase;color:var(--gray);">Atraso</th><th style="text-align:left;padding:9px 10px;border-bottom:2px solid var(--line);font-size:11px;text-transform:uppercase;color:var(--gray);">Pontos</th><th></th></tr></thead><tbody>' +
      locsFiltradas.map(function(loc){
        const eq = PREMIACAO_EQUIP[loc.equipamento] || { label: loc.equipamento };
        const etapas = etapasPorLoc[loc.id] || [];
        const feitas = etapas.filter(function(e){ return e.concluida; }).length;

          '<td style="padding:11px 10px;">' + feitas + "/" + total + '</td>' +
          '<td style="padding:11px 10px;"><span style="font-size:12px;padding:2px 10px;border-radius:12px;font-weight:600;' + (loc.atraso?"background:var(--alert-bg);color:var(--alert);":"background:var(--ok-bg);color:var(--ok);") + '">' + (loc.atraso?"Sim":"Não") + '</span></td>' +
          '<td style="padding:11px 10px;">' + pontos + ' pts</td>' +
          '<td style="padding:11px 10px;"><a href="#" onclick="opAbrirDetalhesLocFechada(&quot;' + loc.id + '&quot;);return false;" style="color:var(--wine);text-decoration:underline;font-size:12.5px;">ver detalhes</a></td>' +
          '</tr>';
      }).join("") +
      '</tbody></table></div>';
  }
  }
  const dados = {};
  motoristas.forEach(function(m){ dados[m.id] = { nome: m.nome, pontos: 0, possiveis: 0 }; });
  locs.forEach(function(loc){
    const etapas = etapasPorLoc[loc.id] || [];
    etapas.forEach(function(e){
      const resp = e.motorista_id || loc.motorista_id;
      if(!dados[resp]) dados[resp] = { nome: motoristaNome[resp] || '-', pontos: 0, possiveis: 0 };
      dados[resp].possiveis += 1;
      if(e.concluida && !loc.atraso) dados[resp].pontos += 1;
    });
  });
  paresList.forEach(function(par){
    const s = selfiesPorPar[par.motorista_id + '|' + par.data_ref];
    const resp = par.motorista_id;
    if(!dados[resp]) dados[resp] = { nome: motoristaNome[resp] || '-', pontos: 0, possiveis: 0 };
    dados[resp].possiveis += PONTOS_UNIFORME_PREMIACAO;
    if(s && s.validada === true) dados[resp].pontos += PONTOS_UNIFORME_PREMIACAO;
    else if(s && s.validada === false && s.motivo === 'expirada') dados[resp].pontos -= PONTOS_UNIFORME_PREMIACAO;
  });
  const ranking = Object.values(dados).filter(function(r){ return r.possiveis > 0; }).sort(function(a,b){ return (b.pontos/b.possiveis) - (a.pontos/a.possiveis); });
  let rankingHtml = "";
  if(!ranking.length){
    rankingHtml += '<div class="card form-card" style="margin-top:20px;"><h3 style="font-size:16px;">🏆 Quem está ganhando o Prêmio Logística</h3><p class="empty-hint">Sem dados ainda.</p></div>';

async function togglePremiacaoAtraso(locId, checked){
  await sb.from("premiacao_locacoes").update({ atraso: checked, atualizado_em: new Date().toISOString() }).eq("id", locId);
  toast(checked ? "Atraso marcado — pontos da locação zerados." : "Atraso desmarcado.");
  await carregarPremiacaoOperacional(true);
}
const PRAZO_CONTESTACAO_DIAS = 3;
function tsDiasEntre(iso1, iso2){ const d1 = new Date(iso1); const d2 = new Date(iso2); return Math.round((d2-d1)/86400000); }

async function tsCarregarHistoricoInner(){
  const content = document.getElementById("ts-prem-content");
  content.innerHTML = '<p class="empty-hint">Carregando...</p>';
  const rLoc = await sb.from("premiacao_locacoes").select("id,numero,equipamento,data_locacao,status,atraso,atualizado_em").eq("motorista_id", currentUsuario.id).eq("status","fechada").order("atualizado_em", { ascending:false });
  if(rLoc.error){ content.innerHTML = '<p class="empty-hint">Erro: ' + escapeHtml(rLoc.error.message) + '</p>'; return; }
  const locs = rLoc.data || [];
  const ids = locs.map(function(l){ return l.id; });
  const rEtapas = ids.length ? await sb.from("premiacao_etapas").select("locacao_id,ordem,nome,concluida").in("locacao_id", ids).order("ordem") : { data: [] };
  const rContest = ids.length ? await sb.from("premiacao_contestacoes").select("*").in("locacao_id", ids) : { data: [] };
  window.__tsHistLocs = locs;
  window.__tsHistEtapas = rEtapas.data || [];
  window.__tsHistContest = rContest.data || [];
  window.__tsHistExpandido = window.__tsHistExpandido || {};
  tsRenderHistorico();
}

function tsRenderHistorico(){
  const content = document.getElementById("ts-prem-content");
  const locs = window.__tsHistLocs || [];
  let html = '<div class="card" style="padding:22px;">';
  if(!locs.length){ html += '<p class="empty-hint">Nenhuma locação fechada ainda.</p>'; }
  else {
    html += locs.map(function(l){
      const etapas = (window.__tsHistEtapas||[]).filter(function(e){ return e.locacao_id === l.id; });
      const nFeitas = etapas.filter(function(e){ return e.concluida; }).length;
      const pts = l.atraso ? 0 : nFeitas;
      const contest = (window.__tsHistContest||[]).find(function(c){ return c.locacao_id === l.id; });
      const aberto = !!window.__tsHistExpandido[l.id];
      let contestBadge = "";
      if(contest){
        const map = { pendente:["status-wait","Contestação enviada"], aceita:["status-ok","Contestação aceita"], rejeitada:["status-wait","Contestação rejeitada"], reaberta:["status-wait","Reaberta"] };
        const m = map[contest.status] || ["status-wait", contest.status];
        contestBadge = '<span class="status-pill ' + m[0] + '"><span class="dot"></span>' + m[1] + '</span>';
      }
      let corpo = '<div style="padding:14px 16px;cursor:pointer;display:flex;align-items:center;gap:10px;" onclick="tsToggleHistorico(&quot;' + l.id + '&quot;)">' +
        '<span style="width:14px;color:var(--gray-soft);">' + (aberto?"▾":"▸") + '</span>' +
        '<b style="flex:1;">#' + escapeHtml(String(l.numero||"")) + " " + escapeHtml(l.equipamento||"") + '</b>' +
        (l.atraso ? '<span class="status-pill status-wait"><span class="dot"></span>Atraso</span>' : "") +
        contestBadge +
        '<span style="font-weight:700;">' + pts + " / " + etapas.length + ' pts</span></div>';
      if(aberto){
        corpo += '<div style="padding:0 16px 16px;">';
        corpo += etapas.map(function(e){
          return '<div style="display:flex;gap:10px;padding:6px 0;font-size:13px;border-bottom:1px solid var(--paper-soft);"><span style="width:16px;color:' + (e.concluida?"var(--ok)":"var(--gray-soft)") + ';">' + (e.concluida?"✓":"○") + '</span><span>' + e.ordem + ". " + escapeHtml(e.nome) + '</span></div>';
        }).join("");
        if(contest){
          corpo += '<div style="margin-top:10px;padding:10px 12px;background:var(--paper-soft);border-radius:6px;font-size:12.5px;"><b>Sua contestação:</b> ' + escapeHtml(contest.texto) + '</div>';
        } else {
          const dias = tsDiasEntre(l.atualizado_em, new Date().toISOString());
          if(dias <= PRAZO_CONTESTACAO_DIAS){
            corpo += '<button class="btn btn-ghost" style="margin-top:12px;" onclick="tsAbrirContestacao(&quot;' + l.id + '&quot;)">Contestar esta locação</button>';
            corpo += '<div class="cardsub" style="margin-top:6px;">Prazo pra contestar: mais ' + (PRAZO_CONTESTACAO_DIAS - dias) + ' dia(s).</div>';
          } else {
            corpo += '<div class="cardsub">Prazo de ' + PRAZO_CONTESTACAO_DIAS + ' dias pra contestar já passou.</div>';
          }
        }
        corpo += "</div>";
      }
      return '<div style="border-bottom:1px solid var(--line);">' + corpo + "</div>";
    }).join("");
  }
  html += "</div>";
  content.innerHTML = html;
}

function tsToggleHistorico(id){
  window.__tsHistExpandido[id] = !window.__tsHistExpandido[id];
  tsRenderHistorico();
}

function tsAbrirContestacao(locId){
  let overlay = document.getElementById("ts-contest-overlay");
  if(overlay) overlay.remove();
  overlay = document.createElement("div");
  overlay.id = "ts-contest-overlay";
  overlay.style.cssText = "position:fixed;inset:0;background:rgba(23,19,15,.45);display:flex;align-items:center;justify-content:center;z-index:200;";
  overlay.innerHTML = '<div class="card form-card" style="max-width:440px;width:92%;margin:0;"><h3>Contestar locação</h3>' +
    '<p class="cardsub">Explique o que você acha que foi marcado errado. O Operacional vai receber um alerta.</p>' +
    '<textarea id="ts-contest-texto" rows="4" style="width:100%;margin-top:10px;padding:9px 10px;border:1px solid var(--line);border-radius:6px;font-size:13.5px;font-family:inherit;" placeholder="Ex: Não atrasei, o EstoqueNOW caiu no meio da entrega..."></textarea>' +
    '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px;"><button class="btn btn-ghost" onclick="tsFecharContestacao()">Cancelar</button><button class="btn btn-primary" onclick="tsEnviarContestacao(&quot;' + locId + '&quot;)">Enviar contestação</button></div></div>';
  document.body.appendChild(overlay);
}
function tsFecharContestacao(){ const o = document.getElementById("ts-contest-overlay"); if(o) o.remove(); }
async function tsEnviarContestacao(locId){
  const texto = document.getElementById("ts-contest-texto").value.trim();
  if(!texto){ toast("Escreva o que você acha que está errado."); return; }
  const r = await sb.from("premiacao_contestacoes").insert({ locacao_id: locId, motorista_id: currentUsuario.id, texto: texto });
  if(r.error){ toast("Erro: " + r.error.message); return; }
  tsFecharContestacao();
  toast("Contestação enviada ao Operacional.");
  await tsCarregarHistoricoInner();
}

async function abrirModalContestacao(contestId){
  const c = (window.__opContestacoes||[]).find(function(x){ return x.id === contestId; });
  if(!c) return;
  const rEtapas = await sb.from("premiacao_etapas").select("id,ordem,nome,concluida").eq("locacao_id", c.locacao_id).order("ordem");
  const etapas = rEtapas.data || [];
  const rLoc = await sb.from("premiacao_locacoes").select("numero,equipamento,atraso").eq("id", c.locacao_id).maybeSingle();
  const loc = rLoc.data || {};
  let overlay = document.getElementById("op-contest-modal");
  if(overlay) overlay.remove();
  overlay = document.createElement("div");
  overlay.id = "op-contest-modal";
  overlay.className = "modal-overlay";
  let etapasHtml = etapas.map(function(e){
    return '<div class="etapa-row" style="padding:6px 0;"><input type="checkbox" class="etapa-check" id="cxop-' + e.id + '" ' + (e.concluida?"checked":"") + '><span class="etapa-label" style="font-size:13px;">' + e.ordem + ". " + escapeHtml(e.nome) + "</span></div>";
  }).join("");
  overlay.innerHTML = '<div class="card form-card modal-box"><h3>Contestação — #' + (loc.numero||"") + " " + escapeHtml(loc.equipamento||"") + '</h3>' +
    '<p class="cardsub">' + escapeHtml(c.texto) + '</p>' +
    '<div style="display:flex;align-items:center;gap:10px;margin:14px 0 10px;"><input type="checkbox" id="cxop-atraso" ' + (loc.atraso?"checked":"") + '><label for="cxop-atraso" style="font-weight:600;color:var(--alert);">Teve atraso em alguma etapa</label></div>' +
    etapasHtml +
    '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap;">' +
    '<button class="btn btn-ghost btn-sm" onclick="rejeitarContestacaoOp(&quot;' + c.id + '&quot;)">Rejeitar contestação</button>' +
    '<button class="btn btn-ghost btn-sm" onclick="reabrirLocacaoOp(&quot;' + c.id + '&quot;,&quot;' + c.locacao_id + '&quot;)">Reabrir locação</button>' +
    '<button class="btn btn-primary btn-sm" onclick="salvarAjusteContestacaoOp(&quot;' + c.id + '&quot;,&quot;' + c.locacao_id + '&quot;)">Salvar ajustes</button>' +
    "</div></div>";
  document.body.appendChild(overlay);
}
function fecharModalContestacao(){ const o = document.getElementById("op-contest-modal"); if(o) o.remove(); }

async function rejeitarContestacaoOp(contestId){
  await sb.from("premiacao_contestacoes").update({ status:"rejeitada", resolvido_em: new Date().toISOString(), resolvido_por: currentUsuario.id }).eq("id", contestId);
  fecharModalContestacao();
  toast("Contestação rejeitada — nada muda na locação.");
  await carregarPremiacaoOperacional(true);
}
async function reabrirLocacaoOp(contestId, locId){
  await sb.from("premiacao_locacoes").update({ status:"aberta" }).eq("id", locId);
  await sb.from("premiacao_contestacoes").update({ status:"reaberta", resolvido_em: new Date().toISOString(), resolvido_por: currentUsuario.id }).eq("id", contestId);
  fecharModalContestacao();
  toast("Locação reaberta pra correção.");
  await carregarPremiacaoOperacional(true);
}
async function salvarAjusteContestacaoOp(contestId, locId){
  const atraso = document.getElementById("cxop-atraso").checked;
  const checks = Array.from(document.querySelectorAll('[id^="cxop-"]')).filter(function(el){ return el.id !== "cxop-atraso"; });
  for(const chk of checks){
    const etapaId = chk.id.replace("cxop-", "");
    await sb.from("premiacao_etapas").update({ concluida: chk.checked }).eq("id", etapaId);
  }
  await sb.from("premiacao_locacoes").update({ atraso: atraso }).eq("id", locId);
  await sb.from("premiacao_contestacoes").update({ status:"aceita", resolvido_em: new Date().toISOString(), resolvido_por: currentUsuario.id }).eq("id", contestId);
  fecharModalContestacao();
  toast("Ajustes salvos — pontuação atualizada, sem precisar reabrir.");
  await carregarPremiacaoOperacional(true);
}

async function atualizarBadgeContestacoesSidebar(){
  try {
    const r = await sb.from("premiacao_contestacoes").select("id").eq("status","pendente");

    if(el) el.innerHTML = n > 0 ? ('<span class="badge-alerta">' + n + "</span>") : "";

}

  window.__opLocsAbertasExp = window.__opLocsAbertasExp || {};

async function togglePremiacaoEtapa(etapaId, locId, checked){
  const updates = { concluida: checked };
  if(checked){
    const locResult = await sb.from('premiacao_locacoes').select('motorista_id').eq('id', locId).single();
    updates.motorista_id = locResult.data ? locResult.data.motorista_id : null;
    updates.concluida_em = new Date().toISOString();
  } else {
    updates.motorista_id = null;
    updates.concluida_em = null;
  }
  await sb.from('premiacao_etapas').update(updates).eq('id', etapaId);
  await carregarPremiacaoOperacional(true);
}

async function finalizarLocacaoPremiacao(locId, feitas, total){
  if(feitas < total){
    const ok = confirm('Esta locação tem ' + (total-feitas) + ' etapa(s) não marcadas, que não vão pontuar. Finalizar mesmo assim?');
    if(!ok) return;
  }
  await sb.from('premiacao_locacoes').update({ status: 'fechada', atualizado_em: new Date().toISOString() }).eq('id', locId);
  await carregarPremiacaoOperacional(true);
}

async function virarDiaPremiacao(){
  const hoje = premiacaoIsoHoje(0);
  const result = await sb.from('premiacao_locacoes').select('motorista_id,data_locacao').lt('data_locacao', hoje);
  const locs = result.data || [];
  const paresSet = {};
  const pares = [];
  locs.forEach(function(loc){
    const chave = loc.motorista_id + '|' + loc.data_locacao;
    if(!paresSet[chave]){ paresSet[chave] = true; pares.push({ motorista_id: loc.motorista_id, data_ref: loc.data_locacao }); }
  });
  let n = 0;
  for(const par of pares){
    const sResult = await sb.from('premiacao_selfies_dia').select('validada,motivo').eq('motorista_id', par.motorista_id).eq('data_ref', par.data_ref).maybeSingle();
    const s = sResult.data;
    if(!s || (s.validada !== true && s.motivo !== 'expirada')){
      await sb.from('premiacao_selfies_dia').upsert({ motorista_id: par.motorista_id, data_ref: par.data_ref, validada: false, motivo: 'expirada', enviada: false, validada_em: new Date().toISOString() }, { onConflict: 'motorista_id,data_ref' });
      n++;
    }
  }
  alert(n > 0 ? (n + ' selfie(s) expiraram sem validação.') : 'Nenhuma selfie vencida no momento.');
  await carregarPremiacaoOperacional(true);
}
