<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>RJX &middot; Intranet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="assets/logo-black.png">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{
  --paper:#faf7f2; --paper-soft:#f1ebe1; --line:#e4dccd;
  --ink:#17130f; --ink-soft:#362f29; --gray:#5c554e; --gray-soft:#8a8377;
  --wine:#7a1220; --wine-dark:#591019; --wine-bright:#b81f2b; --gold:#a9813f;
  --ok:#3f6b52; --ok-bg:#eaf1ec; --alert:#8a2e1f; --alert-bg:#f6e6e0;
  --wait:#8a5a12; --wait-bg:#f7ecd9; --info:#2c4a66; --info-bg:#e9eef3;
  --radius:8px;
  --dark:#17130f;
}
*{box-sizing:border-box;}
html,body{margin:0;background:#dedcc8;font-family:'Source Sans 3',-apple-system,sans-serif;color:var(--ink);min-height:100vh;}
#app{min-height:100vh;}
.topbar{background:var(--ink);color:#fff;padding:0 20px;display:flex;align-items:center;gap:16px;height:56px;}
.topbar .logo{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:19px;letter-spacing:.3px;}
.topbar .logo span{color:var(--gold);font-weight:400;font-size:11px;letter-spacing:1.5px;margin-left:6px;text-transform:uppercase;}
.topbar-user{margin-left:auto;font-size:13px;color:#cfc9bd;display:flex;align-items:center;gap:12px;}
.btn-logout{background:transparent;border:1px solid #55504a;color:#fff;padding:6px 12px;border-radius:var(--radius);font-size:12.5px;cursor:pointer;}
.btn-logout:hover{border-color:var(--wine-bright);}

.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.login-box{width:100%;max-width:360px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:36px 32px;box-shadow:0 10px 30px rgba(0,0,0,.15);}
.login-box .brand{text-align:center;margin-bottom:22px;}
.login-box .brand .rjx{font-family:'Fraunces',Georgia,serif;font-size:28px;font-weight:600;}
.login-box .brand .tag{font-size:11px;letter-spacing:2px;color:var(--gold);text-transform:uppercase;margin-top:2px;}
.login-box p.hint{font-size:13px;color:var(--gray);margin:0 0 18px;text-align:center;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:5px;}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;font-size:14px;font-family:inherit;}
.field textarea{resize:vertical;}
.btn{display:inline-block;padding:11px 18px;border-radius:var(--radius);font-size:14px;font-weight:700;cursor:pointer;border:1px solid var(--wine);text-align:center;background:var(--paper);color:var(--wine);}
.btn-primary{background:var(--wine);color:#fff;border-color:var(--wine);}
.btn-primary:disabled{opacity:.6;cursor:default;}
.btn-outline{background:transparent;color:var(--wine);}
.btn-block{width:100%;}
.btn-sm{padding:8px 14px;font-size:12.5px;}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--gray);}
.btn-ghost:disabled{opacity:.35;cursor:default;}
/* ===== Modal padrão único — substitui as variações antigas por módulo ===== */
.rjx-modal-overlay{position:fixed;inset:0;background:rgba(23,19,15,.5);display:flex;align-items:center;justify-content:center;z-index:300;padding:20px;overflow-y:auto;}
.rjx-modal{background:var(--paper);border-radius:10px;max-width:460px;width:100%;margin:auto;box-shadow:0 24px 60px rgba(23,19,15,.35);max-height:88vh;display:flex;flex-direction:column;overflow:hidden;}
.rjx-modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line);background:#fff;flex-shrink:0;}
.rjx-modal-head h3{font-family:'Fraunces',Georgia,serif;font-size:17px;font-weight:600;margin:0;color:var(--ink);}
.rjx-modal-close{border:none;background:transparent;font-size:18px;line-height:1;color:var(--gray-soft);cursor:pointer;padding:4px 6px;border-radius:4px;}
.rjx-modal-close:hover{background:var(--paper-soft);color:var(--ink);}
.rjx-modal-body{padding:20px 22px;overflow-y:auto;}
.rjx-modal-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 22px;border-top:1px solid var(--line);background:#fff;flex-shrink:0;}
.rjx-modal-foot .right-group{display:flex;gap:10px;flex-wrap:wrap;}
.login-error{background:var(--alert-bg);color:var(--alert);border-radius:var(--radius);padding:9px 12px;font-size:13px;margin-bottom:14px;}
.login-success{background:var(--ok-bg);color:var(--ok);border-radius:var(--radius);padding:9px 12px;font-size:13px;margin-bottom:14px;}

/* ===== shell with sidebar ===== */
.shell{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 56px);}
.sidebar{background:var(--dark);color:#cfc9bd;padding:20px 0;}.nav-label{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#7d766b;padding:0 22px;margin:14px 0 6px;}
.mod-link{display:flex;align-items:center;gap:10px;padding:11px 22px;font-size:14px;font-weight:600;color:#cfc9bd;cursor:pointer;border-left:3px solid transparent;}
.mod-link:hover{background:rgba(255,255,255,.05);}
.mod-link.active{background:rgba(122,18,32,.28);border-left-color:var(--wine-bright);color:#fff;}
.mod-link.soon{color:#6f695f;cursor:default;}
.mod-link .tag{margin-left:auto;font-size:10px;color:#6f695f;}
.main{padding:0;overflow:auto;}
.pagehead{background:var(--paper);border-bottom:1px solid var(--line);padding:22px 32px;}
.pagehead .crumb{font-size:12px;color:var(--gray-soft);}
.pagehead h1{font-family:'Fraunces',Georgia,serif;font-size:23px;margin:4px 0 0;font-weight:600;}
.pagehead .sub{font-size:13px;color:var(--gray);margin-top:3px;}
.subnav{background:var(--paper);border-bottom:1px solid var(--line);padding:0 32px;display:flex;gap:4px;}
.subnav{flex-wrap:wrap;gap:8px;border-bottom:none !important;padding:0 0 4px;}
.subtab{font-weight:600;font-size:13px;color:var(--gray);background:#fff;border:1px solid var(--line);padding:9px 18px;border-radius:24px;cursor:pointer;font-family:inherit;}
.subtab.active{background:var(--wine);border-color:var(--wine);color:#fff;}
.subtab:hover{border-color:var(--wine);}
.content{padding:28px 32px 60px;max-width:1300px;margin:0 auto;}

.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);}
.form-card{padding:26px;margin-bottom:24px;}
.form-card h3{font-size:16px;margin:0 0 4px;font-family:'Fraunces',Georgia,serif;font-weight:600;}
.form-card .cardsub{font-size:13px;color:var(--gray);margin:0 0 18px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.list-title{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--gray);margin:0 0 12px;font-weight:700;}

.status-pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:100px;white-space:nowrap;}
.status-pill .dot{width:6px;height:6px;border-radius:50%;}
.status-wait{background:var(--wait-bg);color:var(--wait);} .status-wait .dot{background:var(--wait);}
.status-info{background:var(--info-bg);color:var(--info);} .status-info .dot{background:var(--info);}
.status-ok{background:var(--ok-bg);color:var(--ok);} .status-ok .dot{background:var(--ok);}

.loc-card{padding:16px 20px;margin-bottom:12px;}
.loc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;}
.loc-eq{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--wine);}
.loc-name{font-size:16px;margin-top:3px;font-weight:600;}
.loc-meta{color:var(--gray);font-size:13px;margin-top:5px;}
.loc-actions{margin-top:12px;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;}
.insumo-row{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);}
.insumo-row:last-child{border-bottom:none;}
.insumo-row input[type=text]{flex:1;}
.insumo-row input[type=number]{width:80px;}
.insumo-remove{color:var(--wine);font-size:12.5px;font-weight:700;cursor:pointer;background:none;border:none;white-space:nowrap;}
.dup-pill{padding:8px 12px;border:1.5px solid var(--line);border-radius:100px;font-size:12.5px;font-weight:700;color:var(--gray);cursor:pointer;user-select:none;background:var(--paper);}
.dup-pill.sel{border-color:var(--wine);background:#f7e9ea;color:var(--wine);}
.add-row{display:flex;gap:8px;margin-top:10px;}

.job-card{padding:14px 18px;margin-bottom:12px;display:flex;gap:14px;align-items:center;}
.job-time{flex:none;width:60px;text-align:center;}
.job-time b{font-family:'Fraunces',Georgia,serif;font-size:17px;display:block;}
.job-time span{font-size:10px;color:var(--gray-soft);text-transform:uppercase;}
.job-body{flex:1;}
.job-body h4{font-size:15px;margin:0 0 3px;}
.job-eq{font-size:11px;color:var(--wine);font-weight:700;text-transform:uppercase;}
.job-flags{display:flex;flex-direction:column;gap:6px;align-items:flex-end;flex:none;}
.notice-box{display:flex;gap:12px;align-items:flex-start;background:var(--alert-bg);border-left:4px solid var(--wine-bright);padding:14px 16px;border-radius:var(--radius);margin-bottom:18px;font-size:13px;color:var(--alert);}
.empty-hint{color:var(--gray);font-size:13.5px;padding:20px;text-align:center;}
.placeholder-screen{max-width:600px;margin:60px auto;text-align:center;padding:0 20px;}
.placeholder-screen h1{margin-bottom:10px;}

@media (max-width:860px){
  .shell{grid-template-columns:1fr;}
  .sidebar{display:flex;overflow-x:auto;padding:10px;}
  .grid2{grid-template-columns:1fr;}
}

/* ===== Premiacao Logistica: metricas, etapas, premio, contestacao ===== */
.metrics{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:22px;}
.metric{background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:16px 18px;}
.metric .num{font-family:Fraunces,serif; font-size:26px; font-weight:600;}
.metric .lbl{font-size:11.5px; color:var(--gray); text-transform:uppercase; letter-spacing:.3px; margin-top:2px;}
.metric.atraso{border-color:#e8cabd; background:var(--alert-bg);}
.metric.atraso .num{color:var(--alert);}

.locacao-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:4px;}
.locacao-head h3{font-size:17px;}
.locacao-sub{color:var(--gray); font-size:12.5px; margin-bottom:14px;}
.progresso-barra{height:6px; border-radius:4px; background:var(--paper-soft); overflow:hidden; margin-bottom:14px;}
.progresso-fill{height:100%; background:var(--ok);}

.etapa-row{display:flex; align-items:center; gap:12px; padding:9px 0; border-bottom:1px solid var(--line);}
.etapa-row:last-child{border-bottom:none;}
.etapa-row.feita .etapa-label{color:var(--gray-soft);}
.etapa-check{width:18px; height:18px; accent-color:var(--wine); flex-shrink:0;}
.etapa-num{color:var(--gray-soft); font-size:12.5px; width:18px; flex-shrink:0;}
.etapa-label{flex:1; font-size:13.5px;}
.etapa-pts{font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px; white-space:nowrap; background:var(--ok-bg); color:var(--ok);}
.etapa-quem{font-size:12px; color:var(--gray); width:70px; text-align:right; flex-shrink:0;}

.atraso-box{margin-top:10px; padding:14px 16px; border:1px dashed #e8cabd; border-radius:8px; background:#fdf8f5; display:flex; align-items:center; gap:12px;}
.atraso-box input{width:18px; height:18px; accent-color:var(--alert);}
.atraso-box label{font-size:13.5px; font-weight:600; color:var(--alert); cursor:pointer;}

.ver-link{font-size:12px; color:var(--wine); text-decoration:underline; cursor:pointer; background:none; border:none;}

/* premio / leaderboard */
.premio-card{padding:20px 22px; margin-bottom:22px;}
.premio-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
.premio-head h3{font-size:16px;}
.premio-valor{font-family:Fraunces,serif; font-size:15px; color:var(--gold); font-weight:600;}
.premio-barra{height:14px; border-radius:8px; background:var(--paper-soft); overflow:hidden; position:relative; margin:10px 0 8px;}
.premio-fill{height:100%; background:var(--ok); transition:width .3s;}
.premio-fill.abaixo{background:var(--wait);}
.premio-meta-marca{position:absolute; top:0; bottom:0; width:2px; background:var(--ink);}
.premio-rodape{display:flex; justify-content:space-between; font-size:12px; color:var(--gray);}
.premio-status{font-size:12.5px; font-weight:700; padding:4px 11px; border-radius:20px; display:inline-flex; align-items:center; gap:5px;}

.lider-row{display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--line);}
.lider-row:last-child{border-bottom:none;}
.lider-nome{width:100px; font-size:13.5px; font-weight:600; flex-shrink:0;}
.lider-barra-wrap{flex:1; height:10px; background:var(--paper-soft); border-radius:6px; overflow:hidden; position:relative;}
.lider-barra-fill{height:100%; background:var(--ok);}
.lider-barra-fill.abaixo{background:var(--wait);}
.lider-meta-marca{position:absolute; top:0; bottom:0; width:2px; background:var(--ink);}
.lider-pct{width:80px; text-align:right; font-size:12.5px; font-weight:700; color:var(--gray); flex-shrink:0;}

/* contestacoes */
.contest-alert{padding:16px 18px; margin-bottom:20px; background:var(--alert-bg); border:1px solid #e8cabd;}
.contest-alert h3{color:var(--alert); font-size:16px;}
.contest-row{display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid #ecd3c8; gap:10px;}
.contest-row:last-child{border-bottom:none;}
.contest-badge{font-size:11px; font-weight:700; padding:3px 10px; border-radius:20px;}
.contest-pendente{background:var(--status-wait-bg, #f7ecd9); color:var(--wait);}
.contest-aceita{background:var(--ok-bg); color:var(--ok);}
.contest-rejeitada{background:var(--alert-bg); color:var(--alert);}

.modal-overlay{position:fixed; inset:0; background:rgba(23,19,15,.45); display:flex; align-items:center; justify-content:center; z-index:200;}
.modal-box{max-width:520px; width:92%; margin:0; max-height:85vh; overflow-y:auto;}
textarea.field-textarea{width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:6px; font-size:13.5px; font-family:inherit;}

/* sininho de alerta na sidebar */
.badge-alerta{background:var(--wine); color:#fff; font-size:10.5px; font-weight:700; border-radius:20px; padding:1px 7px; min-width:16px; text-align:center; display:inline-block; margin-left:6px;}

/* resumo pessoal (transportes) */
.resumo{display:flex; align-items:center; gap:18px; padding:18px 20px; margin-bottom:14px; background:var(--ink); border-radius:10px; color:#f1ebe1;}
.resumo .pontos{font-family:Fraunces,serif; font-size:36px; font-weight:600; color:#fff;}
.resumo .pontos-lbl{font-size:11px; color:var(--gold); text-transform:uppercase; letter-spacing:.5px;}
.resumo .divisor{width:1px; align-self:stretch; background:rgba(255,255,255,.15);}
.resumo .mini{font-size:12px; color:#d8cfc2;}
.resumo .mini b{color:#fff; font-size:15px; display:block; font-family:Fraunces,serif; font-weight:600;}

/* historico expansivel (transportes) */
.hist-row{border-bottom:1px solid var(--line);}
.hist-row:last-child{border-bottom:none;}
.hist-cab{display:flex; align-items:center; gap:10px; padding:12px; cursor:pointer;}
.hist-cab:hover{background:var(--paper-soft);}
.hist-cab b{flex:1; font-size:13.5px;}
.hist-detalhe{padding:0 16px 16px; display:none;}
.hist-detalhe.aberto{display:block;}
.hist-etapa-ro{display:flex; align-items:center; gap:10px; padding:6px 0; font-size:13px; border-bottom:1px solid var(--paper-soft);}
.hist-etapa-ro:last-child{border-bottom:none;}
.hist-etapa-ro .ico{width:16px; text-align:center; flex-shrink:0;}
.hist-etapa-ro.feita .ico{color:var(--ok);}
.hist-etapa-ro.nfeita .ico{color:var(--gray-soft);}
.hist-etapa-ro.nfeita .lbl{color:var(--gray-soft);}

/* manual de entrega */
.manual-header{background:var(--wine); color:#fff; padding:24px 22px; border-radius:10px; margin-bottom:20px;}
.manual-header .kicker{font-size:11px; letter-spacing:2px; text-transform:uppercase; color:#e8c9c9; margin-bottom:6px;}
.manual-header h2{font-size:24px; font-family:Fraunces,serif;}
.manual-header .sub{font-size:13px; color:#e8c9c9; margin-top:6px;}
.manual-secao{margin-bottom:22px;}
.manual-secao-titulo{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
.manual-num{width:30px; height:30px; border-radius:50%; border:2px solid var(--wine); color:var(--wine); display:flex; align-items:center; justify-content:center; font-weight:700; font-family:Fraunces,serif; flex-shrink:0;}
.manual-secao-titulo h3{font-size:15px; text-transform:uppercase; letter-spacing:.3px;}
.manual-step{background:var(--paper); border:1px solid var(--line); border-left:3px solid var(--wine); border-radius:6px; padding:12px 14px; margin:0 0 8px 15px; font-size:13.5px; line-height:1.5;}
.manual-diferencas-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:10px;}
.manual-equip-card{border-radius:8px; padding:16px 18px; border-top:4px solid; background:var(--paper);}
.manual-equip-card h4{font-size:15px; margin-bottom:8px;}
.manual-equip-card ul{margin:0; padding-left:18px; font-size:12.5px; line-height:1.6; color:var(--ink-soft);}
.manual-equip-mpt{border-color:#a83246;}
.manual-equip-crio{border-color:#2c7a7a;}
.manual-equip-endo{border-color:#c9761f;}
.manual-equip-lav{border-color:#3f8f7a;}
.manual-footer{background:var(--ink); color:#e8ddd2; padding:16px 20px; border-radius:10px; font-size:13px; text-align:center; margin-top:20px;}
.form-row{display:grid;grid-template-columns:1fr 1.4fr 1fr .8fr .8fr auto;gap:10px;align-items:end;}
@media(max-width:1000px){.form-row{grid-template-columns:1fr 1fr;}}
.total-cell{font-weight:700;color:var(--wine);}
.price-table{margin-top:10px;}
.price-group{background:var(--paper-soft);border-radius:6px;padding:12px 14px;margin-bottom:10px;}
.price-group h4{font-size:12.5px;text-transform:uppercase;letter-spacing:.3px;color:var(--wine);margin-bottom:8px;}
.price-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.price-grid .field label{font-size:11px;font-weight:600;color:var(--gray);}
.price-grid .field input{padding:6px 8px;font-size:12.5px;}
.toggle-price{cursor:pointer;color:var(--wine);font-size:12.5px;text-decoration:underline;background:none;border:none;padding:0;font-family:inherit;}
.summary-row{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
.summary-box{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:11px 14px;flex:1;min-width:120px;}
.summary-box .num{font-family:Fraunces,serif;font-size:19px;font-weight:600;}
.summary-box .lbl{font-size:11px;color:var(--gray);text-transform:uppercase;letter-spacing:.3px;margin-top:2px;}
.icon-btn{background:none;border:1px solid var(--line);color:var(--gray);border-radius:6px;width:26px;height:26px;font-size:13px;cursor:pointer;line-height:1;}
.icon-btn:hover{border-color:var(--wine);color:var(--wine);}

/* ===== Equipamentos v2: cards grandes ===== */
.equip-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;}
.equip-card-big{background:#fff;border:1px solid var(--line);border-left:4px solid var(--line);border-radius:12px;padding:16px 18px;position:relative;}
.equip-card-big.pendente{border-left-color:var(--wait);}
.pendente-flag{position:absolute;top:14px;right:16px;font-size:10px;font-weight:700;color:var(--wait);background:var(--wait-bg);padding:2px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.02em;}
.equip-card-top{display:flex;gap:14px;margin-bottom:10px;}
.equip-card-nome{font-size:16px;font-weight:700;margin-bottom:2px;}
.equip-card-serie{font-size:11.5px;color:var(--gray);}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;padding:10px 0;border-top:1px solid var(--line);margin-bottom:8px;}
.info-item label{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--gray-soft);margin-bottom:2px;}
.info-item div{font-size:12.5px;color:var(--ink-soft);font-weight:600;}
.info-item .idade{font-size:10.5px;color:var(--gray);font-weight:400;}
.info-item .missing{color:var(--gray-soft);font-weight:400;font-style:italic;}
.manut-box{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;}
.manut-row{font-size:11px;color:var(--info);background:var(--info-bg);padding:4px 9px;border-radius:6px;}
.manut-row.corretiva{color:var(--alert);background:var(--alert-bg);}
.manut-row.vazio{color:var(--gray-soft);background:var(--paper-soft);font-style:italic;}
.anexos-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.anexo-chip{display:flex;align-items:center;gap:4px;font-size:11px;padding:4px 8px;border-radius:999px;border:1px solid var(--line);background:var(--paper-soft);color:var(--ink-soft);}
.anexo-chip.ok{background:var(--ok-bg);border-color:transparent;color:var(--ok);}
.anexo-chip.missing{color:var(--wait);background:var(--wait-bg);border-color:transparent;}
.anexo-chip a{color:var(--wine);text-decoration:underline;margin-left:2px;cursor:pointer;}
.acessorios-box{background:var(--paper-soft);border-radius:8px;padding:10px 12px;margin-bottom:10px;}
.acessorios-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.acessorios-head b{font-size:12px;}
.mini-add{font-size:10.5px;color:var(--wine);text-decoration:underline;cursor:pointer;}
.acessorio-mini{display:flex;justify-content:space-between;align-items:center;font-size:11px;padding:3px 0;border-bottom:1px dashed var(--line);}
.acessorio-mini:last-child{border-bottom:none;}
.acessorio-mini .n{color:var(--gray);display:flex;align-items:center;gap:5px;}
.nf-ok{color:var(--ok);font-size:10px;text-decoration:underline;cursor:pointer;}
.nf-missing{color:var(--wait);font-size:10px;text-decoration:underline;cursor:pointer;}

/* ===== Cartuchos v2: anexos separados + descarte ===== */
.foot-new{padding-top:10px;border-top:1px solid var(--line);}
.anexo-row{display:flex;align-items:center;justify-content:space-between;font-size:12px;margin-bottom:5px;}
.anexo-row:last-of-type{margin-bottom:8px;}
.anexo-label{display:flex;align-items:center;gap:6px;color:var(--ink-soft);font-weight:600;}
.anexo-tag{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:1px 6px;border-radius:4px;background:var(--info-bg);color:var(--info);}
.anexo-tag.contrato{background:var(--ok-bg);color:var(--ok);}
.anexo-link{color:var(--wine);text-decoration:underline;font-size:12px;cursor:pointer;}
.bottom-row{display:flex;justify-content:space-between;align-items:center;margin-top:2px;}
.zerou-link{color:var(--alert);text-decoration:underline;font-size:11.5px;cursor:pointer;font-weight:600;}
.restaurar-link{color:var(--ok);text-decoration:underline;font-size:11.5px;cursor:pointer;font-weight:600;}
.editar-link{text-decoration:underline;cursor:pointer;font-size:12px;color:var(--gray);}
.cart-card.descartado{opacity:.65;background:var(--paper-soft);}
.link-btn.disabled{opacity:.5;pointer-events:none;}
.badge-descartado{display:inline-block;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:2px 7px;border-radius:4px;background:var(--alert-bg);color:var(--alert);margin-bottom:6px;}
.subtab-discard.active{background:var(--alert);border-color:var(--alert);}

/* ===== Módulo Equipamentos ===== */
.filefield{border:1.5px dashed var(--line);border-radius:7px;padding:9px 11px;font-size:12px;color:var(--gray);display:flex;align-items:center;justify-content:space-between;background:#fff;cursor:pointer;gap:8px;}
.filefield.attached{border-style:solid;border-color:var(--ok);color:var(--ok);background:#eef4ef;}
.foto-box{border-radius:8px;background:var(--paper-soft);flex-shrink:0;position:relative;overflow:hidden;border:1px solid var(--line);cursor:pointer;}
.foto-box img{width:100%;height:100%;object-fit:cover;display:block;}
.foto-box.vazio{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-style:dashed;color:var(--gray);}
.foto-box.vazio .foto-ico{font-size:17px;}
.foto-box.vazio .foto-txt{font-size:9px;text-align:center;line-height:1.15;}
.add-equip-btn{background:transparent;border:1.5px dashed var(--gray);color:var(--gray);padding:8px 16px;border-radius:999px;font-size:13.5px;cursor:pointer;font-family:inherit;font-weight:500;}
.add-equip-btn:hover{border-color:var(--wine);color:var(--wine);}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.section-head h3{font-size:15px;margin:0;}
.piece-row{display:flex;align-items:flex-start;gap:12px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;}
.piece-row .info-full{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0;}
.piece-row .info{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.piece-row .info .mini label{font-size:9.5px;text-transform:uppercase;color:var(--gray);display:block;margin-bottom:1px;}
.piece-row .info .mini div{font-size:12.5px;}
.cart-filterbar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
.cart-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;}
.cart-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;position:relative;}
.cart-card .star{position:absolute;top:10px;right:12px;font-size:17px;cursor:pointer;color:#d8cfb4;}
.cart-card .star.on{color:#c98a4b;}
.cart-card .cart-top{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px;}
.cart-card .serie{font-size:15px;font-weight:600;margin-bottom:2px;}
.cart-card .disparos{font-size:11.5px;color:var(--gray);}
.cart-card .barra{height:6px;border-radius:4px;background:var(--paper-soft);overflow:hidden;margin-bottom:10px;}
.cart-card .barra .fill{height:100%;background:var(--ok);}
.cart-card .barra .fill.low{background:var(--wait);}
.cart-card .barra .fill.empty{background:var(--alert);}
.cart-card .linkrow{display:flex;gap:6px;margin-bottom:10px;}
.link-btn{flex:1;text-align:center;padding:6px 0;border-radius:6px;border:1px solid var(--line);font-size:11.5px;font-weight:600;cursor:pointer;background:#fff;color:var(--gray);}
.link-btn.active{background:var(--wine);border-color:var(--wine);color:#fff;}
.cart-card .foot{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--gray);}
.cart-card.acabado{opacity:.6;}

  /* ===== Módulo Cadastro de Cliente (Financeiro) ===== */
  .cc-mod{
    --paper-raised:#FFFFFF;
    --ink-soft:var(--gray-soft);
    --wine-deep:var(--wine-dark);
    --ok-line:var(--ok); --ok-ink:var(--ok);
    --warn-bg:var(--wait-bg); --warn-line:var(--wait); --warn-ink:var(--wait);
    --bad-bg:var(--alert-bg); --bad-line:var(--alert); --bad-ink:var(--alert);
  }
  .cc-mod .cc-disclaimer{font-size:12px;color:var(--gray-soft);margin:0 0 16px;}
  .cc-mod *{box-sizing:border-box;}
  .cc-mod .steps{display:flex;margin-bottom:30px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--paper-raised);}
  .cc-mod .step-btn{flex:1;padding:13px 10px;text-align:center;font-size:13.5px;color:var(--ink-soft);cursor:pointer;border:none;background:transparent;border-right:1px solid var(--line);font-family:inherit;}
  .cc-mod .step-btn:last-child{border-right:none;}
  .cc-mod .step-btn.active{background:var(--wine);color:#fff;font-weight:600;}
  .cc-mod .step-btn .num{display:inline-block;width:18px;height:18px;border-radius:50%;border:1px solid currentColor;font-size:11px;line-height:16px;margin-right:6px;}
  .cc-mod section.panel{display:none;background:var(--paper-raised);border:1px solid var(--line);border-radius:10px;padding:26px 28px;margin-bottom:20px;}
  .cc-mod section.panel.active{display:block;}
  .cc-mod .field-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
  .cc-mod .field-row.single{grid-template-columns:1fr;}
  .cc-mod label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:5px;}
  .cc-mod input[type=text], .cc-mod input[type=number], .cc-mod select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;font-size:14.5px;font-family:inherit;background:#fff;color:var(--ink);}
  .cc-mod input:disabled{background:var(--paper-soft);color:var(--ink-soft);}
  .cc-mod input:focus, .cc-mod select:focus{outline:2px solid var(--wine);outline-offset:1px;}
  .cc-mod fieldset{border:1px solid var(--line);border-radius:8px;padding:14px 16px 16px;margin:0 0 16px;}
  .cc-mod legend{font-size:12.5px;color:var(--ink-soft);padding:0 6px;}
  .cc-mod .radio-group{display:flex;gap:18px;flex-wrap:wrap;}
  .cc-mod .radio-group label{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--ink);margin:0;}
  .cc-mod .checkbox-group{display:flex;gap:16px;flex-wrap:wrap;padding:10px 12px;border:1px solid var(--line);border-radius:7px;background:var(--paper-soft);}
  .cc-mod .checkbox-group label{display:flex;align-items:center;gap:7px;font-size:14px;color:var(--ink);margin:0;cursor:pointer;}
  .cc-mod .field-error{font-size:12px;color:var(--bad-ink);margin-top:4px;display:none;}
  .cc-mod .field-error.show{display:block;}
  .cc-mod input.field-invalid{border-color:var(--bad-line);}
  .cc-mod .hint{font-size:12px;color:var(--ink-soft);margin-top:4px;}
  .cc-mod .lookup-row{display:flex;gap:8px;align-items:flex-end;}
  .cc-mod .lookup-row > div{flex:1;}
  .cc-mod .btn-consultar{padding:9px 16px;border-radius:6px;border:1px solid var(--wine);background:var(--wine);color:#fff;font-size:13.5px;cursor:pointer;font-family:inherit;white-space:nowrap;height:38px;}
  .cc-mod .btn-consultar:disabled{opacity:0.4;cursor:not-allowed;}
  .cc-mod .readonly-result{display:flex;flex-direction:column;gap:6px;padding:10px 14px;border-radius:7px;font-size:13.5px;margin-top:10px;border:1px solid;}
  .cc-mod .readonly-result.pending{background:var(--paper-soft);border-color:var(--line);color:var(--ink-soft);}
  .cc-mod .readonly-result.ok{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok-ink);}
  .cc-mod .readonly-result.bad{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad-ink);}
  .cc-mod .readonly-result .src{font-size:11.5px;opacity:0.85;}
  .cc-mod .doc-chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-family:inherit;background:rgba(255,255,255,0.6);border:1px solid currentColor;border-radius:20px;padding:3px 10px;width:fit-content;margin-top:2px;cursor:pointer;}
  .cc-mod .copy-mini{background:transparent;border:1px solid var(--line);border-radius:4px;width:22px;height:22px;font-size:11px;cursor:pointer;line-height:1;padding:0;color:var(--ink-soft);flex-shrink:0;}
  .cc-mod .copy-mini:hover{border-color:var(--wine);color:var(--wine);}
  .cc-mod .doc-chip:hover{background:rgba(255,255,255,0.95);}
  .cc-mod .locked-note{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--ink-soft);background:var(--paper-soft);border-radius:6px;padding:8px 10px;margin-bottom:14px;}
  .cc-mod .split-two{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .cc-mod .subcard{border:1px solid var(--line);border-radius:8px;padding:14px 16px;background:var(--paper-soft);}
  .cc-mod .subcard h4{margin:0 0 10px;font-size:14px;font-family:'Fraunces','Georgia',serif;font-weight:600;}
  .cc-mod .kv-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:13px;margin-bottom:8px;}
  .cc-mod .kv-grid .k{color:var(--ink-soft);}
  .cc-mod table.debts{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px;}
  .cc-mod table.debts th, .cc-mod table.debts td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);}
  .cc-mod table.debts th{color:var(--ink-soft);font-weight:600;font-size:11.5px;}
  .cc-mod table.debts td.val{font-variant-numeric:tabular-nums;white-space:nowrap;}
  .cc-mod table.debts input[type=text]{padding:5px 7px;font-size:12.5px;}
  .cc-mod .score-box{display:flex;align-items:flex-start;gap:18px;margin:10px 0 16px;flex-wrap:wrap;}
  .cc-mod .score-num{font-family:'Fraunces','Georgia',serif;font-size:34px;font-weight:600;}
  .cc-mod .score-num.low{color:var(--bad-ink);}
  .cc-mod .score-num.high{color:var(--ok-ink);}
  .cc-mod .score-gauge-wrap{display:flex;flex-direction:column;align-items:center;min-width:150px;}
  .cc-mod .score-gauge-wrap svg{display:block;}
  .cc-mod .score-value{font-family:'Fraunces','Georgia',serif;font-size:28px;font-weight:600;margin-top:-44px;line-height:1;}
  .cc-mod .score-value span{font-size:13px;font-weight:600;color:var(--ink-soft);}
  .cc-mod .score-band{font-size:11px;font-weight:700;padding:3px 12px;border-radius:20px;margin-top:8px;}
  .cc-mod .score-band.ok{background:var(--ok-bg);color:var(--ok-ink);}
  .cc-mod .score-band.warn{background:var(--warn-bg);color:var(--warn-ink);}
  .cc-mod .score-band.bad{background:var(--bad-bg);color:var(--bad-ink);}
  .cc-mod .score-recomendacao-txt{font-size:12px;color:var(--ink-soft);margin-top:8px;text-align:center;max-width:165px;}
  .cc-mod .stat-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;flex:1;min-width:220px;align-content:flex-start;}
  .cc-mod .stat-card{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--paper-raised);}
  .cc-mod .stat-card .k{font-size:11px;color:var(--ink-soft);font-weight:600;margin-bottom:3px;}
  .cc-mod .stat-card .v{font-size:13.5px;font-weight:600;color:var(--ink);}
  .cc-mod .stat-card.limite{grid-column:1/-1;background:var(--warn-bg);border-color:var(--warn-line);}
  .cc-mod .stat-card.limite .k{color:var(--warn-ink);}
  .cc-mod .stat-card.limite .v{font-family:'Fraunces','Georgia',serif;font-size:24px;color:var(--warn-ink);}
  .cc-mod .pend-empty{font-size:12.5px;color:var(--ok-ink);background:var(--ok-bg);padding:8px 10px;border-radius:6px;display:inline-block;}
  .cc-mod .pend-legend{display:flex;align-items:center;gap:6px;margin:14px 0 6px;font-weight:600;color:var(--ink);font-size:13px;}
  .cc-mod .nav-buttons{display:flex;justify-content:space-between;margin-top:8px;}
  .cc-mod .nav-buttons .right-group{display:flex;gap:10px;}
  .cc-mod .btn{padding:11px 20px;border-radius:7px;border:none;font-size:14.5px;cursor:pointer;font-family:inherit;font-weight:600;}
  .cc-mod .btn-primary{background:var(--wine);color:#fff;}
  .cc-mod .btn-primary:hover{background:var(--wine-deep);}
  .cc-mod .btn-primary:disabled{background:#C8B9BC;cursor:not-allowed;}
  .cc-mod .btn-ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--line);}
  .cc-mod .btn-ghost:hover{border-color:var(--ink-soft);}
  .cc-mod .btn-print{background:var(--wine);color:#fff;}
  .cc-mod .btn-add-row{background:transparent;color:var(--wine);border:1px dashed var(--wine);border-radius:6px;padding:6px 12px;font-size:12.5px;font-family:inherit;cursor:pointer;margin-top:8px;}
  .cc-mod .btn-remove-row{background:transparent;color:var(--bad-ink);border:none;font-size:13px;cursor:pointer;padding:2px 6px;}
  .cc-mod .laudo-block{border:1px solid var(--line);border-radius:8px;margin-bottom:14px;overflow:hidden;}
  .cc-mod .laudo-head{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--paper-soft);border-bottom:1px solid var(--line);}
  .cc-mod .laudo-head .idx{width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .cc-mod .laudo-head .title{font-weight:600;font-size:15px;flex:1;}
  .cc-mod .verdict-chip{font-size:12px;padding:3px 10px;border-radius:20px;font-weight:600;white-space:nowrap;}
  .cc-mod .verdict-chip.ok{background:var(--ok-bg);color:var(--ok-ink);border:1px solid var(--ok-line);}
  .cc-mod .verdict-chip.bad{background:var(--bad-bg);color:var(--bad-ink);border:1px solid var(--bad-line);}
  .cc-mod .verdict-chip.warn{background:var(--warn-bg);color:var(--warn-ink);border:1px solid var(--warn-line);}
  .cc-mod .laudo-body{padding:14px 16px;font-size:14px;}
  .cc-mod .laudo-body ul{margin:6px 0 0;padding-left:18px;}
  .cc-mod .laudo-body li{margin-bottom:3px;}
  .cc-mod .conclusion{border-radius:10px;padding:20px 22px;margin-top:18px;border:2px solid;}
  .cc-mod .conclusion.ok{background:var(--ok-bg);border-color:var(--ok-line);}
  .cc-mod .conclusion.bad{background:var(--bad-bg);border-color:var(--bad-line);}
  .cc-mod .conclusion.warn{background:var(--warn-bg);border-color:var(--warn-line);}
  .cc-mod .conclusion h3{margin:0 0 6px;font-family:'Fraunces','Georgia',serif;font-size:19px;}
  .cc-mod .manual-approval{margin-top:14px;padding-top:14px;border-top:1px solid rgba(0,0,0,0.12);}
  .cc-mod .manual-approval .radio-group label{font-weight:600;}
  .cc-mod .empty-state{text-align:center;padding:50px 20px;color:var(--ink-soft);}
  .cc-mod .empty-state .icon{font-size:34px;margin-bottom:10px;}
  .cc-mod #doc-final{display:none;}
  .cc-mod .doc-page{background:#fff;border:1px solid var(--line);border-radius:10px;padding:40px 46px;margin-bottom:24px;}
  .cc-mod .doc-page h2.doc-title{font-family:'Fraunces','Georgia',serif;font-size:24px;margin:0 0 2px;}
  .cc-mod .doc-page .doc-sub{color:var(--ink-soft);font-size:13px;margin-bottom:22px;border-bottom:1px solid var(--line);padding-bottom:16px;}
  .cc-mod .doc-section{margin-bottom:22px;}
  .cc-mod .doc-section h3{font-family:'Fraunces','Georgia',serif;font-size:16px;margin:0 0 10px;border-bottom:1px solid var(--line);padding-bottom:6px;}
  .cc-mod .doc-attach-thumb{border:1px dashed var(--line);border-radius:8px;padding:14px;font-size:12px;color:var(--ink-soft);margin-top:8px;background:var(--paper-soft);}
  .cc-mod .doc-attach-thumb .fname{font-weight:600;color:var(--ink);}
  .cc-mod .conclusion{display:flex;gap:16px;align-items:flex-start;padding:22px 24px;}
  .cc-mod .conclusion .icon{width:46px;height:46px;border-radius:50%;background:#fff;border:2px solid currentColor;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
  .cc-mod .conclusion.ok .icon{color:var(--ok-ink);}
  .cc-mod .conclusion.bad .icon{color:var(--bad-ink);}
  .cc-mod .conclusion.warn .icon{color:var(--warn-ink);}
  .cc-mod .conclusion .equip-line{display:inline-block;margin-top:10px;font-size:12.5px;font-weight:600;background:rgba(255,255,255,.55);border-radius:20px;padding:4px 12px;}
  .cc-mod .anexos-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .cc-mod .anexo-final{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;}
  .cc-mod .anexo-final .cap{padding:9px 14px;font-size:12.5px;font-weight:600;color:var(--ink-soft);background:var(--paper-soft);border-bottom:1px solid var(--line);}
  .cc-mod .anexo-final .body{padding:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:var(--paper-soft);min-height:170px;}
  .cc-mod .anexo-final .body img{max-width:100%;max-height:900px;border-radius:4px;display:block;}
  .cc-mod .anexo-final .body iframe{width:100%;height:600px;border:1px solid var(--line);border-radius:4px;background:#fff;}
  .cc-mod .anexo-final.wide{grid-column:1/-1;}
  .cc-mod .cc-subrow{display:flex;gap:10px;margin-bottom:22px;flex-wrap:wrap;}
  .cc-mod .fcs-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px;flex-wrap:wrap;}
  .cc-mod .fcs-head h3{margin:0;font-size:16px;}

async function doLogin(){
  const email = document.getElementById('f-email').value.trim();
  const senha = document.getElementById('f-senha').value;
  if(!email || !senha){ screenLogin('Preencha e-mail e senha.'); return; }
  const btn = document.getElementById('btn-entrar');

  const result = await sb.auth.signInWithPassword({ email: email, password: senha });
  if(result.error){ screenLogin('E-mail ou senha incorretos.'); return; }

}

async function doSetPassword(){
  const p1 = document.getElementById('f-nova-senha').value;
  const p2 = document.getElementById('f-conf-senha').value;
  const errEl = document.getElementById('set-pw-error');
  if(p1.length < 6){ errEl.textContent='A senha precisa ter pelo menos 6 caracteres.'; errEl.style.display='block'; return; }
  if(p1 !== p2){ errEl.textContent='As senhas não coincidem.'; errEl.style.display='block'; return; }
  const btn = document.getElementById('btn-definir');
  btn.disabled = true; btn.textContent = 'Salvando...';
  const result = await sb.auth.updateUser({ password: p1 });  if(result.error){ errEl.textContent = 'Erro ao salvar: ' + result.error.message; errEl.style.display='block'; btn.disabled=false; btn.textContent='Definir senha e entrar'; return; }
  history.replaceState(null, '', location.pathname);
  await boot();
}

/* ================= BOOT ================= */
async function boot(){
  const hash = window.location.hash || '';
  const isRecoveryLink = hash.indexOf('access_token=') !== -1 && (hash.indexOf('type=invite') !== -1 || hash.indexOf('type=recovery') !== -1 || hash.indexOf('type=signup') !== -1 || hash.indexOf('type=magiclink') !== -1 || hash.indexOf('type=email_change') !== -1);
  const sessionResult = await sb.auth.getSession();
  const session = sessionResult.data.session;
  if(!session){ screenLogin(); return; }
  if(isRecoveryLink){ screenSetPassword(); return; }

  const rowsResult = await sb.from('usuarios').select('*').eq('id', session.user.id);
  if(rowsResult.error || !rowsResult.data || !rowsResult.data.length){
    app.innerHTML = '<div class="login-wrap"><div class="login-box"><p>Seu usuário ainda não foi cadastrado na intranet. Fale com o Gerencial.</p><button class="btn btn-outline btn-block" id="btn-sair">Sair</button></div></div>';
    document.getElementById('btn-sair').addEventListener('click', async function(){ await sb.auth.signOut(); screenLogin(); });
    return;
  }
  currentUsuario = rowsResult.data[0];
  if(!currentUsuario.ativo){
    app.innerHTML = '<div class="login-wrap"><div class="login-box"><p>Sua conta está desativada. Fale com o Gerencial.</p><button class="btn btn-outline btn-block" id="btn-sair">Sair</button></div></div>';
    document.getElementById('btn-sair').addEventListener('click', async function(){ await sb.auth.signOut(); screenLogin(); });
    return;
  }
  renderShell();
}

/* ================= API HELPER (usuarios via serverless) ================= */
async function apiCall(method, body){
  const sessionResult = await sb.auth.getSession();
  const session = sessionResult.data.session;
  const resp = await fetch('/api/intranet-usuarios', {
    method: method,
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + session.access_token },
    body: body ? JSON.stringify(body) : undefined
  });
  const data = await resp.json().catch(function(){ return {}; });
  if(!resp.ok){ throw new Error(data.error || 'Erro na requisição.'); }
  return data;
}

/* ================= ASSINATURA (canvas) ================= */
function initSignaturePad(canvasId){
  const canvas = document.getElementById(canvasId);
  const ctx = canvas.getContext('2d');
  function resize(){
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * 2;
    canvas.height = rect.height * 2;
    ctx.scale(2,2);
    ctx.strokeStyle = '#17130f';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
  }
  resize();
  let drawing = false;
  function pos(e){
    const rect = canvas.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return { x: p.clientX - rect.left, y: p.clientY - rect.top };
  }
  function start(e){ drawing = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); e.preventDefault(); }
  function move(e){ if(!drawing) return; const p = pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); e.preventDefault(); }
  function end(){ drawing = false; }
  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, {passive:false});  canvas.addEventListener('touchmove', move, {passive:false});
  canvas.addEventListener('touchend', end);
  return {
    clear: function(){ ctx.clearRect(0,0,canvas.width,canvas.height); },
    isEmpty: function(){
      const blank = document.createElement('canvas');
      blank.width = canvas.width; blank.height = canvas.height;
      return canvas.toDataURL() === blank.toDataURL();
    },
    toDataURL: function(){ return canvas.toDataURL('image/png'); }
  };
}

  { id: "ultraformer", label: "Ultraformer MPT", grupo: "a" },
  { id: "endolaser", label: "Endolaser", grupo: "a" },
  { id: "criodermis", label: "Criodermis", grupo: "a" },

];
function freteFmt(n){ return "R$ " + (Number(n)||0).toFixed(2).replace(".", ","); }
function freteFmtData(iso){ const p = iso.split("-"); return p[2] + "/" + p[1] + "/" + p[0]; }
function freteTaxaPorKm(km, tabela, grupo){
  if(km <= 15) return Number(tabela[grupo + "_r0_15"]);
  if(km <= 25) return Number(tabela[grupo + "_r15_25"]);
  return Number(tabela[grupo + "_acima25"]);
}
function freteCalcular(l, tabela){
  const eq = FRETE_EQUIPAMENTOS.find(function(e){ return e.id === l.equipamento; });
  let base = 0, taxa = 0, valorKm = 0;
  const grupoCalc = eq.grupo === "combo" ? "a" : eq.grupo;
  base = Number(tabela[grupoCalc + "_frete_fixo"]);
  taxa = freteTaxaPorKm(Number(l.km), tabela, grupoCalc);
  valorKm = Number(l.km) * taxa;
  let esperaValor = 0;
  if(l.espera === "30min") esperaValor = Number(tabela.espera_30min);
  else if(l.espera === "1h") esperaValor = Number(tabela.espera_1h);
  const extra = Number(l.extra) || 0;
  const total = base + valorKm + esperaValor + extra;
  return { base: base, taxa: taxa, valorKm: valorKm, esperaValor: esperaValor, extra: extra, total: total };
}

function freteAplicarVisibilidadeVinculo(prefix){
  const v = document.getElementById('f-vinculo-' + prefix).value;
  const campoPj = document.querySelector('.campo-pj-' + prefix);
  const notaPj = document.querySelector('.campo-pj-nota-' + prefix);
  const campoClt = document.querySelector('.campo-clt-' + prefix);
  const campoPf = document.querySelector('.campo-pf-' + prefix);
  const notaPf = document.querySelector('.campo-pf-nota-' + prefix);
  if(campoPj) campoPj.style.display = (v === 'pj') ? '' : 'none';
  if(notaPj) notaPj.style.display = (v === 'pj') ? '' : 'none';
  if(campoClt) campoClt.style.display = (v === 'clt') ? '' : 'none';
  if(campoPf) campoPf.style.display = (v === 'pf') ? '' : 'none';
  if(notaPf) notaPf.style.display = (v === 'pf') ? '' : 'none';
  if(v === 'pj'){ freteAplicarVisibilidadePjFixo(prefix); }
  if(v === 'pf'){ freteAplicarVisibilidadePfFixo(prefix); }
}
function freteAplicarVisibilidadePjFixo(prefix){
  const sel = document.getElementById('f-pjfixo-' + prefix);
  if(!sel) return;
  const sim = sel.value === 'sim';
  const campoValor = document.querySelector('.campo-pj-valor-' + prefix);
  const nota = document.querySelector('.campo-pj-nota-' + prefix);
  if(campoValor) campoValor.style.display = sim ? '' : 'none';
  if(nota) nota.style.display = sim ? 'none' : '';
}
function freteAplicarVisibilidadePfFixo(prefix){
  const sel = document.getElementById('f-pffixo-' + prefix);
  if(!sel) return;
  const sim = sel.value === 'sim';
  const campoValor = document.querySelector('.campo-pf-valor-' + prefix);
  const nota = document.querySelector('.campo-pf-nota-' + prefix);
  if(campoValor) campoValor.style.display = sim ? '' : 'none';
  if(nota) nota.style.display = sim ? 'none' : '';
}
function freteColetarForm(prefix){
  const vinculoTipo = document.getElementById('f-vinculo-' + prefix).value;
  let valorFixo = null;
  if(vinculoTipo === 'pj'){
    const sim = document.getElementById('f-pjfixo-' + prefix).value === 'sim';
    valorFixo = sim ? (Number(document.getElementById('f-pjvalor-' + prefix).value) || null) : null;
  } else if(vinculoTipo === 'clt'){
    valorFixo = Number(document.getElementById('f-cltvalor-' + prefix).value) || null;
  } else if(vinculoTipo === 'pf'){
    const sim = document.getElementById('f-pffixo-' + prefix).value === 'sim';
    valorFixo = sim ? (Number(document.getElementById('f-pfvalor-' + prefix).value) || null) : null;
  }
  return {
    nome: document.getElementById('f-nome-' + prefix).value.trim(),
    telefone: document.getElementById('f-telefone-' + prefix).value.trim(),
    veiculoTipo: document.getElementById('f-veiculo-' + prefix).value,
    modelo: document.getElementById('f-modelo-' + prefix).value.trim(),
    placa: document.getElementById('f-placa-' + prefix).value.trim(),
    usuarioId: document.getElementById('f-usuario-' + prefix).value,
    vinculoTipo: vinculoTipo,
    valorFixo: valorFixo
  };
}
async function freteSalvarNovo(){

  const ins = await sb.from('comercial_frete_motoristas').insert({
    nome: dados.nome, telefone: dados.telefone, ativo: true, ordem: ordem,

}

async function freteAtualizarTabela(campo, valor){

  const p = anoMes.split("-");

  return nomes[parseInt(p[1],10)-1] + " " + p[0];
}

  const p = anoMes.split("-");
  const nomes = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];

const LEADS_PRAZOS = { contato1: 2, retomada1: 3, retomada2: 5, retomada3: 99 };
const LEADS_ETAPA_LABEL = { contato1: "1º contato", retomada1: "Retomada 1", retomada2: "Retomada 2", retomada3: "Retomada 3", sem_retorno: "Sem retorno" };
const LEADS_PROXIMA_ETAPA = { contato1: "retomada1", retomada1: "retomada2", retomada2: "retomada3", retomada3: "sem_retorno" };

function leadsDataBR(iso){
  if(!iso) return "-";
  const p = iso.split("-");
  return p[2] + "/" + p[1];
}
function leadsDiasEntre(iso1, iso2){
  const d1 = new Date(iso1 + "T00:00:00");
  const d2 = new Date(iso2 + "T00:00:00");
  return Math.round((d2 - d1) / 86400000);
}
function leadsStatus(lead){
  if(lead.etapa === "sem_retorno" || lead.alugou !== null){ return { relevante:false }; }
  if(!lead.aguardando){ return { relevante:true, aguardando:false }; }
  const hoje = premiacaoIsoHoje(0);
  const dias = leadsDiasEntre(lead.data_ultimo_envio, hoje);
  const prazo = LEADS_PRAZOS[lead.etapa];
  return { relevante:true, aguardando:true, dias:dias, prazo:prazo, atrasado: dias >= prazo };
}
function leadsRowClass(lead){
  if(lead.alugou === true) return "row-alugou";
  if(lead.alugou === false) return "row-nao";
  if(lead.estrela) return "row-estrela";
  return "row-default";
}
function equipamentoParaPremio(texto){
  if(!texto) return null;
  const t = texto.trim().toLowerCase();
  if(t.indexOf("criodermis") !== -1) return "Criodermis";
  if(t.indexOf("mpt") !== -1) return "Ultraformer MPT";
  if(t.indexOf("iii") !== -1) return "Ultraformer III";
  if(t.indexOf("lavieen") !== -1 || t.indexOf("laser") !== -1) return "Lavieen";
  if(t.indexOf("endolaser") !== -1) return "Endolaser";
  return texto;
}

  const hoje = new Date().toISOString().slice(0,10);
  const anoHoje = hoje.slice(0,4);
  const mesHoje = hoje.slice(0,7);
  if(anos.indexOf(anoHoje) === -1) anos.push(anoHoje);
  anos.sort();
  if(!window.__leadsAnoFiltro){
    window.__leadsAnoFiltro = anoHoje;
  }
  if(!window.__leadsMesFiltro){
    window.__leadsMesFiltro = mesHoje;
  }
  const nomesMesAbrev = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
  let html = '<div style="background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;margin-bottom:8px;"><div style="display:flex;gap:8px;flex-wrap:wrap;">';
  anos.forEach(function(a){
    html += '<button type="button" class="subtab' + (window.__leadsAnoFiltro === a ? " active" : "") + '" onclick="leadsSelecionarAno(&quot;' + a + '&quot;)">' + a + "</button>";
  });
  html += "</div></div>";
  html += '<div style="background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;margin-bottom:12px;"><div style="display:flex;gap:8px;flex-wrap:wrap;">';
  html += '<button type="button" class="subtab' + (window.__leadsMesFiltro === "todos" ? " active" : "") + '" onclick="leadsFiltrarMes(&quot;todos&quot;)">Todos</button>';
  for(let m=1; m<=12; m++){
    const mm = (m<10?"0":"")+m;
    const valor = window.__leadsAnoFiltro + "-" + mm;
    html += '<button type="button" class="subtab' + (window.__leadsMesFiltro === valor ? " active" : "") + '" onclick="leadsFiltrarMes(&quot;' + valor + '&quot;)">' + nomesMesAbrev[m-1] + "</button>";
  }
  html += "</div></div>";
  wrap.innerHTML = html;
}

function renderLeadsAlerta(){
  const wrap = document.getElementById("leads-alerta-wrap");
  if(!wrap) return;
  const leads = window.__leadsAtuais || [];
  const emEspera = leads.map(function(l){ return { lead:l, st:leadsStatus(l) }; })
    .filter(function(x){ return x.st.relevante && x.st.aguardando; })
    .sort(function(a,b){ return b.st.dias - a.st.dias; });
  if(!emEspera.length){
    wrap.innerHTML = '<div class="card" style="padding:14px 18px;margin-bottom:20px;color:var(--gray);font-size:13px;">✅ Nenhum lead aguardando retorno no momento.</div>';
    return;
  }
  const atrasadosCount = emEspera.filter(function(x){ return x.st.atrasado; }).length;
  wrap.innerHTML = '<div class="card" style="padding:16px 18px;margin-bottom:20px;background:var(--alert-bg);border-color:#e8cabd;"><h3 style="color:var(--alert);font-size:16px;">🔔 Leads aguardando retorno (' + emEspera.length + ')</h3>' +

      const cls = x.st.atrasado ? "status-wait" : "status-info";
      const label = x.st.dias === 0 ? "Novo — aguardando" : (x.st.dias + " dia(s) parado");
      return '<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #eaceb f;gap:10px;flex-wrap:wrap;"><div style="display:flex;align-items:center;gap:10px;"><b>' + escapeHtml(x.lead.nome) + '</b><span class="quem" style="font-size:11px;background:var(--paper-soft);padding:3px 9px;border-radius:20px;">' + LEADS_ETAPA_LABEL[x.lead.etapa] + '</span><span class="status-pill ' + cls + '"><span class="dot"></span>' + label + '</span></div><div><button class="btn btn-ghost btn-sm" onclick="leadsRegistrarContato(&quot;' + x.lead.id + '&quot;,true)">Respondeu</button> <button class="btn btn-primary btn-sm" onclick="leadsRegistrarContato(&quot;' + x.lead.id + '&quot;,false)">Não respondeu</button></div></div>';

function renderLeadsTabela(){
  const tbody = document.getElementById("tbody-leads");
  if(!tbody) return;
  const todosLeadsMes = window.__leadsAtuais || [];
  const leads = (window.__leadsMesFiltro && window.__leadsMesFiltro !== 'todos') ? todosLeadsMes.filter(function(l){ return (l.data||'').slice(0,7) === window.__leadsMesFiltro; }) : todosLeadsMes;
  if(!leads.length){ tbody.innerHTML = '<tr><td colspan="11" class="empty-hint">Nenhum lead cadastrado ainda.</td></tr>'; return; }
  const ordenados = leads.slice().sort(function(a,b){ return a.data < b.data ? -1 : (a.data > b.data ? 1 : 0); });
  const cellStyle = "padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:12.5px;";
  tbody.innerHTML = ordenados.map(function(l){
    const alugouVal = l.alugou === true ? "sim" : (l.alugou === false ? "nao" : "");
    const st = leadsStatus(l);
    let statusHtml, acaoHtml;
    if(!st.relevante){ statusHtml = '<span class="status-pill status-wait"><span class="dot"></span>—</span>'; acaoHtml = "-"; }
    else if(!st.aguardando){
      statusHtml = '<span class="status-pill status-ok"><span class="dot"></span>Em conversa</span>';
      acaoHtml = '<button class="btn btn-ghost btn-sm" style="padding:4px 8px;font-size:11px;" onclick="leadsMarcarParado(&quot;' + l.id + '&quot;)">Parou de responder</button>';
    } else {
      const cls = st.atrasado ? "status-wait" : "status-info";
      statusHtml = '<span class="status-pill ' + cls + '"><span class="dot"></span>' + st.dias + "/" + st.prazo + ' dias</span>';
      acaoHtml = '<div style="display:flex;flex-direction:column;gap:4px;min-width:110px;"><button class="btn btn-ghost btn-sm" style="padding:4px 8px;font-size:11px;" onclick="leadsRegistrarContato(&quot;' + l.id + '&quot;,true)">Respondeu</button><button class="btn btn-primary btn-sm" style="padding:4px 8px;font-size:11px;" onclick="leadsRegistrarContato(&quot;' + l.id + '&quot;,false)">Não respondeu</button></div>';
    }
    const bg = l.alugou === true ? "var(--ok-bg)" : (l.alugou === false ? "var(--alert-bg)" : (l.estrela ? "#fdf3d0" : "#fff"));
    return '<tr style="background:' + bg + ';">' +
      '<td style="' + cellStyle + '"><button class="link-btn" style="background:none;border:none;cursor:pointer;font-size:18px;color:' + (l.estrela?"#c9971f":"var(--gray-soft)") + ';" onclick="leadsToggleEstrela(&quot;' + l.id + '&quot;)">' + (l.estrela?"★":"☆") + '</button></td>' +
      '<td style="' + cellStyle + '">' + leadsDataBR(l.data) + '</td>' +
      '<td style="' + cellStyle + '">' + escapeHtml(l.nome) + '</td>' +
      '<td style="' + cellStyle + '">' + escapeHtml(l.telefone||"") + '</td>' +
      '<td style="' + cellStyle + '">' + escapeHtml(l.equipamento||"") + '</td>' +
      '<td style="' + cellStyle + '"><span class="quem" style="font-size:11px;background:var(--paper-soft);padding:4px 10px;border-radius:20px;white-space:nowrap;">' + LEADS_ETAPA_LABEL[l.etapa] + '</span></td>' +
      '<td style="' + cellStyle + '">' + statusHtml + '</td>' +
      '<td style="padding:7px 10px;border-bottom:1px solid var(--line);">' + acaoHtml + '</td>' +
      '<td style="padding:7px 10px;border-bottom:1px solid var(--line);min-width:110px;"><input value="' + escapeHtml(l.obs||"") + '" placeholder="—" style="width:100%;min-width:110px;border:1px solid transparent;background:transparent;padding:4px 6px;border-radius:4px;font-size:12.5px;font-family:inherit;white-space:normal;" onchange="leadsAtualizarObs(&quot;' + l.id + '&quot;,this.value)"></td>' +
      '<td style="' + cellStyle + '"><select style="border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:12.5px;font-family:inherit;background:#fff;" onchange="leadsAtualizarAlugou(&quot;' + l.id + '&quot;,this.value)"><option value="" ' + (alugouVal===""?"selected":"") + '>—</option><option value="sim" ' + (alugouVal==="sim"?"selected":"") + '>Sim</option><option value="nao" ' + (alugouVal==="nao"?"selected":"") + '>Não</option></select></td>' +
      '<td style="padding:9px 10px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap;"><button onclick="leadsAbrirEdicao(&quot;' + l.id + '&quot;)" title="Editar lead" style="background:none;border:1px solid var(--line);color:var(--gray);border-radius:50%;width:22px;height:22px;font-size:12px;cursor:pointer;line-height:1;margin-right:6px;">\u2699\ufe0f</button><button onclick="leadsExcluir(&quot;' + l.id + '&quot;)" title="Excluir lead" style="background:none;border:1px solid var(--alert);color:var(--alert);border-radius:50%;width:22px;height:22px;font-size:12px;cursor:pointer;line-height:1;">✕</button></td>' +
      "</tr>";
  }).join("");
}
async function adicionarLead(){
  const nome = document.getElementById("ld-nome").value.trim();
  const telefone = document.getElementById("ld-telefone").value.trim();
  let equipamento = leadsEquipSelecionado || "";
  if(equipamento === "Outros"){ equipamento = document.getElementById("ld-equip-outros").value.trim(); }
  const data = document.getElementById("ld-data").value;
  if(!nome || !data){ toast("Preencha ao menos nome e data."); return; }
  const insertResult = await sb.from("comercial_leads").insert({
    nome: nome, telefone: telefone, equipamento: equipamento, data: data,
    etapa: "contato1", data_ultimo_envio: data, aguardando: true, criado_por: currentUsuario.id
  });
  if(insertResult.error){ toast("Erro ao salvar: " + insertResult.error.message); return; }
  document.getElementById("ld-nome").value = "";
  document.getElementById("ld-telefone").value = "";
  leadsEquipSelecionado = null;
  toast("Lead adicionado.");
  await carregarLeadsComercial();
}
async function leadsRegistrarContato(id, respondeu){
  const lead = (window.__leadsAtuais||[]).find(function(l){ return l.id === id; });
  if(!lead) return;
  let updates;
  if(respondeu){
    updates = { aguardando: false };
    toast(lead.nome + " respondeu — conversa em andamento.");
  } else {
    const proxima = LEADS_PROXIMA_ETAPA[lead.etapa];
    updates = { etapa: proxima, data_ultimo_envio: premiacaoIsoHoje(0), aguardando: proxima !== "sem_retorno" };
    toast(proxima === "sem_retorno" ? (lead.nome + " — 3 tentativas sem retorno.") : ("Avançou pra " + LEADS_ETAPA_LABEL[proxima] + "."));
  }
  await sb.from("comercial_leads").update(updates).eq("id", id);
  await carregarLeadsComercial();
}

async function leadsMarcarParado(id){
  await sb.from("comercial_leads").update({ aguardando: true, data_ultimo_envio: premiacaoIsoHoje(0) }).eq("id", id);
  toast("Reiniciada a contagem de dias.");
  await carregarLeadsComercial();
}

async function leadsToggleEstrela(id){
  const lead = (window.__leadsAtuais||[]).find(function(l){ return l.id === id; });
  if(!lead) return;
  await sb.from("comercial_leads").update({ estrela: !lead.estrela }).eq("id", id);
  await carregarLeadsComercial();
}

async function leadsAtualizarObs(id, valor){
  await sb.from("comercial_leads").update({ obs: valor }).eq("id", id);
  const lead = (window.__leadsAtuais||[]).find(function(l){ return l.id === id; });
  if(lead) lead.obs = valor;
}

async function leadsAtualizarAlugou(id, valor){
  const lead = (window.__leadsAtuais||[]).find(function(l){ return l.id === id; });
  if(!lead) return;
  const alugou = valor === "sim" ? true : (valor === "nao" ? false : null);
  await sb.from("comercial_leads").update({ alugou: alugou }).eq("id", id);
  lead.alugou = alugou;
  await carregarLeadsComercial();
  if(alugou === true){
    const quer = confirm(lead.nome + " alugou! Deseja lançar o prêmio de comissão dela agora?");
    if(quer) abrirModalPremioLead(lead);
  }
}

    if(isCrio){ wrap.innerHTML=''; return; }
    wrap.innerHTML = LINEAR.concat(BOOSTER).map(function(item){
      return '<div class="dup-pill" data-key="' + item.key + '">' + item.label + '</div>';
    }).join('');
    wrap.querySelectorAll('.dup-pill').forEach(function(p){
      p.addEventListener('click', function(){ p.classList.toggle('sel'); });
    });
  }
  renderDuplicadosPills();

  document.getElementById('ci-equipamento').addEventListener('change', function(){
    document.getElementById('ci-wrap-manta').style.display = this.value === 'crio' ? 'block' : 'none';

}

async function criarLocacaoPremiacao(){
  const numero = document.getElementById('pc-numero').value.trim();
  const equipamento = document.getElementById('pc-equipamento').value;
  const motoristaId = document.getElementById('pc-motorista').value;
  const data = document.getElementById('pc-data').value;
  const errEl = document.getElementById('pc-error');
  const okEl = document.getElementById('pc-success');
  errEl.style.display='none'; okEl.style.display='none';
  if(!numero || !motoristaId || !data){ errEl.textContent = 'Preencha número, motorista e data.'; errEl.style.display='block'; return; }
  const btn = document.getElementById('btn-abrir-locacao-premiacao');
  btn.disabled = true; btn.textContent = 'Abrindo...';
  const insertLoc = await sb.from('premiacao_locacoes').insert({ numero: numero, equipamento: equipamento, motorista_id: motoristaId, data_locacao: data, criado_por: currentUsuario.id }).select('id').single();
  if(insertLoc.error){ errEl.textContent = 'Erro ao abrir: ' + insertLoc.error.message; errEl.style.display='block'; btn.disabled=false; btn.textContent='Abrir locação'; return; }
  const locId = insertLoc.data.id;
  const etapasNomes = premiacaoEtapasBase(equipamento);
  const etapasRows = etapasNomes.map(function(nome, i){ return { locacao_id: locId, ordem: i+1, nome: nome }; });
  await sb.from('premiacao_etapas').insert(etapasRows);
  okEl.textContent = 'Locação ' + numero + ' aberta.'; okEl.style.display = 'block';
  document.getElementById('pc-numero').value = '';
  btn.disabled = false; btn.textContent = 'Abrir locação';
  await carregarListaAbertasComercial();
}

async function carregarListaAbertasComercial(){
  const wrap = document.getElementById('pc-lista-abertas');
  const motoristas = await getMotoristas();
  const motoristaNome = {};
  motoristas.forEach(function(m){ motoristaNome[m.id] = m.nome; });
  const result = await sb.from('premiacao_locacoes').select('id,numero,equipamento,motorista_id,data_locacao,status,atraso').eq('status','aberta').order('data_locacao');
  if(result.error){ wrap.innerHTML = '<p class="empty-hint">Erro ao carregar: ' + escapeHtml(result.error.message) + '</p>'; return; }
  const rows = result.data || [];
  if(!rows.length){ wrap.innerHTML = '<p class="empty-hint">Nenhuma locação aberta no momento.</p>'; return; }
  wrap.innerHTML = rows.map(function(loc){
    const eq = PREMIACAO_EQUIP[loc.equipamento] || { label: loc.equipamento };
    const nomeMot = motoristaNome[loc.motorista_id] || '-';
    let actionHtml;
    if(pcEditandoId === loc.id){
      const opts = motoristas.map(function(m){
        return '<option value="' + m.id + '"' + (m.id===loc.motorista_id?' selected':'') + '>' + escapeHtml(m.nome) + '</option>';
      }).join('');
      actionHtml = '<div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;"><select id="pc-edit-select-' + loc.id + '">' + opts + '</select>' +
        '<button class="btn btn-primary" onclick="salvarEdicaoMotoristaPremiacao(&quot;' + loc.id + '&quot;)">Salvar</button>' +
        '<button class="btn btn-ghost" onclick="cancelarEdicaoMotoristaPremiacao()">Cancelar</button></div>';
    } else {
      actionHtml = '<div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;">' +
        '<button class="btn btn-ghost" onclick="abrirEdicaoMotoristaPremiacao(&quot;' + loc.id + '&quot;)">Editar motorista</button>' +
        '<button class="btn btn-ghost" style="border-color:var(--alert);color:var(--alert);" onclick="excluirLocacaoPremiacao(&quot;' + loc.id + '&quot;,&quot;' + escapeHtml(loc.numero) + '&quot;)">Excluir lançamento</button>' +
        '</div>';
    }
    return '<div class="card" style="padding:12px 14px;margin-bottom:8px;"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;">' +
      '<div><b>Locação #' + escapeHtml(loc.numero) + '</b><div style="font-size:12px;color:var(--gray);">' + eq.label + ' - ' + premiacaoDataBR(loc.data_locacao) + '</div></div>' +
      '<span class="status-pill status-wait"><span class="dot"></span>' + escapeHtml(nomeMot) + '</span></div>' + actionHtml + '</div>';
  }).join('');

async function excluirLocacaoPremiacao(locId, numero){
  const ok = confirm('Tem certeza que deseja excluir a locação #' + numero + '?\n\nIsso remove o lançamento e as etapas de premiação registradas para essa locação. Essa ação não pode ser desfeita.');

}

        '</div>' +
