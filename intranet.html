<style>
:root{

*{box-sizing:border-box;}
html,body{margin:0;background:#dedcc8;font-family:'Source Sans 3',-apple-system,sans-serif;color:var(--ink);min-height:100vh;}
#app{min-height:100vh;}
.topbar{background:var(--ink);color:#fff;padding:0 20px;display:flex;align-items:center;gap:16px;height:56px;}

.btn-logout:hover{border-color:var(--wine-bright);}

.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.login-box{width:100%;max-width:360px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:36px 32px;box-shadow:0 10px 30px rgba(0,0,0,.15);}
.login-box .brand{text-align:center;margin-bottom:22px;}
.login-box .brand .rjx{font-family:'Fraunces',Georgia,serif;font-size:28px;font-weight:600;}
.login-box .brand .tag{font-size:11px;letter-spacing:2px;color:var(--gold);text-transform:uppercase;margin-top:2px;}
.login-box p.hint{font-size:13px;color:var(--gray);margin:0 0 18px;text-align:center;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:5px;}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;font-size:14px;font-family:inherit;}
.field textarea{resize:vertical;}
.btn{display:inline-block;padding:11px 18px;border-radius:var(--radius);font-size:14px;font-weight:700;cursor:pointer;border:1px solid var(--wine);text-align:center;background:var(--paper);color:var(--wine);}

.btn-outline{background:transparent;color:var(--wine);}

.btn-ghost{background:transparent;border-color:var(--line);color:var(--gray);}

.status-ok{background:var(--ok-bg);color:var(--ok);} .status-ok .dot{background:var(--ok);}

@media (max-width:860px){

  .sidebar{display:flex;overflow-x:auto;padding:10px;}

}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function toast(msg){
  let t = document.getElementById('toast-global');
  if(!t){
    t = document.createElement('div');
    t.id = 'toast-global';
    t.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#17130f;color:#fff;padding:10px 18px;border-radius:6px;font-size:13px;z-index:999;opacity:0;transition:opacity .2s;';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(t._timer);
  t._timer = setTimeout(function(){ t.style.opacity = "0"; }, 2200);
}

/* ================= LOGIN ================= */
function screenLogin(errorMsg){  app.innerHTML = SITE_HEADER +
    '<section class="page-hero"><div class="container">' +
      '<div class="breadcrumb"><a href="index.html">Início</a> / Área do Colaborador</div>' +

        (errorMsg ? '<p style="color:#8a2e1f;background:#f6e6e0;padding:10px 12px;border-radius:4px;font-size:13px;margin:0 0 16px;">' + escapeHtml(errorMsg) + '</p>' : '') +

        '<div class="field"><label for="f-senha">Senha</label><input type="password" id="f-senha" placeholder="********"></div>' +
        '<button class="btn btn-primary btn-block" id="btn-entrar">Entrar</button>' +
        '<p style="text-align:center;font-size:12px;color:var(--gray-soft);margin-top:16px;">Esqueceu a senha? Fale com o Gerencial.</p>' +
      '</div>' +
    '</div></section>' +
    SITE_FOOTER;
  document.getElementById('btn-entrar').addEventListener('click', doLogin);
  document.getElementById('f-senha').addEventListener('keydown', function(e){ if(e.key==='Enter') doLogin(); });
  document.getElementById('f-email').addEventListener('keydown', function(e){ if(e.key==='Enter') doLogin(); });
}

async function doLogin(){
  const email = document.getElementById('f-email').value.trim();
  const senha = document.getElementById('f-senha').value;
  if(!email || !senha){ screenLogin('Preencha e-mail e senha.'); return; }
  const btn = document.getElementById('btn-entrar');
  btn.disabled = true; btn.textContent = 'Entrando...';
  const result = await sb.auth.signInWithPassword({ email: email, password: senha });
  if(result.error){ screenLogin('E-mail ou senha incorretos.'); return; }
  await boot();
}

function screenSetPassword(){
  app.innerHTML = SITE_HEADER +
    '<section class="page-hero"><div class="container">' +
      '<div class="breadcrumb"><a href="index.html">Início</a> / Área do Colaborador</div>' +
      '<span class="eyebrow">Primeiro acesso</span>' +
      '<h1 class="mt-16">Defina sua senha</h1>' +
      '<p>Essa é a primeira vez que você acessa. Crie uma senha para continuar.</p>' +
    '</div></section>' +

        '<div class="field"><label for="f-nova-senha">Nova senha</label><input type="password" id="f-nova-senha" placeholder="Mínimo 6 caracteres"></div>' +
        '<div class="field"><label for="f-conf-senha">Confirmar senha</label><input type="password" id="f-conf-senha" placeholder="Repita a senha"></div>' +
        '<button class="btn btn-primary btn-block" id="btn-definir">Definir senha e entrar</button>' +
      '</div>' +
    '</div></section>' +
    SITE_FOOTER;
  document.getElementById('btn-definir').addEventListener('click', doSetPassword);
}

async function doSetPassword(){
  const p1 = document.getElementById('f-nova-senha').value;
  const p2 = document.getElementById('f-conf-senha').value;
  const errEl = document.getElementById('set-pw-error');
  if(p1.length < 6){ errEl.textContent='A senha precisa ter pelo menos 6 caracteres.'; errEl.style.display='block'; return; }
  if(p1 !== p2){ errEl.textContent='As senhas não coincidem.'; errEl.style.display='block'; return; }
  const btn = document.getElementById('btn-definir');
  btn.disabled = true; btn.textContent = 'Salvando...';
  const result = await sb.auth.updateUser({ password: p1 });  if(result.error){ errEl.textContent = 'Erro ao salvar: ' + result.error.message; errEl.style.display='block'; btn.disabled=false; btn.textContent='Definir senha e entrar'; return; }
  history.replaceState(null, '', location.pathname);
  await boot();
}

/* ================= BOOT ================= */
async function boot(){
  const hash = window.location.hash || '';
  const isRecoveryLink = hash.indexOf('type=invite') !== -1 || hash.indexOf('type=recovery') !== -1;
  const sessionResult = await sb.auth.getSession();
  const session = sessionResult.data.session;
  if(!session){ screenLogin(); return; }
  if(isRecoveryLink){ screenSetPassword(); return; }

  const rowsResult = await sb.from('usuarios').select('*').eq('id', session.user.id);
  if(rowsResult.error || !rowsResult.data || !rowsResult.data.length){
    app.innerHTML = '<div class="login-wrap"><div class="login-box"><p>Seu usuário ainda não foi cadastrado na intranet. Fale com o Gerencial.</p><button class="btn btn-outline btn-block" id="btn-sair">Sair</button></div></div>';
    document.getElementById('btn-sair').addEventListener('click', async function(){ await sb.auth.signOut(); screenLogin(); });
    return;
  }
  currentUsuario = rowsResult.data[0];
  if(!currentUsuario.ativo){
    app.innerHTML = '<div class="login-wrap"><div class="login-box"><p>Sua conta está desativada. Fale com o Gerencial.</p><button class="btn btn-outline btn-block" id="btn-sair">Sair</button></div></div>';
    document.getElementById('btn-sair').addEventListener('click', async function(){ await sb.auth.signOut(); screenLogin(); });
    return;
  }
  renderShell();
}

/* ================= API HELPER (usuarios via serverless) ================= */
async function apiCall(method, body){
  const sessionResult = await sb.auth.getSession();
  const session = sessionResult.data.session;
  const resp = await fetch('/api/intranet-usuarios', {
    method: method,
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + session.access_token },
    body: body ? JSON.stringify(body) : undefined
  });
  const data = await resp.json().catch(function(){ return {}; });
  if(!resp.ok){ throw new Error(data.error || 'Erro na requisição.'); }
  return data;
}

/* ================= ASSINATURA (canvas) ================= */
function initSignaturePad(canvasId){
  const canvas = document.getElementById(canvasId);
  const ctx = canvas.getContext('2d');
  function resize(){
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * 2;
    canvas.height = rect.height * 2;
    ctx.scale(2,2);
    ctx.strokeStyle = '#17130f';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
  }
  resize();
  let drawing = false;
  function pos(e){
    const rect = canvas.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return { x: p.clientX - rect.left, y: p.clientY - rect.top };
  }
  function start(e){ drawing = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); e.preventDefault(); }
  function move(e){ if(!drawing) return; const p = pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); e.preventDefault(); }
  function end(){ drawing = false; }
  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, {passive:false});  canvas.addEventListener('touchmove', move, {passive:false});
  canvas.addEventListener('touchend', end);
  return {
    clear: function(){ ctx.clearRect(0,0,canvas.width,canvas.height); },
    isEmpty: function(){
      const blank = document.createElement('canvas');
      blank.width = canvas.width; blank.height = canvas.height;
      return canvas.toDataURL() === blank.toDataURL();
    },
    toDataURL: function(){ return canvas.toDataURL('image/png'); }
  };
}

function leadsDiasEntre(iso1, iso2){
  const d1 = new Date(iso1 + "T00:00:00");
  const d2 = new Date(iso2 + "T00:00:00");
  return Math.round((d2 - d1) / 86400000);
}
function leadsStatus(lead){
  if(lead.etapa === "sem_retorno" || lead.alugou !== null){ return { relevante:false }; }
  if(!lead.aguardando){ return { relevante:true, aguardando:false }; }
  const hoje = premiacaoIsoHoje(0);
  const dias = leadsDiasEntre(lead.data_ultimo_envio, hoje);
  const prazo = LEADS_PRAZOS[lead.etapa];
  return { relevante:true, aguardando:true, dias:dias, prazo:prazo, atrasado: dias >= prazo };
}
function leadsRowClass(lead){
  if(lead.alugou === true) return "row-alugou";
  if(lead.alugou === false) return "row-nao";
  if(lead.estrela) return "row-estrela";
  return "row-default";
}
function equipamentoParaPremio(texto){
  if(!texto) return null;
  const t = texto.trim().toLowerCase();
  if(t.indexOf("criodermis") !== -1) return "Criodermis";
  if(t.indexOf("mpt") !== -1) return "Ultraformer MPT";
  if(t.indexOf("iii") !== -1) return "Ultraformer III";
  if(t.indexOf("lavieen") !== -1 || t.indexOf("laser") !== -1) return "Lavieen";
  if(t.indexOf("endolaser") !== -1) return "Endolaser";
  return texto;
}
function calcularPremioLead(equipamento){ return (equipamento === "Criodermis") ? 25 : 50; }

      '<td style="padding:9px 10px;border-bottom:1px solid var(--line);"><button class="link-btn" style="background:none;border:none;cursor:pointer;font-size:16px;color:' + (l.estrela?"#c9971f":"var(--gray-soft)") + ';" onclick="leadsToggleEstrela(&quot;' + l.id + '&quot;)">' + (l.estrela?"★":"☆") + '</button></td>' +

async function adicionarLead(){
  const nome = document.getElementById("ld-nome").value.trim();
  const telefone = document.getElementById("ld-telefone").value.trim();
  const equipamento = document.getElementById("ld-equipamento").value.trim();
  const data = document.getElementById("ld-data").value;
  if(!nome || !data){ toast("Preencha ao menos nome e data."); return; }
  const insertResult = await sb.from("comercial_leads").insert({
    nome: nome, telefone: telefone, equipamento: equipamento, data: data,
    etapa: "contato1", data_ultimo_envio: data, aguardando: true, criado_por: currentUsuario.id
  });
  if(insertResult.error){ toast("Erro ao salvar: " + insertResult.error.message); return; }
  document.getElementById("ld-nome").value = "";
  document.getElementById("ld-telefone").value = "";

async function leadsRegistrarContato(id, respondeu){
  const lead = (window.__leadsAtuais||[]).find(function(l){ return l.id === id; });
  if(!lead) return;
  let updates;
  if(respondeu){
    updates = { aguardando: false };
    toast(lead.nome + " respondeu — conversa em andamento.");
  } else {
    const proxima = LEADS_PROXIMA_ETAPA[lead.etapa];
    updates = { etapa: proxima, data_ultimo_envio: premiacaoIsoHoje(0), aguardando: proxima !== "sem_retorno" };
    toast(proxima === "sem_retorno" ? (lead.nome + " — 3 tentativas sem retorno.") : ("Avançou pra " + LEADS_ETAPA_LABEL[proxima] + "."));
  }
  await sb.from("comercial_leads").update(updates).eq("id", id);
  await carregarLeadsComercial();
}

async function leadsMarcarParado(id){
  await sb.from("comercial_leads").update({ aguardando: true, data_ultimo_envio: premiacaoIsoHoje(0) }).eq("id", id);
  toast("Reiniciada a contagem de dias.");
  await carregarLeadsComercial();
}

async function leadsToggleEstrela(id){
  const lead = (window.__leadsAtuais||[]).find(function(l){ return l.id === id; });
  if(!lead) return;
  await sb.from("comercial_leads").update({ estrela: !lead.estrela }).eq("id", id);
  await carregarLeadsComercial();
}

async function leadsAtualizarObs(id, valor){
  await sb.from("comercial_leads").update({ obs: valor }).eq("id", id);
  const lead = (window.__leadsAtuais||[]).find(function(l){ return l.id === id; });
  if(lead) lead.obs = valor;
}

async function leadsAtualizarAlugou(id, valor){
  const lead = (window.__leadsAtuais||[]).find(function(l){ return l.id === id; });
  if(!lead) return;
  const alugou = valor === "sim" ? true : (valor === "nao" ? false : null);
  await sb.from("comercial_leads").update({ alugou: alugou }).eq("id", id);
  lead.alugou = alugou;
  await carregarLeadsComercial();
  if(alugou === true){
    const quer = confirm(lead.nome + " alugou! Deseja lançar o prêmio de comissão dela agora?");
    if(quer) abrirModalPremioLead(lead);
  }
}

  errEl.style.display='none'; okEl.style.display='none';

  const btn = document.getElementById('btn-abrir-locacao-premiacao');
  btn.disabled = true; btn.textContent = 'Abrindo...';
  const insertLoc = await sb.from('premiacao_locacoes').insert({ numero: numero, equipamento: equipamento, motorista_id: motoristaId, data_locacao: data, criado_por: currentUsuario.id }).select('id').single();
  if(insertLoc.error){ errEl.textContent = 'Erro ao abrir: ' + insertLoc.error.message; errEl.style.display='block'; btn.disabled=false; btn.textContent='Abrir locação'; return; }
  const locId = insertLoc.data.id;
  const etapasNomes = premiacaoEtapasBase(equipamento);
  const etapasRows = etapasNomes.map(function(nome, i){ return { locacao_id: locId, ordem: i+1, nome: nome }; });
  await sb.from('premiacao_etapas').insert(etapasRows);
  okEl.textContent = 'Locação ' + numero + ' aberta.'; okEl.style.display = 'block';
  document.getElementById('pc-numero').value = '';
  btn.disabled = false; btn.textContent = 'Abrir locação';
  await carregarListaAbertasComercial();
}

async function carregarListaAbertasComercial(){
  const wrap = document.getElementById('pc-lista-abertas');
  const motoristas = await getMotoristas();
  const motoristaNome = {};
  motoristas.forEach(function(m){ motoristaNome[m.id] = m.nome; });
  const result = await sb.from('premiacao_locacoes').select('id,numero,equipamento,motorista_id,data_locacao,status').eq('status','aberta').order('data_locacao');
  if(result.error){ wrap.innerHTML = '<p class="empty-hint">Erro ao carregar: ' + escapeHtml(result.error.message) + '</p>'; return; }
  const rows = result.data || [];
  if(!rows.length){ wrap.innerHTML = '<p class="empty-hint">Nenhuma locação aberta no momento.</p>'; return; }
  wrap.innerHTML = rows.map(function(loc){
    const eq = PREMIACAO_EQUIP[loc.equipamento] || { label: loc.equipamento };
    const nomeMot = motoristaNome[loc.motorista_id] || '-';
    let actionHtml;
    if(pcEditandoId === loc.id){
      const opts = motoristas.map(function(m){
        return '<option value="' + m.id + '"' + (m.id===loc.motorista_id?' selected':'') + '>' + escapeHtml(m.nome) + '</option>';
      }).join('');
      actionHtml = '<div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;"><select id="pc-edit-select-' + loc.id + '">' + opts + '</select>' +
        '<button class="btn btn-primary" onclick="salvarEdicaoMotoristaPremiacao(&quot;' + loc.id + '&quot;)">Salvar</button>' +
        '<button class="btn btn-ghost" onclick="cancelarEdicaoMotoristaPremiacao()">Cancelar</button></div>';
    } else {
      actionHtml = '<button class="btn btn-ghost" style="margin-top:8px;" onclick="abrirEdicaoMotoristaPremiacao(&quot;' + loc.id + '&quot;)">Editar motorista</button>';
    }
    return '<div class="card" style="padding:12px 14px;margin-bottom:8px;"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;">' +
      '<div><b>Locação #' + escapeHtml(loc.numero) + '</b><div style="font-size:12px;color:var(--gray);">' + eq.label + ' - ' + premiacaoDataBR(loc.data_locacao) + '</div></div>' +
      '<span class="status-pill status-wait"><span class="dot"></span>' + escapeHtml(nomeMot) + '</span></div>' + actionHtml + '</div>';
  }).join('');
}

function abrirEdicaoMotoristaPremiacao(locId){ pcEditandoId = locId; carregarListaAbertasComercial(); }
function cancelarEdicaoMotoristaPremiacao(){ pcEditandoId = null; carregarListaAbertasComercial(); }
async function salvarEdicaoMotoristaPremiacao(locId){
  const sel = document.getElementById('pc-edit-select-' + locId);
  await sb.from('premiacao_locacoes').update({ motorista_id: sel.value, atualizado_em: new Date().toISOString() }).eq('id', locId);
  pcEditandoId = null;
  await carregarListaAbertasComercial();
}

async function carregarControlesComercial(){
  const lista = document.getElementById('ci-lista');
  const result = await sb.from('controles_insumos').select('*').neq('status','fechado').order('criado_em', { ascending: false });
  if(result.error){
    lista.innerHTML = '<p class="empty-hint">Erro ao carregar: ' + escapeHtml(result.error.message) + '</p>';
    return;
  }
  const rows = result.data || [];
  if(!rows.length){
    lista.innerHTML = '<p class="empty-hint">Nenhum controle ativo no momento.</p>';
    return;
  }
  const motoristas = await getMotoristas();
  const nomeMotorista = function(id){ const m = motoristas.find(function(x){ return x.id === id; }); return m ? m.nome : '—'; };

  let html = '';
  rows.forEach(function(r){
    const st = STATUS_LABEL[r.status] || { text: r.status, cls: 'status-wait' };
    const podefechar = r.status === 'retirado';
    html +=
      '<div class="card loc-card">' +
        '<div class="loc-top">' +
          '<div>' +
            '<div class="loc-eq">' + (EQUIP_LABEL[r.equipamento] || r.equipamento) + '</div>' +
            '<div class="loc-name">' + escapeHtml(r.cliente_nome) + ' — #' + escapeHtml(r.numero_locacao || r.locacao_ref) + '</div>' +
            '<div class="loc-meta">Entrega: ' + escapeHtml(nomeMotorista(r.motorista_entrega_id)) + ' &middot; Retirada: ' + escapeHtml(nomeMotorista(r.motorista_retirada_id)) + '</div>' +
          '</div>' +
          '<span class="status-pill ' + st.cls + '"><span class="dot"></span>' + st.text + '</span>' +
        '</div>' +
        '<div class="loc-actions">' +
          (r.assinatura_entrega_url ? '<button class="btn btn-ghost btn-sm act-ver-ass" data-tipo="entrega" data-id="' + r.id + '">Ver assinatura de entrega</button>' : '') +          (r.assinatura_fechamento_url ? '<button class="btn btn-ghost btn-sm act-ver-ass" data-tipo="fechamento" data-id="' + r.id + '">Ver assinatura de fechamento</button>' : '') +
          (r.pdf_entrega_url ? '<button class="btn btn-ghost btn-sm act-baixar-pdf" data-tipo="entrega" data-id="' + r.id + '">Baixar PDF entrega</button>' : '') +
          (r.pdf_fechamento_url ? '<button class="btn btn-ghost btn-sm act-baixar-pdf" data-tipo="fechamento" data-id="' + r.id + '">Baixar PDF fechamento</button>' : '') +
          '<button class="btn btn-ghost btn-sm act-fechar" data-id="' + r.id + '" ' + (podefechar ? '' : 'disabled') + '>Fechar logística</button>' +
        '</div>' +
      '</div>';
  });
  lista.innerHTML = html;

  lista.querySelectorAll('.act-ver-ass').forEach(function(btn){
    btn.addEventListener('click', async function(){
      const row = rows.find(function(r){ return r.id === btn.dataset.id; });
      const url = btn.dataset.tipo === 'entrega' ? row.assinatura_entrega_url : row.assinatura_fechamento_url;
      const w = window.open('', '_blank');
      w.document.write('<img src="' + url + '" style="max-width:100%;">');
    });
  });

  lista.querySelectorAll('.act-baixar-pdf').forEach(function(btn){
    btn.addEventListener('click', function(){
      const row = rows.find(function(r){ return r.id === btn.dataset.id; });
      const url = btn.dataset.tipo === 'entrega' ? row.pdf_entrega_url : row.pdf_fechamento_url;
      const a = document.createElement('a');
      a.href = url;
      a.download = 'controle-' + (row.numero_locacao || row.locacao_ref) + '-' + btn.dataset.tipo + '.pdf';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    });
  });

  lista.querySelectorAll('.act-fechar').forEach(function(btn){
    if(btn.disabled) return;
    btn.addEventListener('click', async function(){
      if(!confirm('Fechar logística? Os dados deste controle serão removidos.')) return;
      btn.disabled = true; btn.textContent = 'Fechando...';
      await sb.from('controles_insumos').delete().eq('id', btn.dataset.id);
      await carregarControlesComercial();
    });
  });
}

async function carregarPremiacaoTransportes(){
  const content = document.getElementById('transportes-content');
  content.innerHTML = '<p class="empty-hint">Carregando...</p>';
  const result = await sb.from('premiacao_locacoes').select('id,numero,equipamento,data_locacao,status').eq('motorista_id', currentUsuario.id).order('data_locacao', { ascending: false });
  if(result.error){
    content.innerHTML = '<p class="empty-hint">Erro ao carregar: ' + escapeHtml(result.error.message) + '</p>';
    return;
  }
  const locs = result.data || [];
  const idsLocs = locs.map(function(l){ return l.id; });
  let etapasPorLoc = {};
  if(idsLocs.length){
    const rEtapas = await sb.from('premiacao_etapas').select('id,locacao_id,concluida,motorista_id').in('locacao_id', idsLocs);
    (rEtapas.data||[]).forEach(function(e){
      if(!etapasPorLoc[e.locacao_id]) etapasPorLoc[e.locacao_id] = [];
      etapasPorLoc[e.locacao_id].push(e);
    });
  }

  // dias distintos em que o motorista tem locacao (selfie e por dia, nao por locacao)
  const diasSet = {};
  locs.forEach(function(loc){ diasSet[loc.data_locacao] = true; });
  const dias = Object.keys(diasSet).sort().reverse();

  let selfiesPorDia = {};
  if(dias.length){
    const rSelfies = await sb.from('premiacao_selfies_dia').select('*').eq('motorista_id', currentUsuario.id).in('data_ref', dias);
    (rSelfies.data||[]).forEach(function(s){ selfiesPorDia[s.data_ref] = s; });
  }

  let pontos = 0, possiveis = 0;
  locs.forEach(function(loc){
    const etapas = etapasPorLoc[loc.id] || [];
    etapas.forEach(function(e){
      possiveis += 1;
      if(e.concluida && e.motorista_id === currentUsuario.id) pontos += 1;
    });
  });
  dias.forEach(function(dia){
    const s = selfiesPorDia[dia];
    possiveis += PONTOS_UNIFORME_PREMIACAO;
    if(s && s.validada === true) pontos += PONTOS_UNIFORME_PREMIACAO;
    else if(s && s.validada === false && s.motivo === 'expirada') pontos -= PONTOS_UNIFORME_PREMIACAO;
  });
  const pct = possiveis > 0 ? Math.round((pontos/possiveis)*100) : 0;
  let html = '';
  html += '<div class="card form-card"><h3>Minha pontuação</h3>';
  html += '<div style="display:flex;justify-content:space-between;align-items:center;">';
  html += '<div><div style="font-size:26px;font-weight:800;">' + pontos + ' pts</div><div class="cardsub" style="margin:2px 0 0;">de ' + possiveis + ' possíveis</div></div>';
  html += '<span class="status-pill ' + (pct>=80?'status-ok':'status-wait') + '" style="font-size:14px;"><span class="dot"></span>' + pct + '%</span>';
  html += '</div></div>';

  html += '<div class="card form-card"><h3>Selfie de uniforme do dia</h3><p class="cardsub">Uma selfie por dia cobre todas as suas locações daquele dia. Sem envio até o fim do dia, você perde ' + PONTOS_UNIFORME_PREMIACAO + ' pontos.</p>';
  html += '<div id="pt-lista-selfies-dia">';
  if(!dias.length){
    html += '<p class="empty-hint">Nenhuma locação atribuída a você ainda.</p>';
  } else {
    html += dias.map(function(dia){
      const s = selfiesPorDia[dia] || {};
      let statusLabel, statusCls, acaoHtml = '';
      if(s.validada === true){ statusLabel = 'Validada (+' + PONTOS_UNIFORME_PREMIACAO + ')'; statusCls = 'status-ok'; }
      else if(s.validada === false && s.motivo === 'expirada'){ statusLabel = 'Prazo expirado (-' + PONTOS_UNIFORME_PREMIACAO + ')'; statusCls = 'status-wait'; }
      else if(s.validada === false && s.motivo === 'reprovada'){
        statusLabel = 'IA reprovou'; statusCls = 'status-wait';
        acaoHtml = '<button class="btn btn-primary" style="margin-top:8px;" onclick="iniciarSelfiePremiacao(&quot;' + dia + '&quot;)">Tentar de novo</button>';
      } else if(s.enviada){ statusLabel = 'Aguardando validação'; statusCls = 'status-info'; }
      else {
        statusLabel = 'Selfie pendente'; statusCls = 'status-wait';
        acaoHtml = '<button class="btn btn-primary" style="margin-top:8px;" onclick="iniciarSelfiePremiacao(&quot;' + dia + '&quot;)">Tirar selfie do uniforme</button>';
      }
      return '<div class="card" style="padding:12px 14px;margin-bottom:8px;"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:center;">' +
        '<b>' + premiacaoDataBR(dia) + '</b>' +
        '<span class="status-pill ' + statusCls + '"><span class="dot"></span>' + statusLabel + '</span></div>' + acaoHtml + '</div>';
    }).join('');
  }
  html += '</div></div>';

  html += '<div class="card form-card"><h3>Minhas locações</h3>';
  html += '<div id="pt-lista-locacoes">';
  if(!locs.length){
    html += '<p class="empty-hint">Nenhuma locação atribuída a você ainda.</p>';
  } else {
    html += locs.map(function(loc){
      const eq = PREMIACAO_EQUIP[loc.equipamento] || { label: loc.equipamento };
      const etapas = etapasPorLoc[loc.id] || [];
      const feitas = etapas.filter(function(e){ return e.concluida; }).length;
      const total = etapas.length;
      return '<div class="card" style="padding:12px 14px;margin-bottom:8px;"><b>Locação #' + escapeHtml(loc.numero) + '</b><div style="font-size:12px;color:var(--gray);">' + eq.label + ' - ' + premiacaoDataBR(loc.data_locacao) + ' - ' + (loc.status==='aberta'?'em andamento':'finalizada') + ' - ' + feitas + '/' + total + ' etapas</div></div>';
    }).join('');
  }
  html += '</div></div>';
  content.innerHTML = html;
}

let premiacaoSelfieAlvo = null;
function iniciarSelfiePremiacao(dataRef){
  premiacaoSelfieAlvo = dataRef;
  let input = document.getElementById('premiacao-input-camera');
  if(!input){
    input = document.createElement('input');
    input.type = 'file'; input.accept = 'image/*'; input.capture = 'user';
    input.id = 'premiacao-input-camera'; input.style.display = 'none';
    document.body.appendChild(input);
    input.addEventListener('change', onPremiacaoSelfieFile);
  }
  input.click();
}
function premiacaoFileToDataURL(file){
  return new Promise(function(resolve, reject){
    const reader = new FileReader();
    reader.onload = function(){ resolve(reader.result); };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function onPremiacaoSelfieFile(e){
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if(!file || !premiacaoSelfieAlvo) return;
  const dataRef = premiacaoSelfieAlvo;
  const getGeo = function(){
    return new Promise(function(resolve){
      if(!navigator.geolocation){ resolve(null); return; }
      navigator.geolocation.getCurrentPosition(
        function(pos){ resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude }); },
        function(){ resolve(null); },
        { timeout: 4000 }
      );
    });
  };
  const dataUrl = await premiacaoFileToDataURL(file);
  const geo = await getGeo();
  await sb.from('premiacao_selfies_dia').upsert({
    motorista_id: currentUsuario.id, data_ref: dataRef,
    enviada: true, validada: null, motivo: null,
    geo_lat: geo ? geo.lat : null, geo_lng: geo ? geo.lng : null,
    enviada_em: new Date().toISOString()
  }, { onConflict: 'motorista_id,data_ref' });
  await carregarPremiacaoTransportes();
  try {
    const resp = await fetch('/api/validar-selfie', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ image: dataUrl })
    });
    const json = await resp.json();
    if(json && typeof json.aprovado === 'boolean'){
      if(json.aprovado){
        await sb.from('premiacao_selfies_dia').update({ validada: true, motivo: null, validada_em: new Date().toISOString() }).eq('motorista_id', currentUsuario.id).eq('data_ref', dataRef);
      } else {
        await sb.from('premiacao_selfies_dia').update({ validada: false, motivo: 'reprovada', validada_em: new Date().toISOString() }).eq('motorista_id', currentUsuario.id).eq('data_ref', dataRef);
      }
    }
  } catch(err){}
  await carregarPremiacaoTransportes();
}


function expandCartuchos(list, duplicados){
  const dup = duplicados || [];
  const out = [];
  list.forEach(function(item){
    if(dup.indexOf(item.key) !== -1){
      out.push({ key: item.key + '__1', label: item.label + ' (1)' });
      out.push({ key: item.key + '__2', label: item.label + ' (2)' });
    } else {
      out.push(item);
    }
  });
  return out;
}

function baseCartKey(key){ return key.split('__')[0]; }

function cartuchoFieldsHtml(rId, prefix, listaLinear, listaBooster, valoresBase, duplicados){
  const expLinear = expandCartuchos(listaLinear, duplicados);
  const expBooster = expandCartuchos(listaBooster, duplicados);
  function linha(item){
    const base = (valoresBase && valoresBase[item.key] != null) ? valoresBase[item.key] : '';
    const hint = base !== '' ? ' <span class="field-hint" style="color:var(--gray-soft);">(entrega: ' + base + ')</span>' : '';
    const inputId = 'cart-' + prefix + '-' + rId + '-' + item.key;
    return '<div class="insumo-row"><span style="flex:1;font-size:13.5px;">' + item.label + hint + '</span>' +      '<input type="number" min="0" class="cart-input" id="' + inputId + '" data-key="' + item.key + '" data-label="' + item.label + '" style="width:90px;" placeholder="0">' +
      '<label class="btn btn-ghost btn-sm cart-photo-btn" style="cursor:pointer;padding:8px 10px;">📷' +
        '<input type="file" accept="image/*" capture="environment" class="cart-photo-input" data-target="' + inputId + '" style="display:none;">' +
      '</label>' +
      '</div>';
  }
  let html = '<div class="field"><label>Cartuchos Linear <span style="font-weight:400;color:var(--gray-soft);">(tire foto da tela pra ler automaticamente)</span></label>' + expLinear.map(linha).join('') + '</div>';
  html += '<div class="field"><label>Cartuchos Booster</label>' + expBooster.map(linha).join('') + '</div>';
  return html;
}

function fileToDataURL(file){
  return new Promise(function(resolve, reject){
    const reader = new FileReader();
    reader.onload = function(){ resolve(reader.result); };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function wireCartPhotoInputs(container){
  container.querySelectorAll('.cart-photo-input').forEach(function(inp){
    inp.addEventListener('change', async function(){
      const file = inp.files[0];
      if(!file) return;
      const targetInput = document.getElementById(inp.dataset.target);
      const label = inp.closest('.cart-photo-btn');
      const original = label.firstChild.textContent;
      label.firstChild.textContent = '...';
      try{
        const dataUrl = await fileToDataURL(file);
        const resp = await fetch('/api/ler-disparo', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ image: dataUrl }) });
        const data = await resp.json();
        if(data && data.valor != null){ targetInput.value = data.valor; }
        else{ alert('Não consegui ler o número na foto. Preencha manualmente.'); }
      }catch(e){
        alert('Erro ao ler foto: ' + e.message);
      }finally{
        label.firstChild.textContent = original;
      }
    });
  });
}

function gerarPDFControle(r, etapa, assinaturaDataUrl, leituras){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.setFontSize(16);
  doc.text('RJX Baiense Locações - Controle de Insumos', 14, 18);
  doc.setFontSize(11);
  let y = 30;
  doc.text('Locação: #' + (r.numero_locacao || r.locacao_ref), 14, y); y += 7;
  doc.text('Cliente/Doutora: ' + (r.cliente_nome || ''), 14, y); y += 7;
  doc.text('Equipamento: ' + (EQUIP_LABEL[r.equipamento] || r.equipamento), 14, y); y += 7;
  doc.text('Etapa: ' + (etapa === 'entrega' ? 'Entrega' : 'Fechamento (retirada)'), 14, y); y += 7;
  doc.text('Data/hora: ' + new Date().toLocaleString('pt-BR'), 14, y); y += 10;
  if(leituras && leituras.length){
    doc.setFontSize(12); doc.text('Leituras:', 14, y); y += 7;
    doc.setFontSize(10);
    leituras.forEach(function(l){ doc.text(l, 16, y); y += 6; });
    y += 4;
  }
  if(assinaturaDataUrl){
    doc.setFontSize(11); doc.text('Assinatura:', 14, y); y += 4;
    try{ doc.addImage(assinaturaDataUrl, 'PNG', 14, y, 80, 35); }catch(e){}
  }
  return doc.output('datauristring');
}

async function carregarControlesTransportes(){
  const content = document.getElementById('transportes-content');
  const result = await sb.from('controles_insumos')
    .select('*')
    .neq('status','fechado')
    .or('motorista_entrega_id.eq.' + currentUsuario.id + ',motorista_retirada_id.eq.' + currentUsuario.id)
    .order('criado_em', { ascending: true });

  if(result.error){
    content.innerHTML = '<p class="empty-hint">Erro ao carregar: ' + escapeHtml(result.error.message) + '</p>';
    return;
  }
  const rows = result.data || [];
  if(!rows.length){
    content.innerHTML = '<p class="empty-hint">Nenhum controle atribuído a você no momento.</p>';
    return;
  }

  let html = '';
  rows.forEach(function(r){    const st = STATUS_LABEL[r.status] || { text: r.status, cls: 'status-wait' };
    const souEntrega = r.motorista_entrega_id === currentUsuario.id;
    const souRetirada = r.motorista_retirada_id === currentUsuario.id;
    const isCrio = r.equipamento === 'crio';

    html +=
      '<div class="card loc-card" id="job-' + r.id + '">' +
        '<div class="loc-top">' +
          '<div>' +
            '<div class="loc-eq">' + (EQUIP_LABEL[r.equipamento] || r.equipamento) + '</div>' +
            '<div class="loc-name">' + escapeHtml(r.cliente_nome) + ' — #' + escapeHtml(r.numero_locacao || r.locacao_ref) + '</div>' +
            (r.data_locacao ? '<div class="loc-meta">Data: ' + r.data_locacao.split('-').reverse().join('/') + '</div>' : '') +
          '</div>' +
          '<span class="status-pill ' + st.cls + '"><span class="dot"></span>' + st.text + '</span>' +
        '</div>' +
        (!r.contrato_assinado_online ? '<div class="notice-box" style="margin-top:12px;margin-bottom:0;">Contrato não confirmado como assinado online — buscar assinatura presencial na entrega.</div>' : '') +
        (r.observacao ? '<div class="loc-meta" style="margin-top:10px;">Obs: ' + escapeHtml(r.observacao) + '</div>' : '') +
        '<div class="loc-actions" id="actions-' + r.id + '"></div>' +
        '<div id="panel-' + r.id + '"></div>' +
      '</div>';
  });
  content.innerHTML = html;

  rows.forEach(function(r){
    const souEntrega = r.motorista_entrega_id === currentUsuario.id;
    const souRetirada = r.motorista_retirada_id === currentUsuario.id;
    const actionsEl = document.getElementById('actions-' + r.id);

    if(r.status === 'aguardando_entrega' && souEntrega){
      const btn = document.createElement('button');
      btn.className = 'btn btn-primary btn-sm';
      btn.textContent = 'Iniciar entrega';
      btn.addEventListener('click', function(){ abrirPainelEntrega(r); });
      actionsEl.appendChild(btn);
    } else if(r.status === 'entregue' && souRetirada){
      const btn = document.createElement('button');
      btn.className = 'btn btn-primary btn-sm';
      btn.textContent = 'Iniciar retirada';
      btn.addEventListener('click', function(){ abrirPainelRetirada(r); });
      actionsEl.appendChild(btn);
    }
  });
}

function abrirPainelEntrega(r){
  const isCrio = r.equipamento === 'crio';
  const panel = document.getElementById('panel-' + r.id);
  panel.innerHTML =
    '<div class="card" style="margin-top:14px;background:var(--paper-soft);">' +
      '<h3 style="font-size:14px;margin-bottom:12px;">Registro de entrega</h3>' +
      (isCrio
        ? '<div class="field"><label>Quantidade de manta entregue</label><input type="number" min="0" id="manta-entrega-' + r.id + '" placeholder="0"></div>'
        : cartuchoFieldsHtml(r.id, 'ent', LINEAR, BOOSTER, null, r.cartuchos_duplicados)
      ) +
      '<div class="field"><label>Assinatura da doutora</label><canvas class="sig-canvas" id="sig-entrega-' + r.id + '" style="width:100%;height:140px;background:#fff;border:1.5px dashed var(--line);border-radius:4px;"></canvas>' +
        '<button type="button" class="btn btn-ghost btn-sm" style="margin-top:6px;" id="btn-limpar-sig-' + r.id + '">Limpar assinatura</button>' +
      '</div>' +
      '<div id="err-entrega-' + r.id + '" class="login-error" style="display:none;"></div>' +
      '<button class="btn btn-primary btn-block" id="btn-confirmar-entrega-' + r.id + '">Confirmar entrega</button>' +
    '</div>';

  wireCartPhotoInputs(panel);
  const pad = initSignaturePad('sig-entrega-' + r.id);
  document.getElementById('btn-limpar-sig-' + r.id).addEventListener('click', function(){ pad.clear(); });

  document.getElementById('btn-confirmar-entrega-' + r.id).addEventListener('click', async function(){
    const errEl = document.getElementById('err-entrega-' + r.id);
    errEl.style.display = 'none';    if(pad.isEmpty()){ errEl.textContent = 'Colete a assinatura antes de confirmar.'; errEl.style.display='block'; return; }

    let cartuchos = r.cartuchos || {linear:[], booster:[]};
    let manta = r.manta || {entrega:{}, retorno:{}};
    const leituras = [];

    if(isCrio){
      const qtd = parseInt(document.getElementById('manta-entrega-' + r.id).value, 10) || 0;
      manta = { entrega: { quantidade: qtd, ts: new Date().toISOString() }, retorno: manta.retorno || {} };
      leituras.push('Manta entregue: ' + qtd);
    } else {
      const entregaLinear = {};
      const entregaBooster = {};
      panel.querySelectorAll('.cart-input').forEach(function(inp){
        const key = inp.dataset.key;
        const val = parseInt(inp.value, 10) || 0;
        const isBooster = BOOSTER.some(function(b){ return b.key === baseCartKey(key); });
        if(isBooster) entregaBooster[key] = val; else entregaLinear[key] = val;
        leituras.push(inp.dataset.label + ': ' + val);
      });
      cartuchos = { linear: [{ etapa: 'entrega', valores: entregaLinear, ts: new Date().toISOString() }], booster: [{ etapa: 'entrega', valores: entregaBooster, ts: new Date().toISOString() }] };
    }

    const btn = document.getElementById('btn-confirmar-entrega-' + r.id);
    btn.disabled = true; btn.textContent = 'Salvando...';

    const assinaturaUrl = pad.toDataURL();
    let pdfUrl = null;
    try{ pdfUrl = gerarPDFControle(r, 'entrega', assinaturaUrl, leituras); }catch(e){}

    const result = await sb.from('controles_insumos').update({
      cartuchos: cartuchos,
      manta: manta,
      assinatura_entrega_url: assinaturaUrl,
      pdf_entrega_url: pdfUrl,
      status: 'entregue',
      entregue_em: new Date().toISOString()
    }).eq('id', r.id);

    if(result.error){ errEl.textContent = 'Erro: ' + result.error.message; errEl.style.display='block'; btn.disabled=false; btn.textContent='Confirmar entrega'; return; }
    await carregarControlesTransportes();
  });
}

function abrirPainelRetirada(r){
  const isCrio = r.equipamento === 'crio';
  const panel = document.getElementById('panel-' + r.id);
  const valoresEntregaLinear = (!isCrio && r.cartuchos && r.cartuchos.linear && r.cartuchos.linear[0]) ? r.cartuchos.linear[0].valores : {};
  const valoresEntregaBooster = (!isCrio && r.cartuchos && r.cartuchos.booster && r.cartuchos.booster[0]) ? r.cartuchos.booster[0].valores : {};
  const valoresEntregaTudo = Object.assign({}, valoresEntregaLinear, valoresEntregaBooster);
  const mantaEntregaQtd = (isCrio && r.manta && r.manta.entrega) ? (r.manta.entrega.quantidade || 0) : 0;

  panel.innerHTML =
    '<div class="card" style="margin-top:14px;background:var(--paper-soft);">' +
      '<h3 style="font-size:14px;margin-bottom:12px;">Registro de retirada</h3>' +
      (isCrio
        ? '<div class="field"><label>Quantidade de manta retirada <span style="color:var(--gray-soft);font-weight:400;">(entregue: ' + mantaEntregaQtd + ')</span></label><input type="number" min="0" id="manta-retirada-' + r.id + '" placeholder="0"></div>'
        : cartuchoFieldsHtml(r.id, 'ret', LINEAR, BOOSTER, valoresEntregaTudo, r.cartuchos_duplicados)
      ) +
      '<div class="field"><label>Assinatura da doutora (fechamento)</label><canvas class="sig-canvas" id="sig-fechamento-' + r.id + '" style="width:100%;height:140px;background:#fff;border:1.5px dashed var(--line);border-radius:4px;"></canvas>' +
        '<button type="button" class="btn btn-ghost btn-sm" style="margin-top:6px;" id="btn-limpar-sig2-' + r.id + '">Limpar assinatura</button>' +
      '</div>' +
      '<div id="err-retirada-' + r.id + '" class="login-error" style="display:none;"></div>' +
      '<button class="btn btn-primary btn-block" id="btn-confirmar-retirada-' + r.id + '">Confirmar retirada</button>' +
    '</div>';

  wireCartPhotoInputs(panel);
  const pad = initSignaturePad('sig-fechamento-' + r.id);  document.getElementById('btn-limpar-sig2-' + r.id).addEventListener('click', function(){ pad.clear(); });

  document.getElementById('btn-confirmar-retirada-' + r.id).addEventListener('click', async function(){
    const errEl = document.getElementById('err-retirada-' + r.id);
    errEl.style.display = 'none';
    if(pad.isEmpty()){ errEl.textContent = 'Colete a assinatura antes de confirmar.'; errEl.style.display='block'; return; }

    let cartuchos = r.cartuchos || {linear:[], booster:[]};
    let manta = r.manta || {entrega:{}, retorno:{}};
    const leituras = [];

    if(isCrio){
      const qtd = parseInt(document.getElementById('manta-retirada-' + r.id).value, 10) || 0;
      manta = { entrega: manta.entrega || {}, retorno: { quantidade: qtd, ts: new Date().toISOString() } };
      leituras.push('Manta retirada: ' + qtd + ' (entregue: ' + mantaEntregaQtd + ')');
    } else {
      const retiradaLinear = {};
      const retiradaBooster = {};
      panel.querySelectorAll('.cart-input').forEach(function(inp){
        const key = inp.dataset.key;
        const val = parseInt(inp.value, 10) || 0;
        const isBooster = BOOSTER.some(function(b){ return b.key === baseCartKey(key); });
        if(isBooster) retiradaBooster[key] = val; else retiradaLinear[key] = val;
        const base = valoresEntregaTudo[key];
        const diff = (base != null) ? (base - val) : null;
        leituras.push(inp.dataset.label + ': ' + val + (diff != null ? ' (usados: ' + diff + ')' : ''));
      });
      const entregaEntry = cartuchos.linear && cartuchos.linear[0] ? cartuchos.linear[0] : { valores: {} };
      const entregaEntryB = cartuchos.booster && cartuchos.booster[0] ? cartuchos.booster[0] : { valores: {} };
      cartuchos = {
        linear: [entregaEntry, { etapa: 'retirada', valores: retiradaLinear, ts: new Date().toISOString() }],
        booster: [entregaEntryB, { etapa: 'retirada', valores: retiradaBooster, ts: new Date().toISOString() }]
      };
    }

    const btn = document.getElementById('btn-confirmar-retirada-' + r.id);
    btn.disabled = true; btn.textContent = 'Salvando...';

    const assinaturaUrl = pad.toDataURL();
    let pdfUrl = null;
    try{ pdfUrl = gerarPDFControle(r, 'fechamento', assinaturaUrl, leituras); }catch(e){}

    const result = await sb.from('controles_insumos').update({
      cartuchos: cartuchos,
      manta: manta,
      assinatura_fechamento_url: assinaturaUrl,
      pdf_fechamento_url: pdfUrl,
      status: 'retirado',
      retirado_em: new Date().toISOString()
    }).eq('id', r.id);

    if(result.error){ errEl.textContent = 'Erro: ' + result.error.message; errEl.style.display='block'; btn.disabled=false; btn.textContent='Confirmar retirada'; return; }
    await carregarControlesTransportes();
  });
}

function mesAtualInfo(){
var d = new Date();
var y = d.getFullYear();
var m = d.getMonth();
var first = new Date(y, m, 1).toISOString().slice(0,10);
var last = new Date(y, m+1, 0).toISOString().slice(0,10);
var label = d.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
return { first: first, last: last, label: label };
}

async function renderOperacional(container){
  const isGestor = (currentUsuario.papel === 'gerencial' || currentUsuario.papel === 'operacional');
  container.innerHTML =
    '<div class="pagehead"><div class="crumb">Intranet / <b>Operacional</b></div><h1>Operacional</h1><div class="sub">' + escapeHtml(currentUsuario.nome) + ' &middot; acesso Operacional</div></div>' +

let opTabAtual = 'aberta';
function mudarTabOperacionalPremiacao(t){ opTabAtual = t; carregarPremiacaoOperacional(true); }

async function carregarPremiacaoOperacional(isGestor){
  const content = document.getElementById('operacional-content');
  const motoristas = await getMotoristas();
  const motoristaNome = {};
  motoristas.forEach(function(m){ motoristaNome[m.id] = m.nome; });
  const result = await sb.from('premiacao_locacoes').select('id,numero,equipamento,motorista_id,data_locacao,status').order('data_locacao', { ascending: false });
  if(result.error){
    content.innerHTML = '<p class="empty-hint">Erro ao carregar: ' + escapeHtml(result.error.message) + '</p>';
    return;
  }
  const locs = result.data || [];
  const idsLocs = locs.map(function(l){ return l.id; });
  let etapasPorLoc = {};
  if(idsLocs.length){
    const rEtapas = await sb.from('premiacao_etapas').select('id,locacao_id,ordem,nome,concluida,motorista_id').in('locacao_id', idsLocs).order('ordem');
    (rEtapas.data || []).forEach(function(e){
      if(!etapasPorLoc[e.locacao_id]) etapasPorLoc[e.locacao_id] = [];
      etapasPorLoc[e.locacao_id].push(e);
    });
  }

  // pares distintos (motorista, dia) que precisam de selfie
  const paresSet = {};
  const paresList = [];
  locs.forEach(function(loc){
    const chave = loc.motorista_id + '|' + loc.data_locacao;
    if(!paresSet[chave]){ paresSet[chave] = true; paresList.push({ motorista_id: loc.motorista_id, data_ref: loc.data_locacao }); }
  });
  let selfiesPorPar = {};
  if(paresList.length){
    const motoristaIds = [...new Set(paresList.map(function(p){ return p.motorista_id; }))];
    const rSelfies = await sb.from('premiacao_selfies_dia').select('*').in('motorista_id', motoristaIds);
    (rSelfies.data || []).forEach(function(s){
      selfiesPorPar[s.motorista_id + '|' + s.data_ref] = s;
    });
  }

  let html = '';
  html += '<div class="card" style="background:var(--paper-soft);"><p class="cardsub" style="margin:0;">Cada etapa do manual vale <b>1 ponto</b> (11 etapas em equipamentos com insumo, 8 nos demais). A selfie de uniforme vale <b>' + PONTOS_UNIFORME_PREMIACAO + ' pontos por dia</b> (cobre todas as locações daquele dia), enviada pelo motorista na aba de Transportes e validada por IA. Sem envio até o fim do dia, ele perde os ' + PONTOS_UNIFORME_PREMIACAO + ' pontos.</p></div>';
  html += '<div class="card form-card"><h3>Selfies do dia</h3><p class="cardsub">Quem envia é o motorista. Use o botão para expirar quem não enviou até o fim do dia.</p>';
  html += '<div id="op-lista-selfies">';
  if(!paresList.length){
    html += '<p class="empty-hint">Nenhuma locação registrada.</p>';
  } else {
    html += paresList.sort(function(a,b){ return b.data_ref.localeCompare(a.data_ref); }).map(function(par){
      const s = selfiesPorPar[par.motorista_id + '|' + par.data_ref] || {};
      let label, cls;
      if(s.validada === true){ label = 'Validada (+' + PONTOS_UNIFORME_PREMIACAO + ')'; cls = 'status-ok'; }
      else if(s.validada === false && s.motivo === 'expirada'){ label = 'Prazo expirado (-' + PONTOS_UNIFORME_PREMIACAO + ')'; cls = 'status-wait'; }
      else if(s.validada === false && s.motivo === 'reprovada'){ label = 'IA reprovou - reenviar'; cls = 'status-wait'; }
      else if(s.enviada){ label = 'Aguardando validação'; cls = 'status-info'; }
      else { label = 'Selfie pendente'; cls = 'status-wait'; }
      return '<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;"><span>' + escapeHtml(motoristaNome[par.motorista_id] || '-') + ' - ' + premiacaoDataBR(par.data_ref) + '</span><span class="status-pill ' + cls + '"><span class="dot"></span>' + label + '</span></div>';
    }).join('');
  }
  html += '</div>';
  html += '<button class="btn btn-ghost" style="margin-top:12px;" id="btn-virar-dia-premiacao">Simular virada do dia</button></div>';
  html += '<div class="subnav" style="margin:20px 0 12px;">';
  html += '<button class="subtab' + (opTabAtual==='aberta'?' active':'') + '" onclick="mudarTabOperacionalPremiacao(&quot;aberta&quot;)">Locações abertas</button>';
  html += '<button class="subtab' + (opTabAtual==='fechada'?' active':'') + '" onclick="mudarTabOperacionalPremiacao(&quot;fechada&quot;)">Locações fechadas</button>';
  html += '</div>';
  const locsFiltradas = locs.filter(function(l){ return l.status === opTabAtual; });
  if(!locsFiltradas.length){
    html += '<p class="empty-hint">Nenhuma locação ' + (opTabAtual==='aberta'?'aberta':'fechada') + '.</p>';
  } else {
    html += locsFiltradas.map(function(loc){
      const eq = PREMIACAO_EQUIP[loc.equipamento] || { label: loc.equipamento };
      const etapas = etapasPorLoc[loc.id] || [];
      const feitas = etapas.filter(function(e){ return e.concluida; }).length;
      const total = etapas.length;
      const etapasHtml = etapas.map(function(e){
        return '<div style="display:flex;align-items:center;gap:10px;padding:6px 0;font-size:13px;"><input type="checkbox" ' + (e.concluida?'checked':'') + ' ' + (loc.status==='fechada'?'disabled':'') + ' onchange="togglePremiacaoEtapa(&quot;' + e.id + '&quot;,&quot;' + loc.id + '&quot;,this.checked)"> <span style="flex:1;">' + e.ordem + '. ' + escapeHtml(e.nome) + '</span>' + (e.concluida ? '<span class="quem" style="font-size:11px;color:var(--gray);">' + escapeHtml(motoristaNome[e.motorista_id] || '') + '</span>' : '') + '</div>';
      }).join('');
      return '<div class="card" style="margin-bottom:12px;"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;"><div><b>Locação #' + escapeHtml(loc.numero) + '</b><div style="font-size:12px;color:var(--gray);">' + eq.label + ' - ' + escapeHtml(motoristaNome[loc.motorista_id]||'-') + '</div></div><span style="font-size:12px;color:var(--gray);">' + feitas + '/' + total + ' etapas</span></div><div style="margin-top:8px;">' + etapasHtml + '</div>' +
        (loc.status==='aberta' ? '<button class="btn btn-primary" style="margin-top:10px;" onclick="finalizarLocacaoPremiacao(&quot;' + loc.id + '&quot;,' + feitas + ',' + total + ')">Finalizar locação' + (feitas<total?' (' + (total-feitas) + ' pendente' + ((total-feitas)>1?'s':'') + ')':'') + '</button>' : '') + '</div>';
    }).join('');
  }
  const dados = {};
  motoristas.forEach(function(m){ dados[m.id] = { nome: m.nome, pontos: 0, possiveis: 0 }; });
  locs.forEach(function(loc){
    const etapas = etapasPorLoc[loc.id] || [];
    etapas.forEach(function(e){
      const resp = e.motorista_id || loc.motorista_id;
      if(!dados[resp]) dados[resp] = { nome: motoristaNome[resp] || '-', pontos: 0, possiveis: 0 };
      dados[resp].possiveis += 1;
      if(e.concluida) dados[resp].pontos += 1;
    });
  });
  paresList.forEach(function(par){
    const s = selfiesPorPar[par.motorista_id + '|' + par.data_ref];
    const resp = par.motorista_id;
    if(!dados[resp]) dados[resp] = { nome: motoristaNome[resp] || '-', pontos: 0, possiveis: 0 };
    dados[resp].possiveis += PONTOS_UNIFORME_PREMIACAO;
    if(s && s.validada === true) dados[resp].pontos += PONTOS_UNIFORME_PREMIACAO;
    else if(s && s.validada === false && s.motivo === 'expirada') dados[resp].pontos -= PONTOS_UNIFORME_PREMIACAO;
  });
  const ranking = Object.values(dados).filter(function(r){ return r.possiveis > 0; }).sort(function(a,b){ return (b.pontos/b.possiveis) - (a.pontos/a.possiveis); });
  html += '<div class="card form-card" style="margin-top:20px;"><h3>Ranking do mês</h3>';
  if(!ranking.length){
    html += '<p class="empty-hint">Sem dados ainda.</p>';
  } else {
    html += '<table style="width:100%;border-collapse:collapse;font-size:13px;"><thead><tr><th style="text-align:left;padding:8px 4px;border-bottom:1px solid var(--line);">Motorista</th><th style="text-align:left;padding:8px 4px;border-bottom:1px solid var(--line);">Pontos</th><th style="text-align:left;padding:8px 4px;border-bottom:1px solid var(--line);">%</th></tr></thead><tbody>';
    html += ranking.map(function(r){
      const pct = Math.round((r.pontos/r.possiveis)*100);
      const naMeta = pct >= 80;
      return '<tr><td style="padding:8px 4px;border-bottom:1px solid var(--line);">' + escapeHtml(r.nome) + '</td><td style="padding:8px 4px;border-bottom:1px solid var(--line);">' + r.pontos + ' / ' + r.possiveis + '</td><td style="padding:8px 4px;border-bottom:1px solid var(--line);"><span class="status-pill ' + (naMeta?'status-ok':'status-wait') + '"><span class="dot"></span>' + pct + '%</span></td></tr>';
    }).join('');
    html += '</tbody></table>';
  }
  html += '</div>';
  content.innerHTML = html;
  document.getElementById('btn-virar-dia-premiacao').addEventListener('click', virarDiaPremiacao);
}

async function togglePremiacaoEtapa(etapaId, locId, checked){
  const updates = { concluida: checked };
  if(checked){
    const locResult = await sb.from('premiacao_locacoes').select('motorista_id').eq('id', locId).single();
    updates.motorista_id = locResult.data ? locResult.data.motorista_id : null;
    updates.concluida_em = new Date().toISOString();
  } else {
    updates.motorista_id = null;
    updates.concluida_em = null;
  }
  await sb.from('premiacao_etapas').update(updates).eq('id', etapaId);
  await carregarPremiacaoOperacional(true);
}

async function finalizarLocacaoPremiacao(locId, feitas, total){
  if(feitas < total){
    const ok = confirm('Esta locação tem ' + (total-feitas) + ' etapa(s) não marcadas, que não vão pontuar. Finalizar mesmo assim?');
    if(!ok) return;
  }
  await sb.from('premiacao_locacoes').update({ status: 'fechada', atualizado_em: new Date().toISOString() }).eq('id', locId);
  await carregarPremiacaoOperacional(true);
}

async function virarDiaPremiacao(){
  const hoje = premiacaoIsoHoje(0);
  const result = await sb.from('premiacao_locacoes').select('motorista_id,data_locacao').lt('data_locacao', hoje);
  const locs = result.data || [];
  const paresSet = {};
  const pares = [];
  locs.forEach(function(loc){
    const chave = loc.motorista_id + '|' + loc.data_locacao;
    if(!paresSet[chave]){ paresSet[chave] = true; pares.push({ motorista_id: loc.motorista_id, data_ref: loc.data_locacao }); }
  });
  let n = 0;
  for(const par of pares){
    const sResult = await sb.from('premiacao_selfies_dia').select('validada,motivo').eq('motorista_id', par.motorista_id).eq('data_ref', par.data_ref).maybeSingle();
    const s = sResult.data;
    if(!s || (s.validada !== true && s.motivo !== 'expirada')){
      await sb.from('premiacao_selfies_dia').upsert({ motorista_id: par.motorista_id, data_ref: par.data_ref, validada: false, motivo: 'expirada', enviada: false, validada_em: new Date().toISOString() }, { onConflict: 'motorista_id,data_ref' });
      n++;
    }
  }
  alert(n > 0 ? (n + ' selfie(s) expiraram sem validação.') : 'Nenhuma selfie vencida no momento.');
  await carregarPremiacaoOperacional(true);
}
