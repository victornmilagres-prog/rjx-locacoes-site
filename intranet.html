async function tsCarregarLocacoesInner(){
  const content = document.getElementById('ts-prem-content');
  content.innerHTML = '<p class="empty-hint">Carregando...</p>';
  const result = await sb.from('premiacao_locacoes').select('id,numero,equipamento,data_locacao,status,atraso').eq('motorista_id', currentUsuario.id).order('data_locacao', { ascending: false });
  if(result.error){
    content.innerHTML = '<p class="empty-hint">Erro ao carregar: ' + escapeHtml(result.error.message) + '</p>';
    return;
  }
  const locs = result.data || [];
  
  const idsLocs = locs.map(function(l){ return l.id; });
  let etapasPorLoc = {};
  if(idsLocs.length){
    const rEtapas = await sb.from('premiacao_etapas').select('id,locacao_id,concluida,motorista_id').in('locacao_id', idsLocs);
    (rEtapas.data||[]).forEach(function(e){
      if(!etapasPorLoc[e.locacao_id]) etapasPorLoc[e.locacao_id] = [];
      etapasPorLoc[e.locacao_id].push(e);
    });
  }

  // dias distintos em que o motorista tem locacao (selfie e por dia, nao por locacao)
  const diasSet = {};
  locs.forEach(function(loc){ diasSet[loc.data_locacao] = true; });
  const dias = Object.keys(diasSet).sort().reverse();
  const hoje = new Date().toISOString().slice(0,10);

  let selfiesPorDia = {};
  if(dias.length){
    const rSelfies = await sb.from('premiacao_selfies_dia').select('*').eq('motorista_id', currentUsuario.id).in('data_ref', dias);
    (rSelfies.data||[]).forEach(function(s){ selfiesPorDia[s.data_ref] = s; });
  }

  let pontos = 0, possiveis = 0;
  locs.forEach(function(loc){
    const etapas = etapasPorLoc[loc.id] || [];
    etapas.forEach(function(e){
      possiveis += 1;
      if(e.concluida && e.motorista_id === currentUsuario.id) pontos += 1;
    });
  });
  let selfiesValidasCount = 0;
  dias.forEach(function(dia){
    const s = selfiesPorDia[dia];
    possiveis += PONTOS_UNIFORME_PREMIACAO;
    if(s && s.validada === true){ pontos += PONTOS_UNIFORME_PREMIACAO; selfiesValidasCount++; }
    else if(s && s.validada === false && s.motivo === 'expirada') pontos -= PONTOS_UNIFORME_PREMIACAO;
    else if(s && s.validada === false && s.motivo === 'reprovada' && (!s.retry_ate || new Date(s.retry_ate) <= new Date())) pontos -= PONTOS_UNIFORME_PREMIACAO;
    else if((!s || !s.enviada) && dia !== hoje) pontos -= PONTOS_UNIFORME_PREMIACAO;
  });
  const pct = possiveis > 0 ? Math.round((pontos/possiveis)*100) : 0;
  let html = '';
  

  html += '<div class="card form-card"><h3>Selfie de uniforme do dia</h3><p class="cardsub">Uma selfie por dia cobre todas as suas locações daquele dia. Sem envio até o fim do dia, você perde ' + PONTOS_UNIFORME_PREMIACAO + ' pontos.</p>';
  html += '<div id="pt-lista-selfies-dia">';
  if(!dias.length){
    html += '<p class="empty-hint">Nenhuma locação atribuída a você ainda.</p>';
  } else {
    html += dias.map(function(dia){
      const s = selfiesPorDia[dia] || {};
      let statusLabel, statusCls, acaoHtml = '';
      if(s.validada === true){ statusLabel = 'Validada (+' + PONTOS_UNIFORME_PREMIACAO + ')'; statusCls = 'status-ok'; }
      else if(s.validada === false && s.motivo === 'expirada'){ statusLabel = 'Prazo expirado (-' + PONTOS_UNIFORME_PREMIACAO + ')'; statusCls = 'status-wait'; }
      else if(s.validada === false && s.motivo === 'reprovada'){
        const dentroPrazoRetry = s.retry_ate && new Date(s.retry_ate) > new Date();
        if(dia === hoje && dentroPrazoRetry){
          const minsRestantes = Math.max(1, Math.ceil((new Date(s.retry_ate) - new Date())/60000));
          statusLabel = 'IA reprovou — tente de novo em até ' + minsRestantes + ' min'; statusCls = 'status-wait';
          acaoHtml = '<button class="btn btn-primary" style="margin-top:8px;" onclick="iniciarSelfiePremiacao(&quot;' + dia + '&quot;)">Tentar de novo</button>';
        } else {
          statusLabel = 'IA reprovou (-' + PONTOS_UNIFORME_PREMIACAO + ')'; statusCls = 'status-wait';
        }
      } else if(s.enviada){ statusLabel = 'Aguardando validação'; statusCls = 'status-info'; }
      else if(dia !== hoje){
        statusLabel = 'Prazo expirado (-' + PONTOS_UNIFORME_PREMIACAO + ')'; statusCls = 'status-wait';
      }
      else {
        statusLabel = 'Selfie pendente'; statusCls = 'status-wait';
        acaoHtml = '<button class="btn btn-primary" style="margin-top:8px;" onclick="iniciarSelfiePremiacao(&quot;' + dia + '&quot;)">Tirar selfie do uniforme</button>';
      }
      return '<div class="card" style="padding:12px 14px;margin-bottom:8px;"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:center;">' +
        '<b>' + premiacaoDataBR(dia) + '</b>' +
        '<span class="status-pill ' + statusCls + '"><span class="dot"></span>' + statusLabel + '</span></div>' + acaoHtml + '</div>';
    }).join('');
  }
  html += '</div></div>';

  html += '<div class="card form-card"><h3>Minhas locações</h3>';
  html += '<div id="pt-lista-locacoes">';
  if(!locs.length){
    html += '<p class="empty-hint">Nenhuma locação atribuída a você ainda.</p>';
  } else {
    html += locs.map(function(loc){
      const eq = PREMIACAO_EQUIP[loc.equipamento] || { label: loc.equipamento };
      const etapas = etapasPorLoc[loc.id] || [];
      const feitas = etapas.filter(function(e){ return e.concluida; }).length;
      const total = etapas.length;
      return '<div class="card" style="padding:12px 14px;margin-bottom:8px;"><b>Locação #' + escapeHtml(loc.numero) + '</b><div style="font-size:12px;color:var(--gray);">' + eq.label + ' - ' + premiacaoDataBR(loc.data_locacao) + ' - ' + (loc.status==='aberta'?'em andamento':'finalizada') + ' - ' + feitas + '/' + total + ' etapas</div></div>';
    }).join('');
  }
  html += '</div></div>';
  content.innerHTML = html;
  const locsFechadasTransp = (result.data||[]).filter(function(l){ return l.status === "fechada"; });
  const resumoCardHtml = '<div class="resumo">' +
      '<div><div class="pontos">' + pontos + '</div><div class="pontos-lbl">Pontos este mês</div></div>' +
      '<div class="divisor"></div>' +
      '<div class="mini"><b>' + locsFechadasTransp.length + '</b>Locações fechadas</div>' +
      '<div class="mini"><b>' + locsFechadasTransp.filter(function(l){ return l.atraso; }).length + '</b>Com atraso</div>' +
      '<div class="mini"><b>' + selfiesValidasCount + '</b>Selfies validadas</div>' +
      '</div>';
  const locIdsTransp = locsFechadasTransp.map(function(l){ return l.id; });
  const rEtapasTransp = locIdsTransp.length ? await sb.from("premiacao_etapas").select("locacao_id,concluida").in("locacao_id", locIdsTransp) : { data: [] };
  const etapasTransp = rEtapasTransp.data || [];
  const possiveisTransp = locsFechadasTransp.reduce(function(a,l){ return a + etapasTransp.filter(function(e){ return e.locacao_id===l.id; }).length; }, 0);
  const ganhosTransp = locsFechadasTransp.reduce(function(a,l){ return a + (l.atraso ? 0 : etapasTransp.filter(function(e){ return e.locacao_id===l.id && e.concluida; }).length); }, 0);
  const pctTransp = possiveisTransp ? Math.round((ganhosTransp/possiveisTransp)*100) : 0;
  const ganhandoTransp = pctTransp >= 80;
  const premioCardHtml = '<div class="card premio-card"><div class="premio-head"><h3>🏆 Prêmio Logística</h3><span class="premio-valor">R$ 500,00</span></div>' +
    '<p class="cardsub" style="margin-bottom:2px;">Bate 80% das metas do mês pra ganhar.</p>' +
    '<div class="premio-barra"><div class="premio-fill ' + (ganhandoTransp?"":"abaixo") + '" style="width:' + Math.min(pctTransp,100) + '%;"></div><div class="premio-meta-marca" style="left:80%;"></div></div>' +
    '<div class="premio-rodape"><span>' + ganhosTransp + " / " + possiveisTransp + " pontos (" + pctTransp + '%)</span><span class="premio-status ' + (ganhandoTransp?"status-ok":"status-wait") + '">' + (ganhandoTransp ? "🏆 Ganhando o prêmio" : ("Faltam " + (80-pctTransp) + " pontos percentuais")) + "</span></div></div>";
  content.insertAdjacentHTML("afterbegin", premioCardHtml);
  content.insertAdjacentHTML("afterbegin", resumoCardHtml);
}

let premiacaoSelfieAlvo = null;
function iniciarSelfiePremiacao(dataRef){
  premiacaoSelfieAlvo = dataRef;
  let input = document.getElementById('premiacao-input-camera');
  if(!input){
    input = document.createElement('input');
    input.type = 'file'; input.accept = 'image/*'; input.capture = 'user';
    input.id = 'premiacao-input-camera'; input.style.display = 'none';
    document.body.appendChild(input);
    input.addEventListener('change', onPremiacaoSelfieFile);
  }
  input.click();
}
function premiacaoFileToDataURL(file){
  return new Promise(function(resolve, reject){
    const reader = new FileReader();
    reader.onload = function(){ resolve(reader.result); };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
const PRAZO_RETRY_SELFIE_MIN = 5;
async function premiacaoUploadSelfiePendente(file, motoristaId, dataRef){
  if(!file) return null;
  const path = dataRef + '_' + motoristaId + '_' + Date.now() + '.jpg';
  const up = await sb.storage.from('selfies-pendentes').upload(path, file, { upsert: true });
  if(up.error) return null;
  const pub = sb.storage.from('selfies-pendentes').getPublicUrl(path);
  return pub.data.publicUrl;
}
async function onPremiacaoSelfieFile(e){
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if(!file || !premiacaoSelfieAlvo) return;
  const dataRef = premiacaoSelfieAlvo;
  const getGeo = function(){
    return new Promise(function(resolve){
      if(!navigator.geolocation){ resolve(null); return; }
      navigator.geolocation.getCurrentPosition(
        function(pos){ resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude }); },
        function(){ resolve(null); },
        { timeout: 4000 }
      );
    });
  };
  const dataUrl = await premiacaoFileToDataURL(file);
  const geo = await getGeo();
  const rAnterior = await sb.from('premiacao_selfies_dia').select('motivo,retry_ate').eq('motorista_id', currentUsuario.id).eq('data_ref', dataRef).maybeSingle();
  const eraRetryPendente = !!(rAnterior.data && rAnterior.data.motivo === 'reprovada' && rAnterior.data.retry_ate);
  await sb.from('premiacao_selfies_dia').upsert({
    motorista_id: currentUsuario.id, data_ref: dataRef,
    enviada: true, validada: null, motivo: null, retry_ate: null, foto_url: null,
    geo_lat: geo ? geo.lat : null, geo_lng: geo ? geo.lng : null,
    enviada_em: new Date().toISOString()
  }, { onConflict: 'motorista_id,data_ref' });
  await tsCarregarLocacoesInner();
  let iaRespondeu = false, aprovado = null;
  try {
    const resp = await fetch('/api/validar-selfie', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ image: dataUrl })
    });
    const json = await resp.json();
    if(json && typeof json.aprovado === 'boolean'){ iaRespondeu = true; aprovado = json.aprovado; }
  } catch(err){}
  if(iaRespondeu && aprovado === true){
    await sb.from('premiacao_selfies_dia').update({ validada: true, motivo: null, retry_ate: null, foto_url: null, validada_em: new Date().toISOString() }).eq('motorista_id', currentUsuario.id).eq('data_ref', dataRef);
  } else if(iaRespondeu && aprovado === false){
    if(eraRetryPendente){
      await sb.from('premiacao_selfies_dia').update({ validada: false, motivo: 'reprovada', retry_ate: null, foto_url: null, validada_em: new Date().toISOString() }).eq('motorista_id', currentUsuario.id).eq('data_ref', dataRef);
    } else {
      const prazo = new Date(Date.now() + PRAZO_RETRY_SELFIE_MIN*60000).toISOString();
      await sb.from('premiacao_selfies_dia').update({ validada: false, motivo: 'reprovada', retry_ate: prazo, foto_url: null }).eq('motorista_id', currentUsuario.id).eq('data_ref', dataRef);
    }
  } else {
    const fotoUrl = await premiacaoUploadSelfiePendente(file, currentUsuario.id, dataRef);
    await sb.from('premiacao_selfies_dia').update({ validada: null, motivo: null, retry_ate: null, foto_url: fotoUrl }).eq('motorista_id', currentUsuario.id).eq('data_ref', dataRef);
  }
  await tsCarregarLocacoesInner();
}


function expandCartuchos(list, duplicados){
  const dup = duplicados || [];
  const out = [];
  list.forEach(function(item){
    if(dup.indexOf(item.key) !== -1){
      out.push({ key: item.key + '__1', label: item.label + ' (1)' });
      out.push({ key: item.key + '__2', label: item.label + ' (2)' });
    } else {
      out.push(item);
    }
  });
  return out;
}

function baseCartKey(key){ return key.split('__')[0]; }

function cartuchoFieldsHtml(rId, prefix, listaLinear, listaBooster, valoresBase, duplicados){
  const expLinear = expandCartuchos(listaLinear, duplicados);
  const expBooster = expandCartuchos(listaBooster, duplicados);
  function linha(item){
    const base = (valoresBase && valoresBase[item.key] != null) ? valoresBase[item.key] : '';
    const hint = base !== '' ? ' <span class="field-hint" style="color:var(--gray-soft);">(entrega: ' + base + ')</span>' : '';
    const inputId = 'cart-' + prefix + '-' + rId + '-' + item.key;
    return '<div class="insumo-row"><span style="flex:1;font-size:13.5px;">' + item.label + hint + '</span>' +      '<input type="number" min="0" class="cart-input" id="' + inputId + '" data-key="' + item.key + '" data-label="' + item.label + '" style="width:90px;" placeholder="0">' +
      '<label class="btn btn-ghost btn-sm cart-photo-btn" style="cursor:pointer;padding:8px 10px;">📷' +
        '<input type="file" accept="image/*" capture="environment" class="cart-photo-input" data-target="' + inputId + '" style="display:none;">' +
      '</label>' +
      '</div>';
  }
  let html = '<div class="field"><label>Cartuchos Linear <span style="font-weight:400;color:var(--gray-soft);">(tire foto da tela pra ler automaticamente)</span></label>' + expLinear.map(linha).join('') + '</div>';
  html += '<div class="field"><label>Cartuchos Booster</label>' + expBooster.map(linha).join('') + '</div>';
  return html;
}

function fileToDataURL(file){
  return new Promise(function(resolve, reject){
    const reader = new FileReader();
    reader.onload = function(){ resolve(reader.result); };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function wireCartPhotoInputs(container){
  container.querySelectorAll('.cart-photo-input').forEach(function(inp){
    inp.addEventListener('change', async function(){
      const file = inp.files[0];
      if(!file) return;
      const targetInput = document.getElementById(inp.dataset.target);
      const label = inp.closest('.cart-photo-btn');
      const original = label.firstChild.textContent;
      label.firstChild.textContent = '...';
      try{
        const dataUrl = await fileToDataURL(file);
        const resp = await fetch('/api/ler-disparo', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ image: dataUrl }) });
        const data = await resp.json();
        if(data && data.valor != null){ targetInput.value = data.valor; }
        else{ alert('Não consegui ler o número na foto. Preencha manualmente.'); }
      }catch(e){
        alert('Erro ao ler foto: ' + e.message);
      }finally{
        label.firstChild.textContent = original;
      }
    });
  });
}

function gerarPDFControle(r, etapa, assinaturaDataUrl, leituras){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.setFontSize(16);
  doc.text('RJX Baiense Locações - Controle de Insumos', 14, 18);
  doc.setFontSize(11);
  let y = 30;
  doc.text('Locação: #' + (r.numero_locacao || r.locacao_ref), 14, y); y += 7;
  doc.text('Cliente/Doutora: ' + (r.cliente_nome || ''), 14, y); y += 7;
  doc.text('Equipamento: ' + (EQUIP_LABEL[r.equipamento] || r.equipamento), 14, y); y += 7;
  doc.text('Etapa: ' + (etapa === 'entrega' ? 'Entrega' : 'Fechamento (retirada)'), 14, y); y += 7;
  doc.text('Data/hora: ' + new Date().toLocaleString('pt-BR'), 14, y); y += 10;
  if(leituras && leituras.length){
    doc.setFontSize(12); doc.text('Leituras:', 14, y); y += 7;
    doc.setFontSize(10);
    leituras.forEach(function(l){ doc.text(l, 16, y); y += 6; });
    y += 4;
  }
  if(assinaturaDataUrl){
    doc.setFontSize(11); doc.text('Assinatura:', 14, y); y += 4;
    try{ doc.addImage(assinaturaDataUrl, 'PNG', 14, y, 80, 35); }catch(e){}
  }
  return doc.output('datauristring');
}

async function carregarControlesTransportes(){
  const content = document.getElementById('transportes-content');
  const result = await sb.from('controles_insumos')
    .select('*')
    .neq('status','fechado')
    .or('motorista_entrega_id.eq.' + currentUsuario.id + ',motorista_retirada_id.eq.' + currentUsuario.id)
    .order('criado_em', { ascending: true });

  if(result.error){
    content.innerHTML = '<p class="empty-hint">Erro ao carregar: ' + escapeHtml(result.error.message) + '</p>';
    return;
  }
  const rows = result.data || [];
  if(!rows.length){
    content.innerHTML = '<p class="empty-hint">Nenhum controle atribuído a você no momento.</p>';
    return;
  }

  let html = '';
  rows.forEach(function(r){    const st = STATUS_LABEL[r.status] || { text: r.status, cls: 'status-wait' };
    const souEntrega = r.motorista_entrega_id === currentUsuario.id;
    const souRetirada = r.motorista_retirada_id === currentUsuario.id;
    const isCrio = r.equipamento === 'crio';

    html +=
      '<div class="card loc-card" id="job-' + r.id + '">' +
        '<div class="loc-top">' +
          '<div>' +
            '<div class="loc-eq">' + (EQUIP_LABEL[r.equipamento] || r.equipamento) + '</div>' +
            '<div class="loc-name">' + escapeHtml(r.cliente_nome) + ' — #' + escapeHtml(r.numero_locacao || r.locacao_ref) + '</div>' +
            (r.data_locacao ? '<div class="loc-meta">Data: ' + r.data_locacao.split('-').reverse().join('/') + '</div>' : '') +
          '</div>' +
          '<span class="status-pill ' + st.cls + '"><span class="dot"></span>' + st.text + '</span>' +
        '</div>' +
        (!r.contrato_assinado_online ? '<div class="notice-box" style="margin-top:12px;margin-bottom:0;">Contrato não confirmado como assinado online — buscar assinatura presencial na entrega.</div>' : '') +
        (r.observacao ? '<div class="loc-meta" style="margin-top:10px;">Obs: ' + escapeHtml(r.observacao) + '</div>' : '') +
        '<div class="loc-actions" id="actions-' + r.id + '"></div>' +
        '<div id="panel-' + r.id + '"></div>' +
      '</div>';
  });
  content.innerHTML = html;

  rows.forEach(function(r){
    const souEntrega = r.motorista_entrega_id === currentUsuario.id;
    const souRetirada = r.motorista_retirada_id === currentUsuario.id;
    const actionsEl = document.getElementById('actions-' + r.id);

    if(r.status === 'aguardando_entrega' && souEntrega){
      const btn = document.createElement('button');
      btn.className = 'btn btn-primary btn-sm';
      btn.textContent = 'Iniciar entrega';
      btn.addEventListener('click', function(){ abrirPainelEntrega(r); });
      actionsEl.appendChild(btn);
    } else if(r.status === 'entregue' && souRetirada){
      const btn = document.createElement('button');
      btn.className = 'btn btn-primary btn-sm';
      btn.textContent = 'Iniciar retirada';
      btn.addEventListener('click', function(){ abrirPainelRetirada(r); });
      actionsEl.appendChild(btn);
    }
  });
}

function abrirPainelEntrega(r){
  const isCrio = r.equipamento === 'crio';
  const panel = document.getElementById('panel-' + r.id);
  panel.innerHTML =
    '<div class="card" style="margin-top:14px;background:var(--paper-soft);">' +
      '<h3 style="font-size:14px;margin-bottom:12px;">Registro de entrega</h3>' +
      (isCrio
        ? '<div class="field"><label>Quantidade de manta entregue</label><input type="number" min="0" id="manta-entrega-' + r.id + '" placeholder="0"></div>'
        : cartuchoFieldsHtml(r.id, 'ent', LINEAR, BOOSTER, null, r.cartuchos_duplicados)
      ) +
      '<div class="field"><label>Assinatura da doutora</label><canvas class="sig-canvas" id="sig-entrega-' + r.id + '" style="width:100%;height:140px;background:#fff;border:1.5px dashed var(--line);border-radius:4px;"></canvas>' +
        '<button type="button" class="btn btn-ghost btn-sm" style="margin-top:6px;" id="btn-limpar-sig-' + r.id + '">Limpar assinatura</button>' +
      '</div>' +
      '<div id="err-entrega-' + r.id + '" class="login-error" style="display:none;"></div>' +
      '<button class="btn btn-primary btn-block" id="btn-confirmar-entrega-' + r.id + '">Confirmar entrega</button>' +
    '</div>';

  wireCartPhotoInputs(panel);
  const pad = initSignaturePad('sig-entrega-' + r.id);
  document.getElementById('btn-limpar-sig-' + r.id).addEventListener('click', function(){ pad.clear(); });

  document.getElementById('btn-confirmar-entrega-' + r.id).addEventListener('click', async function(){
    const errEl = document.getElementById('err-entrega-' + r.id);
    errEl.style.display = 'none';    if(pad.isEmpty()){ errEl.textContent = 'Colete a assinatura antes de confirmar.'; errEl.style.display='block'; return; }

    let cartuchos = r.cartuchos || {linear:[], booster:[]};
    let manta = r.manta || {entrega:{}, retorno:{}};
    const leituras = [];

    if(isCrio){
      const qtd = parseInt(document.getElementById('manta-entrega-' + r.id).value, 10) || 0;
      manta = { entrega: { quantidade: qtd, ts: new Date().toISOString() }, retorno: manta.retorno || {} };
      leituras.push('Manta entregue: ' + qtd);
    } else {
      const entregaLinear = {};
      const entregaBooster = {};
      panel.querySelectorAll('.cart-input').forEach(function(inp){
        const key = inp.dataset.key;
        const val = parseInt(inp.value, 10) || 0;
        const isBooster = BOOSTER.some(function(b){ return b.key === baseCartKey(key); });
        if(isBooster) entregaBooster[key] = val; else entregaLinear[key] = val;
        leituras.push(inp.dataset.label + ': ' + val);
      });
      cartuchos = { linear: [{ etapa: 'entrega', valores: entregaLinear, ts: new Date().toISOString() }], booster: [{ etapa: 'entrega', valores: entregaBooster, ts: new Date().toISOString() }] };
    }

    const btn = document.getElementById('btn-confirmar-entrega-' + r.id);
    btn.disabled = true; btn.textContent = 'Salvando...';

    const assinaturaUrl = pad.toDataURL();
    let pdfUrl = null;
    try{ pdfUrl = gerarPDFControle(r, 'entrega', assinaturaUrl, leituras); }catch(e){}

    const result = await sb.from('controles_insumos').update({
      cartuchos: cartuchos,
      manta: manta,
      assinatura_entrega_url: assinaturaUrl,
      pdf_entrega_url: pdfUrl,
      status: 'entregue',
      entregue_em: new Date().toISOString()
    }).eq('id', r.id);

    if(result.error){ errEl.textContent = 'Erro: ' + result.error.message; errEl.style.display='block'; btn.disabled=false; btn.textContent='Confirmar entrega'; return; }
    await carregarControlesTransportes();
  });
}

function abrirPainelRetirada(r){
  const isCrio = r.equipamento === 'crio';
  const panel = document.getElementById('panel-' + r.id);
  const valoresEntregaLinear = (!isCrio && r.cartuchos && r.cartuchos.linear && r.cartuchos.linear[0]) ? r.cartuchos.linear[0].valores : {};
  const valoresEntregaBooster = (!isCrio && r.cartuchos && r.cartuchos.booster && r.cartuchos.booster[0]) ? r.cartuchos.booster[0].valores : {};
  const valoresEntregaTudo = Object.assign({}, valoresEntregaLinear, valoresEntregaBooster);
  const mantaEntregaQtd = (isCrio && r.manta && r.manta.entrega) ? (r.manta.entrega.quantidade || 0) : 0;

  panel.innerHTML =
    '<div class="card" style="margin-top:14px;background:var(--paper-soft);">' +
      '<h3 style="font-size:14px;margin-bottom:12px;">Registro de retirada</h3>' +
      (isCrio
        ? '<div class="field"><label>Quantidade de manta retirada <span style="color:var(--gray-soft);font-weight:400;">(entregue: ' + mantaEntregaQtd + ')</span></label><input type="number" min="0" id="manta-retirada-' + r.id + '" placeholder="0"></div>'
        : cartuchoFieldsHtml(r.id, 'ret', LINEAR, BOOSTER, valoresEntregaTudo, r.cartuchos_duplicados)
      ) +
      '<div class="field"><label>Assinatura da doutora (fechamento)</label><canvas class="sig-canvas" id="sig-fechamento-' + r.id + '" style="width:100%;height:140px;background:#fff;border:1.5px dashed var(--line);border-radius:4px;"></canvas>' +
        '<button type="button" class="btn btn-ghost btn-sm" style="margin-top:6px;" id="btn-limpar-sig2-' + r.id + '">Limpar assinatura</button>' +
      '</div>' +
      '<div id="err-retirada-' + r.id + '" class="login-error" style="display:none;"></div>' +
      '<button class="btn btn-primary btn-block" id="btn-confirmar-retirada-' + r.id + '">Confirmar retirada</button>' +
    '</div>';

  wireCartPhotoInputs(panel);
  const pad = initSignaturePad('sig-fechamento-' + r.id);  document.getElementById('btn-limpar-sig2-' + r.id).addEventListener('click', function(){ pad.clear(); });

  document.getElementById('btn-confirmar-retirada-' + r.id).addEventListener('click', async function(){
    const errEl = document.getElementById('err-retirada-' + r.id);
    errEl.style.display = 'none';
    if(pad.isEmpty()){ errEl.textContent = 'Colete a assinatura antes de confirmar.'; errEl.style.display='block'; return; }

    let cartuchos = r.cartuchos || {linear:[], booster:[]};
    let manta = r.manta || {entrega:{}, retorno:{}};
    const leituras = [];

    if(isCrio){
      const qtd = parseInt(document.getElementById('manta-retirada-' + r.id).value, 10) || 0;
      manta = { entrega: manta.entrega || {}, retorno: { quantidade: qtd, ts: new Date().toISOString() } };
      leituras.push('Manta retirada: ' + qtd + ' (entregue: ' + mantaEntregaQtd + ')');
    } else {
      const retiradaLinear = {};
      const retiradaBooster = {};
      panel.querySelectorAll('.cart-input').forEach(function(inp){
        const key = inp.dataset.key;
        const val = parseInt(inp.value, 10) || 0;
        const isBooster = BOOSTER.some(function(b){ return b.key === baseCartKey(key); });
        if(isBooster) retiradaBooster[key] = val; else retiradaLinear[key] = val;
        const base = valoresEntregaTudo[key];
        const diff = (base != null) ? (base - val) : null;
        leituras.push(inp.dataset.label + ': ' + val + (diff != null ? ' (usados: ' + diff + ')' : ''));
      });
      const entregaEntry = cartuchos.linear && cartuchos.linear[0] ? cartuchos.linear[0] : { valores: {} };
      const entregaEntryB = cartuchos.booster && cartuchos.booster[0] ? cartuchos.booster[0] : { valores: {} };
      cartuchos = {
        linear: [entregaEntry, { etapa: 'retirada', valores: retiradaLinear, ts: new Date().toISOString() }],
        booster: [entregaEntryB, { etapa: 'retirada', valores: retiradaBooster, ts: new Date().toISOString() }]
      };
    }

    const btn = document.getElementById('btn-confirmar-retirada-' + r.id);
    btn.disabled = true; btn.textContent = 'Salvando...';

    const assinaturaUrl = pad.toDataURL();
    let pdfUrl = null;
    try{ pdfUrl = gerarPDFControle(r, 'fechamento', assinaturaUrl, leituras); }catch(e){}

    const result = await sb.from('controles_insumos').update({
      cartuchos: cartuchos,
      manta: manta,
      assinatura_fechamento_url: assinaturaUrl,
      pdf_fechamento_url: pdfUrl,
      status: 'retirado',
      retirado_em: new Date().toISOString()
    }).eq('id', r.id);

    if(result.error){ errEl.textContent = 'Erro: ' + result.error.message; errEl.style.display='block'; btn.disabled=false; btn.textContent='Confirmar retirada'; return; }
    await carregarControlesTransportes();
  });
}

function equipCalcIdade(dataCompra){
  if(!dataCompra) return '';
  const d = new Date(dataCompra + 'T00:00:00');
  if(isNaN(d.getTime())) return '';
  const hoje = new Date();
  let meses = (hoje.getFullYear() - d.getFullYear()) * 12 + (hoje.getMonth() - d.getMonth());
  if(hoje.getDate() < d.getDate()) meses--;
  if(meses < 0) return '';
  if(meses < 1) return 'menos de 1 mês';
  if(meses < 12) return meses + (meses===1?' mês':' meses') + ' de uso';
  const anos = Math.floor(meses/12);
  const restM = meses % 12;
  let txt = anos + (anos===1?' ano':' anos');
  if(restM > 0) txt += ' e ' + restM + (restM===1?' mês':' meses');
  return txt;
}

function equipFormatDataBr(iso){
  if(!iso) return '';
  const p = String(iso).slice(0,10).split('-');
  if(p.length !== 3) return iso;
  return p[2] + '/' + p[1] + '/' + p[0];
}

async function equipRenderCartuchosHtml(){
  const r = await sb.from('cartuchos').select('*').order('created_at', { ascending:false });

  return equipCartuchosMontarHtml();
}

function equipCartuchosMontarHtml(){
  const todos = window.__equipCartuchosTodos || [];
  const ativos = todos.filter(function(c){ return !c.descartado; });
  let filtrados;
  if(equipCartFiltro === 'descartados') filtrados = todos.filter(function(c){ return c.descartado; });
  else if(equipCartFiltro === 'em_uso') filtrados = ativos.filter(function(c){ return c.em_uso; });
  else if(equipCartFiltro === 'mpt1') filtrados = ativos.filter(function(c){ return c.vinculo === 'mpt1'; });
  else if(equipCartFiltro === 'mpt2') filtrados = ativos.filter(function(c){ return c.vinculo === 'mpt2'; });
  else if(equipCartFiltro === 'estoque') filtrados = ativos.filter(function(c){ return c.vinculo === 'none'; });
  else filtrados = ativos;

  filtrados = filtrados.slice().sort(function(a,b){
    return (a.tipo||'').localeCompare((b.tipo||''), 'pt-BR', { numeric:true, sensitivity:'base' });
  });

  const termoBusca = (equipCartBusca||'').trim();
  if(termoBusca){
    const norm = function(s){ return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); };
    const alvo = norm(termoBusca);
    filtrados = filtrados.filter(function(c){
      return norm(c.tipo).indexOf(alvo) !== -1 || norm(c.numero_serie).indexOf(alvo) !== -1;
    });
  }

  function filtroBtn(id, label, discard){
    return '<button class="subtab ' + (equipCartFiltro===id?'active':'') + (discard?' subtab-discard':'') + '" onclick="equipCartMudarFiltro(&quot;' + id + '&quot;)">' + label + '</button>';
  }

  let cardsHtml = filtrados.map(function(c){ return equipCartuchoCardHtml(c); }).join('');
  if(!filtrados.length) cardsHtml = '<p class="cardsub">Nenhum cartucho ' + (termoBusca?'encontrado para essa busca.':'nessa categoria.') + '</p>';

  return '' +
  '<div class="cart-filterbar">' +
    filtroBtn('todos','Todos') +
    filtroBtn('em_uso','Em uso ★') +
    filtroBtn('mpt1','MPT 1') +
    filtroBtn('mpt2','MPT 2') +
    filtroBtn('estoque','Em estoque') +
    filtroBtn('descartados','Descartados', true) +
  '</div>' +
  '<div class="card">' +
    '<div class="section-head"><h3>Cartuchos Ultraformer</h3><div style="display:flex;gap:8px;"><button class="btn btn-ghost btn-sm" id="cart-sync-btn" onclick="equipAtualizarDisparosEstoqueNow()">🔄 Atualizar disparos</button><button class="btn btn-primary btn-sm" onclick="equipCartuchoAbrirModal(null)">+ Adicionar cartucho</button></div></div>' +
    '<input class="cart-busca" id="cart-busca-input" placeholder="Buscar cartucho por nome ou nº de série..." value="' + escapeHtml(equipCartBusca||'') + '" oninput="equipCartMudarBusca(this.value)" style="width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:6px;font-size:13.5px;font-family:inherit;margin-bottom:14px;">' +
    '<div class="cart-grid">' + cardsHtml + '</div>' +
  '</div>';
}

async function equipAtualizarDisparosEstoqueNow(){
  const btn = document.getElementById('cart-sync-btn');
  if(btn){ btn.disabled = true; btn.textContent = 'Atualizando...'; }
  try{
    const { data: sessionData } = await sb.auth.getSession();
    const token = sessionData && sessionData.session ? sessionData.session.access_token : '';
    const resp = await fetch('/api/sync-disparos-estoquenow', { method:'POST', headers:{ 'Authorization': 'Bearer ' + token } });
    const data = await resp.json();
    if(!resp.ok){ toast('Erro: ' + (data.error||'não foi possível atualizar.')); return; }
    toast(data.atualizados + ' cartucho(s) atualizado(s) a partir do Estoque Now.');
    await equipRenderConteudo();
  }catch(e){
    toast('Erro ao atualizar: ' + e.message);
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = '🔄 Atualizar disparos'; }
  }
}

// ================== MANUTENCOES ==================

function opDataBR(iso){ if(!iso) return "-"; const p = iso.split("-"); return p[2] + "/" + p[1] + "/" + p[0]; }
function opMesAnoLabel(iso){
  const nomes = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
  const p = iso.split("-");
  return nomes[parseInt(p[1],10)-1] + "/" + p[0];
}
function opSomaMeses(iso, n){
  const p = iso.split("-").map(Number);
  const dt = new Date(p[0], p[1]-1+n, p[2]);
  return dt.getFullYear() + "-" + String(dt.getMonth()+1).padStart(2,"0") + "-" + String(dt.getDate()).padStart(2,"0");
}
function opMesesEntre(hoje, alvo){
  const a = hoje.split("-").map(Number), b = alvo.split("-").map(Number);
  return (b[0]-a[0])*12 + (b[1]-a[1]);
}
function opStatusDe(renovacao){
  const hoje = premiacaoIsoHoje(0);
  const meses = opMesesEntre(hoje, renovacao);
  if(meses <= 0) return { cls:"vermelho", label:"No mês da renovação" };
  if(meses <= 2) return { cls:"amarelo", label: meses + " mes(es) pra renovar" };
  return { cls:"verde", label: meses + " mes(es) pra renovar" };
}

function opManutRenderAlerta(){
  const wrap = document.getElementById("op-manut-alerta");
  const equip = window.__opManutEquip || [];
  const emCotacao = equip.filter(function(e){ return e.status === "em_cotacao"; });
  const proximos = equip.filter(function(e){ return e.status !== "em_cotacao"; })
    .map(function(e){ return { e:e, meses: opMesesEntre(premiacaoIsoHoje(0), e.renovacao) }; })
    .filter(function(x){ return x.meses <= 1; })
    .sort(function(a,b){ return a.meses - b.meses; });
  if(!emCotacao.length && !proximos.length){
    wrap.innerHTML = '<div class="card" style="padding:14px 18px;margin-bottom:20px;color:var(--gray);font-size:13px;">✅ Nenhuma manutenção precisando de atenção agora.</div>';
    return;
  }
  wrap.innerHTML = '<div class="card" style="padding:16px 18px;margin-bottom:20px;background:var(--alert-bg);border-color:#e8cabd;"><h3 style="color:var(--alert);font-size:16px;">🔔 ' + (emCotacao.length+proximos.length) + ' equipamento(s) pra realizar</h3>' +
    '<p class="cardsub" style="color:#7a5c14;">Faltando 1 mês ou menos, ou já em cotação.</p>' +
    emCotacao.map(function(e){ return '<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #ecd3c8;"><b>' + escapeHtml(e.nome) + '</b><span class="status-pill status-info"><span class="dot"></span>Em cotação</span></div>'; }).join("") +
    proximos.map(function(x){ const st = opStatusDe(x.e.renovacao); return '<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #ecd3c8;"><div><b>' + escapeHtml(x.e.nome) + '</b> — renovação em ' + opDataBR(x.e.renovacao) + '</div><span class="status-pill ' + OP_STATUS_CLASS[st.cls] + '"><span class="dot"></span>' + st.label + '</span></div>'; }).join("") +
    '</div>';
}

function opManutRenderTabela(){
  const tbody = document.getElementById("op-manut-tbody");
  const equip = window.__opManutEquip || [];
  if(!equip.length){ tbody.innerHTML = '<tr><td colspan="7" class="empty-hint">Nenhum equipamento cadastrado ainda.</td></tr>'; return; }
  tbody.innerHTML = equip.map(function(e){
    const cotar = opMesAnoLabel(opSomaMeses(e.renovacao, -1));
    let statusHtml, acaoHtml;
    if(e.status === "em_cotacao"){
      statusHtml = '<span class="status-pill status-info"><span class="dot"></span>Em cotação</span>';
      acaoHtml = '<button class="btn btn-primary btn-sm" onclick="opManutAbrirModal(&quot;' + e.id + '&quot;)">Finalizar</button>';
    } else {
      const st = opStatusDe(e.renovacao);
      statusHtml = '<span class="status-pill ' + OP_STATUS_CLASS[st.cls] + '"><span class="dot"></span>' + st.label + '</span>';
      const meses = opMesesEntre(premiacaoIsoHoje(0), e.renovacao);
      acaoHtml = meses <= 1 ? '<button class="btn btn-primary btn-sm" onclick="opManutIniciarCotacao(&quot;' + e.id + '&quot;)">Realizar manutenção</button>' : "-";
    }
    return '<tr><td style="padding:10px 12px;border-bottom:1px solid var(--line);"><b>' + escapeHtml(e.nome) + '</b></td>' +
      '<td style="padding:10px 12px;border-bottom:1px solid var(--line);">' + escapeHtml(e.serie||"—") + '</td>' +
      '<td style="padding:10px 12px;border-bottom:1px solid var(--line);">' + opDataBR(e.ultima_manutencao) + '</td>' +
      '<td style="padding:10px 12px;border-bottom:1px solid var(--line);">' + opDataBR(e.renovacao) + '</td>' +

function opManutCorrSelecionaEquip(id){
  const nomeInput = document.getElementById("omc-nome");

  if(id === "__outro__"){
    nomeInput.type = "text";
    nomeInput.placeholder = "Nome do equipamento";
    nomeInput.style.cssText = "width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;font-size:13.5px;font-family:inherit;margin-top:8px;";
    nomeInput.value = "";
    serieInput.readOnly = false;
    serieInput.style.background = "";
    serieInput.value = "";
  } else {
    const eq = (window.__opManutEquip||[]).find(function(e){ return e.id === id; });
    nomeInput.type = "hidden";
    nomeInput.value = eq ? eq.nome : "";

async function opUploadArquivo(file){
  if(!file) return null;
  const nomeSeguro = file.name
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-zA-Z0-9._-]/g, "_")
    .replace(/_+/g, "_");
  const path = Date.now() + "_" + Math.random().toString(36).slice(2) + "_" + nomeSeguro;
  const up = await sb.storage.from("manutencoes").upload(path, file);
  if(up.error){ toast("Erro ao enviar arquivo: " + up.error.message); return null; }
  const pub = sb.storage.from("manutencoes").getPublicUrl(path);
  return pub.data.publicUrl;
}

function opSegRenderAlerta(){
  const wrap = document.getElementById("op-seg-alerta");
  const seguros = window.__opSeguros || [];
  const emCotacao = seguros.filter(function(s){ return s.status === "em_cotacao"; });
  const proximos = seguros.filter(function(s){ return s.status !== "em_cotacao"; })
    .map(function(s){ return { s:s, meses: opMesesEntre(premiacaoIsoHoje(0), s.renovacao) }; })
    .filter(function(x){ return x.meses <= 1; })
    .sort(function(a,b){ return a.meses - b.meses; });
  if(!emCotacao.length && !proximos.length){
    wrap.innerHTML = '<div class="card" style="padding:14px 18px;margin-bottom:20px;color:var(--gray);font-size:13px;">✅ Nenhum seguro precisando de atenção agora.</div>';
    return;
  }
  wrap.innerHTML = '<div class="card" style="padding:16px 18px;margin-bottom:20px;background:var(--alert-bg);border-color:#e8cabd;"><h3 style="color:var(--alert);font-size:16px;">🔔 ' + (emCotacao.length+proximos.length) + ' seguro(s) pra renovar</h3>' +
    '<p class="cardsub" style="color:#7a5c14;">Faltando 1 mês ou menos, ou já em cotação.</p>' +
    emCotacao.map(function(s){ return '<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #ecd3c8;"><b>' + escapeHtml(s.nome) + '</b><span class="status-pill status-info"><span class="dot"></span>Em cotação</span></div>'; }).join("") +
    proximos.map(function(x){ const st = opStatusDe(x.s.renovacao); return '<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #ecd3c8;"><div><b>' + escapeHtml(x.s.nome) + '</b> — renovação em ' + opDataBR(x.s.renovacao) + '</div><span class="status-pill ' + OP_STATUS_CLASS[st.cls] + '"><span class="dot"></span>' + st.label + '</span></div>'; }).join("") +
    '</div>';
}

function opSegRenderTabela(){
  const tbody = document.getElementById("op-seg-tbody");
  const seguros = window.__opSeguros || [];

async function opValidarSelfieManual(motoristaId, dataRef, validada){
  const rAtual = await sb.from("premiacao_selfies_dia").select("foto_url").eq("motorista_id", motoristaId).eq("data_ref", dataRef).maybeSingle();
  const fotoUrl = rAtual.data ? rAtual.data.foto_url : null;
  await sb.from("premiacao_selfies_dia").update({ validada: validada, motivo: validada ? null : "reprovada", foto_url: null, validada_em: new Date().toISOString() }).eq("motorista_id", motoristaId).eq("data_ref", dataRef);
  if(fotoUrl){
    try {
      const path = fotoUrl.split("/selfies-pendentes/")[1];
      if(path) await sb.storage.from("selfies-pendentes").remove([path]);
    } catch(err){}
  }
  toast(validada ? "Selfie validada." : "Selfie reprovada.");
  await carregarPremiacaoOperacional(true);
}

async function carregarPremiacaoOperacional(isGestor){
  
  const content = document.getElementById('operacional-content');
  const motoristas = await getMotoristas();
  const motoristaNome = {};
  motoristas.forEach(function(m){ motoristaNome[m.id] = m.nome; });
  const result = await sb.from('premiacao_locacoes').select('id,numero,equipamento,motorista_id,data_locacao,status,atraso').order('data_locacao', { ascending: false });
  const rContest = await sb.from('premiacao_contestacoes').select('*').order('criado_em', { ascending:false });
  window.__opContestacoes = rContest.data || [];
  atualizarBadgeContestacoesSidebar();
  if(result.error){
    content.innerHTML = '<p class="empty-hint">Erro ao carregar: ' + escapeHtml(result.error.message) + '</p>';
    return;
  }
  const locs = result.data || [];
  let contestBannerHtml = "";
  const pendentes = (window.__opContestacoes||[]).filter(function(c){ return c.status === 'pendente'; });
      if(pendentes.length){
        contestBannerHtml += '<div class="card contest-alert"><h3>🔔 ' + pendentes.length + ' contestação(ões) pendente(s)</h3>';
        pendentes.forEach(function(c){
          const locC = locs.find(function(l){ return l.id === c.locacao_id; }) || {};
          contestBannerHtml += '<div class="contest-row"><div><b>' + escapeHtml(locC.equipamento||'') + '</b> — Locação #' + (locC.numero||'') + '</div><button class="btn btn-primary btn-sm" onclick="abrirModalContestacao(&quot;' + c.id + '&quot;)">Ver contestação</button></div>';
        });
        contestBannerHtml += '</div>';
      }
  const idsLocs = locs.map(function(l){ return l.id; });
  let etapasPorLoc = {};
  if(idsLocs.length){
    const rEtapas = await sb.from('premiacao_etapas').select('id,locacao_id,ordem,nome,concluida,motorista_id').in('locacao_id', idsLocs).order('ordem');
    (rEtapas.data || []).forEach(function(e){
      if(!etapasPorLoc[e.locacao_id]) etapasPorLoc[e.locacao_id] = [];
      etapasPorLoc[e.locacao_id].push(e);
    });
  }

  // pares distintos (motorista, dia) que precisam de selfie
  const paresSet = {};
  const paresList = [];
  locs.forEach(function(loc){
    const chave = loc.motorista_id + '|' + loc.data_locacao;
    if(!paresSet[chave]){ paresSet[chave] = true; paresList.push({ motorista_id: loc.motorista_id, data_ref: loc.data_locacao }); }
  });
  let selfiesPorPar = {};
  if(paresList.length){
    const motoristaIds = [...new Set(paresList.map(function(p){ return p.motorista_id; }))];
    const rSelfies = await sb.from('premiacao_selfies_dia').select('*').in('motorista_id', motoristaIds);
    (rSelfies.data || []).forEach(function(s){
      selfiesPorPar[s.motorista_id + '|' + s.data_ref] = s;
    });
  }

  let html = '';
  const hojeMet = premiacaoIsoHoje(0);
  const mesAtualMet = hojeMet.slice(0,7);
  const locsMesMet = (result.data||[]).filter(function(l){ return (l.data_locacao||"").slice(0,7) === mesAtualMet; });
  const locIdsMesMet = locsMesMet.map(function(l){ return l.id; });
  const rEtapasMet = locIdsMesMet.length ? await sb.from("premiacao_etapas").select("concluida").in("locacao_id", locIdsMesMet) : { data: [] };
  const pontosDistribuidosMet = (rEtapasMet.data||[]).filter(function(e){ return e.concluida; }).length;
  const inicioMesMet = mesAtualMet + "-01";

async function opFecharLocacao(locId){
  const ok = confirm("Tem certeza que deseja fechar essa loca\u00e7\u00e3o?\n\nIsso vai mov\u00ea-la para 'Loca\u00e7\u00f5es fechadas' e liberar o prazo para o motorista contestar caso discorde de algo.");

  await sb.from("premiacao_locacoes").update({ status: "fechada", atualizado_em: new Date().toISOString() }).eq("id", locId);
  toast("Loca\u00e7\u00e3o fechada.");
  await carregarPremiacaoOperacional(true);
}

async function togglePremiacaoAtraso(locId, checked){
  await sb.from("premiacao_locacoes").update({ atraso: checked, atualizado_em: new Date().toISOString() }).eq("id", locId);
  toast(checked ? "Atraso marcado — pontos da locação zerados." : "Atraso desmarcado.");
  await carregarPremiacaoOperacional(true);
}
const PRAZO_CONTESTACAO_DIAS = 3;
function tsDiasEntre(iso1, iso2){ const d1 = new Date(iso1); const d2 = new Date(iso2); return Math.round((d2-d1)/86400000); }

async function tsCarregarHistoricoInner(){
  const content = document.getElementById("ts-prem-content");
  content.innerHTML = '<p class="empty-hint">Carregando...</p>';
  const rLoc = await sb.from("premiacao_locacoes").select("id,numero,equipamento,data_locacao,status,atraso,atualizado_em").eq("motorista_id", currentUsuario.id).eq("status","fechada").order("atualizado_em", { ascending:false });
  if(rLoc.error){ content.innerHTML = '<p class="empty-hint">Erro: ' + escapeHtml(rLoc.error.message) + '</p>'; return; }
  const locs = rLoc.data || [];
  const ids = locs.map(function(l){ return l.id; });
  const rEtapas = ids.length ? await sb.from("premiacao_etapas").select("locacao_id,ordem,nome,concluida").in("locacao_id", ids).order("ordem") : { data: [] };
  const rContest = ids.length ? await sb.from("premiacao_contestacoes").select("*").in("locacao_id", ids) : { data: [] };
  window.__tsHistLocs = locs;
  window.__tsHistEtapas = rEtapas.data || [];
  window.__tsHistContest = rContest.data || [];
  window.__tsHistExpandido = window.__tsHistExpandido || {};
  tsRenderHistorico();
}

function tsRenderHistorico(){
  const content = document.getElementById("ts-prem-content");
  const locs = window.__tsHistLocs || [];
  let html = '<div class="card" style="padding:22px;">';
  if(!locs.length){ html += '<p class="empty-hint">Nenhuma locação fechada ainda.</p>'; }
  else {
    html += locs.map(function(l){
      const etapas = (window.__tsHistEtapas||[]).filter(function(e){ return e.locacao_id === l.id; });
      const nFeitas = etapas.filter(function(e){ return e.concluida; }).length;
      const pts = l.atraso ? 0 : nFeitas;
      const contest = (window.__tsHistContest||[]).find(function(c){ return c.locacao_id === l.id; });
      const aberto = !!window.__tsHistExpandido[l.id];
      let contestBadge = "";
      if(contest){
        const map = { pendente:["status-wait","Contestação enviada"], aceita:["status-ok","Contestação aceita"], rejeitada:["status-wait","Contestação rejeitada"], reaberta:["status-wait","Reaberta"] };
        const m = map[contest.status] || ["status-wait", contest.status];
        contestBadge = '<span class="status-pill ' + m[0] + '"><span class="dot"></span>' + m[1] + '</span>';
      }
      let corpo = '<div style="padding:14px 16px;cursor:pointer;display:flex;align-items:center;gap:10px;" onclick="tsToggleHistorico(&quot;' + l.id + '&quot;)">' +
        '<span style="width:14px;color:var(--gray-soft);">' + (aberto?"▾":"▸") + '</span>' +
        '<b style="flex:1;">#' + escapeHtml(String(l.numero||"")) + " " + escapeHtml(l.equipamento||"") + '</b>' +
        (l.atraso ? '<span class="status-pill status-wait"><span class="dot"></span>Atraso</span>' : "") +
        contestBadge +
        '<span style="font-weight:700;">' + pts + " / " + etapas.length + ' pts</span></div>';
      if(aberto){
        corpo += '<div style="padding:0 16px 16px;">';
        corpo += etapas.map(function(e){
          return '<div style="display:flex;gap:10px;padding:6px 0;font-size:13px;border-bottom:1px solid var(--paper-soft);"><span style="width:16px;color:' + (e.concluida?"var(--ok)":"var(--gray-soft)") + ';">' + (e.concluida?"✓":"○") + '</span><span>' + e.ordem + ". " + escapeHtml(e.nome) + '</span></div>';
        }).join("");
        if(contest){
          corpo += '<div style="margin-top:10px;padding:10px 12px;background:var(--paper-soft);border-radius:6px;font-size:12.5px;"><b>Sua contestação:</b> ' + escapeHtml(contest.texto) + '</div>';
        } else {
          const dias = tsDiasEntre(l.atualizado_em, new Date().toISOString());
          if(dias <= PRAZO_CONTESTACAO_DIAS){
            corpo += '<button class="btn btn-ghost" style="margin-top:12px;" onclick="tsAbrirContestacao(&quot;' + l.id + '&quot;)">Contestar esta locação</button>';
            corpo += '<div class="cardsub" style="margin-top:6px;">Prazo pra contestar: mais ' + (PRAZO_CONTESTACAO_DIAS - dias) + ' dia(s).</div>';
          } else {
            corpo += '<div class="cardsub">Prazo de ' + PRAZO_CONTESTACAO_DIAS + ' dias pra contestar já passou.</div>';
          }
        }
        corpo += "</div>";
      }
      return '<div style="border-bottom:1px solid var(--line);">' + corpo + "</div>";
    }).join("");
  }
  html += "</div>";
  content.innerHTML = html;
}

function tsToggleHistorico(id){
  window.__tsHistExpandido[id] = !window.__tsHistExpandido[id];
  tsRenderHistorico();
}

async function tsEnviarContestacao(locId){
  const texto = document.getElementById("ts-contest-texto").value.trim();

async function salvarAjusteContestacaoOp(contestId, locId){
  const atraso = document.getElementById("cxop-atraso").checked;
  const checks = Array.from(document.querySelectorAll('[id^="cxop-"]')).filter(function(el){ return el.id !== "cxop-atraso"; });
  for(const chk of checks){
    const etapaId = chk.id.replace("cxop-", "");
    await sb.from("premiacao_etapas").update({ concluida: chk.checked }).eq("id", etapaId);

  await sb.from("premiacao_locacoes").update({ atraso: atraso }).eq("id", locId);
  await sb.from("premiacao_contestacoes").update({ status:"aceita", resolvido_em: new Date().toISOString(), resolvido_por: currentUsuario.id }).eq("id", contestId);
  fecharModalContestacao();

  await carregarPremiacaoOperacional(true);
}

  if(checked){

    updates.motorista_id = locResult.data ? locResult.data.motorista_id : null;

async function finalizarLocacaoPremiacao(locId, feitas, total){

    const ok = confirm('Esta locação tem ' + (total-feitas) + ' etapa(s) não marcadas, que não vão pontuar. Finalizar mesmo assim?');
    if(!ok) return;
  }
  await sb.from('premiacao_locacoes').update({ status: 'fechada', atualizado_em: new Date().toISOString() }).eq('id', locId);
  await carregarPremiacaoOperacional(true);
}

async function virarDiaPremiacao(){
  const hoje = premiacaoIsoHoje(0);
  const result = await sb.from('premiacao_locacoes').select('motorista_id,data_locacao').lt('data_locacao', hoje);
  const locs = result.data || [];
  const paresSet = {};
  const pares = [];
  locs.forEach(function(loc){
    const chave = loc.motorista_id + '|' + loc.data_locacao;
    if(!paresSet[chave]){ paresSet[chave] = true; pares.push({ motorista_id: loc.motorista_id, data_ref: loc.data_locacao }); }
  });
  let n = 0;
  for(const par of pares){
    const sResult = await sb.from('premiacao_selfies_dia').select('validada,motivo').eq('motorista_id', par.motorista_id).eq('data_ref', par.data_ref).maybeSingle();
    const s = sResult.data;
    if(!s || (s.validada !== true && s.motivo !== 'expirada')){
      await sb.from('premiacao_selfies_dia').upsert({ motorista_id: par.motorista_id, data_ref: par.data_ref, validada: false, motivo: 'expirada', enviada: false, validada_em: new Date().toISOString() }, { onConflict: 'motorista_id,data_ref' });
      n++;
    }
  }
  alert(n > 0 ? (n + ' selfie(s) expiraram sem validação.') : 'Nenhuma selfie vencida no momento.');
  await carregarPremiacaoOperacional(true);
}

function ccGoStep(n){
  document.querySelectorAll('.step-btn').forEach(b=>b.classList.toggle('active', b.dataset.step==n));
  document.querySelectorAll('#cc-wizard-wrap .panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('panel-'+n).classList.add('active');
}

function ccSelectTab(tab){
  document.getElementById('cc-tab-cadastro').classList.toggle('active', tab === 'cadastro');
  document.getElementById('cc-tab-status').classList.toggle('active', tab === 'status');
  document.getElementById('cc-wizard-wrap').style.display = tab === 'cadastro' ? 'block' : 'none';
  document.getElementById('panel-4').classList.toggle('active', tab === 'status');
  if(tab === 'status') fcsRenderPainel();
}

function ccOnTipoChange(){
  ccState.pj = document.querySelector('input[name=tipo]:checked').value === 'PJ';
  document.getElementById('label-nome').textContent = ccState.pj ? 'Razão social' : 'Nome completo';
  document.getElementById('label-doc').textContent = ccState.pj ? 'CNPJ' : 'CPF';
  document.getElementById('documento').placeholder = ccState.pj ? '00.000.000/0000-00' : '000.000.000-00';
  document.getElementById('fieldset-situacao-pf').style.display = ccState.pj ? 'none' : 'block';

function ccClearFieldError(id){
  document.getElementById(id).classList.remove('field-invalid');
  const err = document.getElementById('erro-'+id);
  if(err) err.classList.remove('show');
}

  document.getElementById(id).classList.add('field-invalid');
  const err = document.getElementById('erro-'+id);
  if(err) err.classList.add('show');
}

function ccCopiarCampo(fieldId, btn){
  const valor = document.getElementById(fieldId).value.trim();
  if(!valor){ alert('Campo vazio — nada para copiar.'); return; }
  navigator.clipboard.writeText(valor).then(function(){
    const original = btn.textContent;
    btn.textContent = '✓';
    setTimeout(function(){ btn.textContent = original; }, 1200);
  });
}

function ccAnexarCarteiraConselho(lado, file){
  if(!file) return;
  if(lado === 'frente'){
    ccState.conselhoCarteiraFrenteNome = file.name;
    ccState.conselhoCarteiraFrenteFile = file;
    document.getElementById('conselho-carteira-frente-nome').textContent = '📄 ' + file.name + ' — anexado';
  } else {
    ccState.conselhoCarteiraVersoNome = file.name;
    ccState.conselhoCarteiraVersoFile = file;
    document.getElementById('conselho-carteira-verso-nome').textContent = '📄 ' + file.name + ' — anexado';
  }
  ccAtualizarGateConselho();
}

async function ccAnexarPrintConselho(file){
  if(!file) return;
  const nome = document.getElementById('conselho-nome').value.trim();
  if(!nome){ ccMarkFieldError('conselho-nome'); alert('Preencha o nome completo do profissional antes de anexar o print.'); return; }
  ccClearFieldError('conselho-nome');

  ccState.conselhoPrintNome = file.name;
  ccState.conselhoPrintFile = file;
  document.getElementById('conselho-print-nome').textContent = '📄 ' + file.name + ' — lendo com IA...';
  const el = document.getElementById('conselho-resultado');
  el.className = 'readonly-result pending';
  el.textContent = 'Lendo o documento...';

  try{
    const base64 = await ccArquivoParaBase64(file);
    const sessionResult = await sb.auth.getSession();
    const token = sessionResult.data.session.access_token;
    const resp = await fetch('/api/ler-conselho', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ pdfBase64: base64, mimeType: file.type || 'application/pdf' })
    });
    const data = await resp.json();
    if(!resp.ok || !data.dados){
      ccMostrarFalhaLeituraConselho(file.name);
      return;
    }
    ccState.conselhoLido = true;
    ccPreencherComDadosConselho(data.dados);
    document.getElementById('conselho-print-nome').textContent = '📄 ' + file.name + ' — anexado e lido com IA ✓';
  }catch(err){
    ccMostrarFalhaLeituraConselho(file.name);
  }
}

function ccMostrarFalhaLeituraConselho(fileName){
  ccState.conselhoLido = false;
  const el = document.getElementById('conselho-resultado');
  el.className = 'readonly-result bad';
  el.textContent = 'Não foi possível ler automaticamente este print. Tente anexar novamente.';
  document.getElementById('conselho-print-nome').textContent = '📄 ' + fileName + ' — anexado (falha na leitura automática)';

function ccNormalizarDoc(s){ return (s||'').replace(/\D/g,''); }
function ccNormalizarNome(s){ return (s||'').trim().toLowerCase().replace(/\s+/g,' '); }
function ccNomesCompativeis(a,b){
  a = ccNormalizarNome(a); b = ccNormalizarNome(b);
  if(!a || !b) return true;
  if(a===b || a.includes(b) || b.includes(a)) return true;
  const wa = a.split(' ').filter(w=>w.length>2);
  const wb = b.split(' ').filter(w=>w.length>2);
  if(!wa.length || !wb.length) return false;
  const comuns = wa.filter(w=>wb.includes(w));
  return comuns.length >= Math.min(wa.length, wb.length) * 0.5;
}

function ccValidarCorrespondencia(nomeDoc, docDoc){
  const nomeDados = document.getElementById('nome').value.trim();
  const docDados = document.getElementById('documento').value.trim();
  const box = document.getElementById('validacao-correspondencia');
  box.style.display = 'block';

  if(!nomeDados && !docDados){
    box.className = 'readonly-result pending';
    box.innerHTML = 'Preencha nome e documento na etapa Dados para validar a correspondência com o relatório importado.';
    ccState.correspondenciaOk = true;
    ccChecarLiberacaoParecer();
    return;
  }
  if(!docDoc){
    box.className = 'readonly-result pending';
    box.innerHTML = 'Informe o CPF/CNPJ como consta no documento importado para conferir a correspondência.';
    ccState.correspondenciaOk = true;
    ccChecarLiberacaoParecer();
    return;
  }

  const docBate = ccNormalizarDoc(docDados) === ccNormalizarDoc(docDoc);
  const nomeBate = ccNomesCompativeis(nomeDados, nomeDoc);

  if(docBate && nomeBate){
    box.className = 'readonly-result ok';
    box.innerHTML = 'Nome/documento do relatório importado conferem com o que foi digitado na etapa Dados.';
    ccState.correspondenciaOk = true;
  } else {
    box.className = 'readonly-result bad';
    box.innerHTML = `⚠ O documento importado (<strong>${nomeDoc}</strong> — ${docDoc}) não confere com o que foi digitado em Dados (<strong>${nomeDados||'—'}</strong> — ${docDados||'—'}). Confira se não foi lançada a consulta de outro cliente antes de gerar o parecer.`;
    ccState.correspondenciaOk = false;
  }
  ccChecarLiberacaoParecer();
}

  const nomeDoc = document.getElementById('custom-doc-nome').value.trim();

}

async function ccAnexarSerasa(file){
  if(!file) return;
  ccState.serasaFile = file;
  document.getElementById('serasa-arquivo-nome').textContent = '📄 ' + file.name + ' — lendo com IA...';
  ccState.serasaProcessado = true;
  document.getElementById('serasa-pendente').style.display = 'none';
  document.getElementById('bloco-pos-serasa').style.display = 'block';
  const nomeDados = document.getElementById('nome').value.trim();
  const docDados = document.getElementById('documento').value.trim();
  document.getElementById('custom-doc-nome').value = nomeDados;
  document.getElementById('custom-doc-cpf').value = docDados;
  ccValidarCorrespondencia(nomeDados, docDados);
  ccChecarLiberacaoParecer();

  try{
    const base64 = await ccArquivoParaBase64(file);
    const sessionResult = await sb.auth.getSession();
    const token = sessionResult.data.session.access_token;
    const resp = await fetch('/api/ler-serasa', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ pdfBase64: base64, mimeType: file.type || 'application/pdf' })
    });
    const data = await resp.json();
    if(!resp.ok || !data.dados){
      ccMostrarFalhaLeituraSerasa(file.name);
      return;
    }
    ccPreencherComDadosSerasa(data.dados);
    document.getElementById('serasa-arquivo-nome').textContent = '📄 ' + file.name + ' — anexado e lido com IA ✓';
  }catch(err){
    ccMostrarFalhaLeituraSerasa(file.name);
  }
}

  const msg = 'Não foi possível ler automaticamente este relatório. Tente anexar novamente ou avise o suporte.';
  if(ccState.pj){

      const el = document.getElementById(id);
      el.className = 'readonly-result bad';
      el.textContent = msg;

  }
  document.getElementById('serasa-arquivo-nome').textContent = '📄 ' + fileName + ' — anexado (falha na leitura automática)';
}

function ccArquivoParaBase64(file){
  return new Promise(function(resolve, reject){
    const reader = new FileReader();
    reader.onload = function(){ resolve(reader.result.split(',')[1]); };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function ccKv(obj){
  return Object.entries(obj).map(([k,v])=>{
    const isLimite = /limite/i.test(k);
    return `<div class="stat-card${isLimite ? ' limite' : ''}"><div class="k">${k}</div><div class="v">${v}</div></div>`;
  }).join('');
}
function ccBandaScore(score){
  if(score >= 650) return {cls:'ok', label:'Risco baixo'};
  if(score >= 400) return {cls:'warn', label:'Risco médio'};
  return {cls:'bad', label:'Risco alto'};
}
function ccSetScore(prefix, score, negativa){
  const banda = ccBandaScore(score);
  const raio = 70, circun = Math.PI * raio;
  const offset = circun * (1 - Math.min(Math.max(score,0),1000)/1000);
  const corVar = banda.cls === 'ok' ? 'var(--ok-line)' : (banda.cls === 'warn' ? 'var(--warn-line)' : 'var(--bad-line)');
  const box = document.getElementById('score-box-'+prefix);
  box.innerHTML = `
    <div class="score-gauge-wrap">
      <svg width="160" height="100" viewBox="0 0 160 100">
        <path d="M 10 90 A 70 70 0 0 1 150 90" fill="none" stroke="var(--line)" stroke-width="12" stroke-linecap="round"/>
        <path d="M 10 90 A 70 70 0 0 1 150 90" fill="none" stroke="${corVar}" stroke-width="12" stroke-linecap="round"
              stroke-dasharray="${circun.toFixed(1)}" stroke-dashoffset="${offset.toFixed(1)}"/>
      </svg>
      <div class="score-value">${score}<span>/1000</span></div>
      <div class="score-band ${banda.cls}">${banda.label}</div>
    </div>
    <div class="score-recomendacao-txt">${negativa
      ? 'Recomendação Serasa: negativa — indicativo de cautela.'
      : 'Recomendação Serasa: positiva — sem restrição relevante.'}</div>`;
}
function ccRenderTable(id, lista){
  const body = document.getElementById(id);
  if(lista.length===0){ body.innerHTML = '<tr><td colspan="5"><span class="pend-empty">✓ Não constam pendências no relatório</span></td></tr>'; return; }
  body.innerHTML = lista.map(p=>`<tr><td>${p.tipo}</td><td>${p.origem}</td><td>${p.data}</td><td class="val">${p.valor}</td><td></td></tr>`).join('');
}
function ccRenderCustomTable(tbodyId, ncols){
  document.getElementById(tbodyId).innerHTML = '';
  ccAddRow(tbodyId, ncols);
}
function ccAddRow(tbodyId, ncols){
  const tbody = document.getElementById(tbodyId);
  const tr = document.createElement('tr');
  let tds = '';
  for(let i=0;i<ncols;i++){
    tds += `<td><input type="text" placeholder="${i===0?'Ex: Refin':i===1?'Ex: Banco X':i===2?'dd/mm/aaaa':'R$ 0,00'}"></td>`;
  }
  tds += `<td><button type="button" class="btn-remove-row" onclick="this.closest('tr').remove()">✕</button></td>`;
  tr.innerHTML = tds;
  tbody.appendChild(tr);
}

async function ccAnexarAlvara(file){
  if(!file) return;
  ccState.alvaraFile = file;
  document.getElementById('alvara-arquivo-nome').textContent = '📄 ' + file.name + ' — lendo com IA...';
  const elPend = document.getElementById('alvara-resultado');
  elPend.className = 'readonly-result pending';
  elPend.textContent = 'Lendo o documento...';

  try{
    const base64 = await ccArquivoParaBase64(file);
    const sessionResult = await sb.auth.getSession();
    const token = sessionResult.data.session.access_token;
    const resp = await fetch('/api/ler-alvara', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ pdfBase64: base64, mimeType: file.type || 'application/pdf' })
    });
    const data = await resp.json();
    if(!resp.ok || !data.dados){
      ccMostrarFalhaLeituraAlvara(file.name);
      return;
    }
    ccPreencherComDadosAlvara(data.dados);
    document.getElementById('alvara-arquivo-nome').textContent = '📄 ' + file.name + ' — anexado e lido com IA ✓';
  }catch(err){
    ccMostrarFalhaLeituraAlvara(file.name);
  }
}

function ccMostrarFalhaLeituraAlvara(fileName){
  const el = document.getElementById('alvara-resultado');
  el.className = 'readonly-result bad';
  el.textContent = 'Não foi possível ler automaticamente este alvará. Tente anexar novamente ou preencha manualmente com o suporte.';
  document.getElementById('alvara-arquivo-nome').textContent = '📄 ' + fileName + ' — anexado (falha na leitura automática)';
}

function ccPreencherComDadosAlvara(d){
  if(!d) return;
  let ativo = !!d.situacaoAtiva;
  let vigenciaTxt = d.vigencia || d.vencimento || '—';
  let concessaoTxt = d.concessao || d.dataEmissao || '—';
  const atividades = Array.isArray(d.atividades) ? d.atividades.filter(Boolean) : [];
  const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(vigenciaTxt);
  if(m){
    const dataVenc = new Date(parseInt(m[3]), parseInt(m[2])-1, parseInt(m[1]));
    if(!isNaN(dataVenc.getTime())){
      ativo = dataVenc.getTime() >= new Date().setHours(0,0,0,0);
    }
  }
  if(d.orgaoEmissor) ccState.alvaraMunicipio = d.orgaoEmissor;
  ccState.alvaraProcessado = true;
  ccState.alvaraAtivo = ativo;
  ccState.alvaraVencimento = vigenciaTxt;
  ccState.alvaraConcessao = concessaoTxt;
  ccState.alvaraAtividades = atividades;

  const el = document.getElementById('alvara-resultado');
  el.className = 'readonly-result ' + (ativo ? 'ok' : 'bad');
  const atividadesHtml = atividades.length
    ? `<div style="margin-top:6px;"><strong>Atividades:</strong><ul style="margin:4px 0 0 18px;padding:0;">${atividades.map(a=>`<li>${a}</li>`).join('')}</ul></div>`
    : '';
  el.innerHTML = (ativo
    ? `Alvará sanitário ativo${d.situacaoTexto ? ' — situação: ' + d.situacaoTexto : ''}.`
    : `Alvará sanitário vencido ou irregular${d.situacaoTexto ? ' — situação: ' + d.situacaoTexto : ''}.`)
    + `<div style="margin-top:4px;">Concessão: ${concessaoTxt} &nbsp;·&nbsp; Vigência: ${vigenciaTxt}</div>`
    + atividadesHtml
    + (d.orgaoEmissor ? `<span class="src">${d.orgaoEmissor} — lido por IA</span>` : '<span class="src">Lido por IA</span>')
    + `<button type="button" class="doc-chip" onclick="ccAbrirAlvaraReal()">📎 ${ccState.alvaraFile ? ccState.alvaraFile.name : 'alvará'} — abrir anexo</button>`;

  ccChecarLiberacaoParecer();
}

function ccAbrirAlvaraReal(){
  if(ccState.alvaraFile){
    window.open(URL.createObjectURL(ccState.alvaraFile), '_blank');
  }
}

const CC_EQUIP_LABEL = {lavieen:'Lavieen', criodermis:'Criodermis 2.0', endolaser:'Endolaser Pioon 1470', ultraformer:'Ultraformer MPT'};
const CC_EQUIP_FIXO = ['lavieen','criodermis','endolaser'];

function ccAvaliar(){
  const nome = document.getElementById('nome').value || (ccState.pj ? 'Empresa não informada' : 'Cliente não informado');
  const documento = document.getElementById('documento').value || '—';
  const equipamentos = ccGetEquipamentosSelecionados();
  const equipLabelStr = equipamentos.length ? equipamentos.map(e=>CC_EQUIP_LABEL[e]).join(', ') : '(nenhum equipamento selecionado)';
  const financeiroRuim = ccState.recomendacaoNegativa || ccState.score < 500;
  const cadastralImpeditivo = !ccState.docAtivo || (ccState.pj && !ccState.alvaraAtivo);
  const profissionalOk = ccState.conselhoAtivo;
  const eliminatorio = cadastralImpeditivo || !profissionalOk;

  const fixosSelecionados = equipamentos.filter(e=>CC_EQUIP_FIXO.includes(e));
  const ultraformerSelecionado = equipamentos.includes('ultraformer');

  let veredito, conclusaoClasse, conclusaoTitulo, conclusaoTexto, mostrarAprovacaoManual=false;

  if(eliminatorio){
    veredito = {cadastral: cadastralImpeditivo?'bad':'ok', financeiro:'warn', profissional: profissionalOk?'ok':'bad'};
    conclusaoClasse = 'bad'; conclusaoTitulo = 'Cadastro reprovado';
    conclusaoTexto = cadastralImpeditivo
      ? 'Dado cadastral com impeditivo (documento ou alvará irregular). Não é possível prosseguir com a locação até regularização.'
      : 'Conselho profissional inativo. Não é possível prosseguir com a locação enquanto essa pendência não for resolvida.';
  } else if(!financeiroRuim){
    veredito = {cadastral:'ok', financeiro:'ok', profissional:'ok'};
    conclusaoClasse = 'ok'; conclusaoTitulo = 'Cadastro aprovado';
    conclusaoTexto = `Análise financeira sem restrição relevante. Aprovado para locação de ${equipLabelStr} nas condições comerciais padrão.`;
  } else if(fixosSelecionados.length && !ultraformerSelecionado){
    veredito = {cadastral:'ok', financeiro:'warn', profissional:'ok'};
    conclusaoClasse = 'warn'; conclusaoTitulo = 'Aprovado com restrição — pagamento antecipado';
    conclusaoTexto = `Financeiro restritivo, mas como ${equipLabelStr} ${fixosSelecionados.length>1?'têm':'tem'} valor fixo de locação, o cadastro é aprovado somente para pagamento antecipado. Venda de manta ou fibra (quando aplicável) também deve ser cobrada antecipadamente.`;
  } else if(ultraformerSelecionado && !fixosSelecionados.length){
    veredito = {cadastral:'ok', financeiro:'bad', profissional:'ok'};
    conclusaoClasse = 'warn'; conclusaoTitulo = 'Pendente de aprovação manual';
    conclusaoTexto = `Financeiro restritivo e Ultraformer MPT tem valor variável por distância — não é possível aprovar automaticamente. Necessária decisão do Victor.`;
    mostrarAprovacaoManual = true;
  } else {
    veredito = {cadastral:'ok', financeiro:'bad', profissional:'ok'};
    conclusaoClasse = 'warn'; conclusaoTitulo = 'Aprovação mista — parte antecipada, parte manual';
    conclusaoTexto = `Financeiro restritivo. ${fixosSelecionados.map(e=>CC_EQUIP_LABEL[e]).join(', ')} (valor fixo) fica aprovado somente para pagamento antecipado. Já o Ultraformer MPT (valor variável por distância) é reprovado automaticamente e depende de decisão manual do Victor.`;
    mostrarAprovacaoManual = true;
  }
  return {nome, documento, equipamentos, equipLabelStr, veredito, conclusaoClasse, conclusaoTitulo, conclusaoTexto, mostrarAprovacaoManual, eliminatorio, financeiroRuim};
}

        ${r.mostrarAprovacaoManual ? `<div class="manual-approval"><div class="radio-group"><label><input type="radio" name="vitorLiberou"> Vitor liberou</label><label><input type="radio" name="vitorLiberou"> Vitor não liberou</label></div></div>` : ''}

function ccDataBRParaISO(str){
  if(!str || str === '—') return null;
  const p = str.split('/');

  return p[2] + '-' + p[1] + '-' + p[0];
}

function fcsVencimentoInfo(iso){
  if(!iso) return { cls:'status-wait', label:'Não informado', venc:'' };
  const hoje = premiacaoIsoHoje(0);
  const meses = opMesesEntre(hoje, iso);
  const vencTxt = 'Vence <b>' + opDataBR(iso) + '</b>';
  if(meses < 0) return { cls:'status-alert', label:'Vencido', venc:'Venceu em <b>' + opDataBR(iso) + '</b>' };
  if(meses === 0) return { cls:'status-alert', label:'Vence este mês', venc:vencTxt + ' · vence este mês' };
  if(meses <= 1) return { cls:'status-wait', label:'Vence em breve', venc:vencTxt + ' · falta ' + meses + ' mês' };
  return { cls:'status-ok', label:'Válido', venc:vencTxt + ' · faltam ' + meses + ' meses' };
}

    '<button class="btn btn-primary btn-sm" onclick="fcsAbrirManual()">+ Cadastrar manualmente</button></div>' +
    '<input class="fcs-search" placeholder="Buscar por nome, razão social, CPF ou CNPJ..." oninput="fcsMontarHtml(this.value)" value="' + escapeHtml(filtro||'') + '">' +
    '<div id="fcs-cards">' + cardsHtml + '</div>' +
    '<div id="fcs-modal-holder"></div>';

  if(searchEl && filtro !== undefined){
    searchEl.focus();
    searchEl.setSelectionRange(searchEl.value.length, searchEl.value.length);
  }
