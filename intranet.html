    '<div class="rjx-modal-body">' +
    '<div class="hint" style="margin-bottom:14px;">Use isso pra clientes que já operam com a gente mas nunca passaram pela análise por aqui. Só os campos abaixo — o dossiê completo continua vivendo no cadastro do cliente no estoque.</div>' +
    '<div class="radio-group"><label><input type="radio" name="fz-tipo" value="PF" checked onchange="fcsOnTipoManual()"> Pessoa física (CPF)</label><label><input type="radio" name="fz-tipo" value="PJ" onchange="fcsOnTipoManual()"> Pessoa jurídica (CNPJ)</label></div>' +
    '<div class="field"><label id="fz-label-nome">Nome completo</label><input type="text" id="fz-nome" placeholder="Ex: Julia Marques Collucci"></div>' +
    '<div class="field"><label id="fz-label-doc">CPF</label><input type="text" id="fz-doc" placeholder="000.000.000-00"></div>' +
    '<div class="field" id="fz-campo-socio" style="display:none;"><label>Sócio(a)</label><input type="text" id="fz-socio" placeholder="Nome completo"></div>' +
    '<div class="field-row"><div class="field"><label>Alvará sanitário</label><select id="fz-alvara-status"><option value="true">Válido</option><option value="false">Irregular/vencido</option></select></div>' +
    '<div class="field"><label>Vencimento do alvará</label><input type="date" id="fz-alvara-venc"></div></div>' +
    '<div class="field-row"><div class="field"><label>Carteira do conselho</label><select id="fz-conselho-status"><option value="true">Ativa</option><option value="false">Inativa</option></select></div>' +
    '<div class="field"><label>Vencimento da carteira</label><input type="date" id="fz-conselho-venc"></div></div>' +
    '<div class="field"><label>Análise de crédito</label><select id="fz-credito"><option value="aprovado">Aprovado</option><option value="restricao">Aprovação com restrição</option><option value="reprovado">Reprovado</option></select></div>' +
    '</div><div class="rjx-modal-foot"><div></div><div class="right-group"><button class="btn btn-ghost" onclick="fcsFecharManual()">Cancelar</button><button class="btn btn-primary" onclick="fcsSalvarManual()">Salvar cliente</button></div></div></div></div>';
  fcsOnTipoManual();
}

function fcsOnTipoManual(){
  const pj = document.querySelector('input[name=fz-tipo]:checked').value === 'PJ';
  document.getElementById('fz-label-nome').textContent = pj ? 'Razão social' : 'Nome completo';
  document.getElementById('fz-label-doc').textContent = pj ? 'CNPJ' : 'CPF';
  document.getElementById('fz-campo-socio').style.display = pj ? 'block' : 'none';
}

function fcsFecharManual(){
  const holder = document.getElementById('fcs-modal-holder');
  if(holder) holder.innerHTML = '';
}

async function fcsSalvarManual(){
  const pj = document.querySelector('input[name=fz-tipo]:checked').value === 'PJ';
  const nome = document.getElementById('fz-nome').value.trim();
  const doc = document.getElementById('fz-doc').value.trim();
  if(!nome || !doc){
    alert('Preencha nome e ' + (pj?'CNPJ':'CPF') + '.');
    return;
  }
  const row = {
    origem: 'manual',
    tipo: pj ? 'PJ' : 'PF',
    nome: nome,
    documento: doc,
    socio_nome: pj ? (document.getElementById('fz-socio').value.trim() || null) : null,
    alvara_ativo: pj ? (document.getElementById('fz-alvara-status').value === 'true') : null,
    alvara_vencimento: pj ? (document.getElementById('fz-alvara-venc').value || null) : null,
    conselho_ativo: document.getElementById('fz-conselho-status').value === 'true',
    conselho_vencimento: document.getElementById('fz-conselho-venc').value || null,
    credito_status: document.getElementById('fz-credito').value,
    criado_por: currentUsuario.id
  };
  const ins = await sb.from('financeiro_clientes_status').insert(row);
  if(ins.error){
    alert('Não foi possível salvar: ' + ins.error.message);
    return;
  }
  fcsFecharManual();
  fcsRenderPainel();
}

function ccSnapshotEditable(fieldsetId){
  const src = document.getElementById(fieldsetId);
  const clone = src.cloneNode(true);
  const liveInputs = src.querySelectorAll('input, select, textarea');
  const cloneInputs = clone.querySelectorAll('input, select, textarea');
  liveInputs.forEach((el, i)=>{
    let val;
    if(el.tagName === 'SELECT'){ val = el.options[el.selectedIndex] ? el.options[el.selectedIndex].text : ''; }
    else { val = el.value; }
    const span = document.createElement('span');
    span.textContent = (val && String(val).trim() !== '') ? val : '—';
    span.style.fontWeight = '600';
    if(cloneInputs[i]) cloneInputs[i].replaceWith(span);
  });
  clone.querySelectorAll('button, legend').forEach(el=>el.remove());
  return clone.innerHTML;
}

let __pdfWorkerReady = null;
function ccInicializarPdfJs(){
  if(__pdfWorkerReady) return __pdfWorkerReady;
  __pdfWorkerReady = fetch('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js')
    .then(r => r.text())
    .then(code => {
      const blobUrl = URL.createObjectURL(new Blob([code], {type:'application/javascript'}));
      pdfjsLib.GlobalWorkerOptions.workerSrc = blobUrl;
    });
  return __pdfWorkerReady;
}

async function ccRenderPdfComoImagens(file){
  await ccInicializarPdfJs();
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data: buf}).promise;
  let html = '';
  for(let i=1;i<=pdf.numPages;i++){
    const page = await pdf.getPage(i);
    const viewport = page.getViewport({scale: 1.6});
    const canvas = document.createElement('canvas');
    canvas.width = viewport.width; canvas.height = viewport.height;
    await page.render({canvasContext: canvas.getContext('2d'), viewport}).promise;
    html += `<img src="${canvas.toDataURL('image/jpeg', 0.85)}" alt="página ${i}">`;
  }
  return html;
}

async function ccAnexoFinalBloco(file, titulo, opts){
  if(!file) return '';
  opts = opts || {};
  const isImg = /^image\//.test(file.type) || /\.(png|jpe?g|gif|webp)$/i.test(file.name);
  let corpo;
  if(isImg){
    corpo = `<img src="${URL.createObjectURL(file)}" alt="${titulo}">`;
  } else {
    try{
      corpo = await ccRenderPdfComoImagens(file);
    }catch(e){
      corpo = `<iframe src="${URL.createObjectURL(file)}" title="${titulo}"></iframe>`;
    }
  }
  const wide = opts.wide || !isImg;
  return `<div class="anexo-final${wide ? ' wide' : ''}"><div class="cap">${opts.icone || '📎'} ${titulo}</div><div class="body">${corpo}</div></div>`;
}

async function ccMontarDocFinal(){
  const r = ccAvaliar();
  const hoje = new Date().toLocaleDateString('pt-BR');

  const situacaoHtml = ccSnapshotEditable(ccState.pj ? 'fieldset-situacao-pj' : 'fieldset-situacao-pf');
  const pendenciasHtml = ccSnapshotEditable(ccState.pj ? 'fieldset-pendencias-pj' : 'fieldset-pendencias-pf');
  const alvaraHtml = ccState.pj ? ccSnapshotEditable('fieldset-alvara-doc') : '';
  const parecerHtml = ccGerarParecerHtml(r);

  const anexosArr = await Promise.all([
    ccState.pj ? ccAnexoFinalBloco(ccState.alvaraFile, 'Alvará sanitário', {icone:'📄'}) : Promise.resolve(''),
    ccAnexoFinalBloco(ccState.serasaFile, 'Relatório Serasa', {icone:'📄'}),
    ccAnexoFinalBloco(ccState.conselhoCarteiraFrenteFile, 'Carteira do conselho — frente', {icone:'🪪'}),
    ccAnexoFinalBloco(ccState.conselhoCarteiraVersoFile, 'Carteira do conselho — verso', {icone:'🪪'}),
    ccAnexoFinalBloco(ccState.conselhoPrintFile, 'Comprovante da consulta ao conselho', {icone:'🖥️'})
  ]);
  const anexosHtml = anexosArr.filter(Boolean).join('');

  document.getElementById('doc-final').innerHTML = `
    <button type="button" class="btn btn-ghost no-print-btn" style="margin-bottom:14px;" onclick="document.getElementById('doc-final').style.display='none';">✕ Fechar pré-visualização</button>
    <div class="doc-page">
      <h2 class="doc-title">Dossiê de cadastro de cliente</h2>
      <div class="doc-sub">RJX Locações · gerado em ${hoje} · ${r.nome} · ${ccState.pj?'CNPJ':'CPF'} ${r.documento} · Equipamento(s): ${r.equipLabelStr}</div>

      <div class="doc-section">
        <h3>1. Situação cadastral</h3>
        ${situacaoHtml}
      </div>

      ${ccState.pj ? `<div class="doc-section"><h3>Alvará sanitário</h3>${alvaraHtml}</div>` : ''}

      <div class="doc-section">
        <h3>2. Pendências financeiras (relatório Serasa)</h3>
        ${pendenciasHtml}
      </div>

      <div class="doc-section">
        <h3>3. Perfil profissional</h3>
        <p>${document.getElementById('conselho-tipo').value} — inscrição ${document.getElementById('conselho-numero').value || '(não informado)'}, responsável técnico ${document.getElementById('conselho-nome').value || '(não informado)'}: <strong>${ccState.conselhoAtivo?'ativa':'inativa'}</strong>.</p>
      </div>

      <div class="doc-section">
        <h3>4. Parecer final</h3>
        ${parecerHtml}
      </div>

      ${anexosHtml ? `<div class="doc-section">
        <h3>5. Anexos</h3>
        <div class="anexos-grid">${anexosHtml}</div>
      </div>` : ''}
    </div>
  `;
}

function ccAguardarAnexosCarregados(container){
  const medias = Array.from(container.querySelectorAll('.anexo-final img, .anexo-final iframe'));
  if(!medias.length) return Promise.resolve();
  return Promise.all(medias.map(el => new Promise(resolve => {
    if(el.tagName === 'IMG' && el.complete){ resolve(); return; }
    el.addEventListener('load', resolve, {once:true});
    el.addEventListener('error', resolve, {once:true});
    setTimeout(resolve, 4000);
  })));
}

async function ccImprimirDossie(){
  await ccMontarDocFinal();
  await ccAguardarAnexosCarregados(document.getElementById('doc-final'));
  window.print();
}

async function ccPrevisualizarDoc(){
  await ccMontarDocFinal();
  const docFinal = document.getElementById('doc-final');
  docFinal.style.display = 'block';
  docFinal.scrollIntoView({behavior:'smooth', block:'start'});
}
