<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>RJX · Controle de Insumos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --paper:#faf7f2; --paper-soft:#f1ebe1; --line:#e4dccd;
    --ink:#17130f; --ink-soft:#362f29; --gray:#5c554e; --gray-soft:#8a8377;
    --wine:#7a1220; --wine-dark:#591019; --wine-bright:#b81f2b; --gold:#a9813f;
    --display:'Fraunces','Source Sans 3',serif; --body:'Source Sans 3',-apple-system,sans-serif;
    --mono:'JetBrains Mono',monospace;
    --radius:3px;
    --alert:#8a2e1f; --alert-bg:#f6e6e0; --ok:#3f6b52; --ok-bg:#eaf1ec;
  }
  *{box-sizing:border-box;}
  html,body{ margin:0; background:#ded6c8; font-family:var(--body); color:var(--ink); }
  body{ display:flex; justify-content:center; min-height:100vh; }
  .device{ width:100%; max-width:460px; min-height:100vh; background:var(--paper); display:flex; flex-direction:column; }

  header.topbar{ background:var(--ink); color:var(--paper); padding:18px 20px 16px; position:sticky; top:0; z-index:10; border-bottom:3px solid var(--wine); }
  .brand{ display:flex; align-items:center; gap:9px; }
  .brand img{ height:34px; width:auto; display:block; }
  .brand span{ font-size:11px; color:var(--gold); font-weight:600; text-transform:uppercase; letter-spacing:.08em; }
  .eyebrow{ font-family:var(--body); font-weight:700; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); display:flex; align-items:center; gap:8px; margin-top:11px; }
  .eyebrow::before{ content:""; width:20px; height:1.5px; background:var(--gold); display:inline-block; }
  .locacao-chip{ margin-top:5px; font-size:12.5px; opacity:.8; font-weight:400; }

  main{ flex:1; padding:22px 18px 60px; }
  h2.section-title{ font-family:var(--display); font-size:21px; font-weight:600; margin:0 0 4px; }
  .section-sub{ font-size:12.5px; color:var(--gray); margin:0 0 18px; }

  .card{ background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:18px; margin-bottom:14px; }
  .card h3{ margin:0 0 14px; font-size:11.5px; color:var(--wine); text-transform:uppercase; letter-spacing:.09em; font-weight:700; display:flex; align-items:center; gap:8px; }
  .card h3::before{ content:""; width:16px; height:1.5px; background:var(--wine); display:inline-block; }

  label{ display:block; font-size:13px; font-weight:700; color:var(--ink-soft); margin:14px 0 7px; }
  label:first-of-type{ margin-top:0; }
  input[type=text], input[type=date], input[type=number], select, textarea{
    width:100%; padding:12px 13px; border:1.5px solid var(--line); border-radius:var(--radius);
    font-family:var(--body); font-size:15px; background:var(--paper); color:var(--ink);
  }
  textarea{ resize:vertical; min-height:70px; }
  input:focus, select:focus, textarea:focus{ outline:none; border-color:var(--wine); }
  .hint{ font-size:11px; color:var(--gray-soft); margin-top:5px; }
  .field-error{ font-size:11.5px; color:var(--alert); margin-top:5px; font-weight:700; display:none; }

  .radio-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .radio-pill{ flex:1; min-width:96px; text-align:center; padding:11px 8px; border-radius:var(--radius); border:1.5px solid var(--line); font-size:12.5px; font-weight:700; color:var(--gray); cursor:pointer; user-select:none; }
  .radio-pill.sel{ border-color:var(--wine); background:#f7e9ea; color:var(--wine); }

  .cartucho-row{ display:flex; align-items:center; justify-content:space-between; padding:11px 0; border-bottom:1px solid var(--line); gap:10px; }
  .cartucho-row:last-child{ border-bottom:none; }
  .cartucho-nome{ font-size:13.5px; font-weight:700; }
  .cartucho-nome small{ display:block; font-weight:400; color:var(--gray-soft); font-size:10.5px; margin-top:2px; }
  .row-error{ font-size:11px; color:var(--alert); font-weight:700; margin:-6px 0 8px; display:none; }
  .meter.invalid{ box-shadow:inset 0 0 0 1.5px var(--wine-bright), inset 0 2px 4px rgba(0,0,0,.4); }
  .meter{ background:var(--ink); border-radius:var(--radius); padding:8px 10px; display:flex; align-items:center; gap:2px; box-shadow:inset 0 2px 4px rgba(0,0,0,.4); flex-shrink:0; }
  .meter input{ width:80px; background:transparent !important; border:none !important; outline:none; font-family:var(--mono); font-weight:700; font-size:17px; letter-spacing:1px; color:var(--gold) !important; text-align:right; padding:0 !important; -moz-appearance:textfield; }
  .meter input::-webkit-outer-spin-button, .meter input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  .meter .unit{ font-size:9px; color:#8a7a63; font-family:var(--mono); margin-left:4px; }

  .diff-row{ display:flex; align-items:center; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--line); font-size:13.5px; }
  .diff-row:last-child{ border-bottom:none; }
  .diff-row .saldo{ font-family:var(--mono); font-weight:700; color:var(--wine); }
  .diff-group{ font-family:var(--body); font-weight:700; font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--gray-soft); margin:12px 0 2px; }

  .toggle-row{ display:flex; align-items:center; justify-content:space-between; padding:11px 0; }
  .toggle-row span{ font-size:13.5px; font-weight:700; color:var(--ink-soft); }
  .switch{ position:relative; width:44px; height:25px; background:#ddd3c0; border-radius:20px; cursor:pointer; flex-shrink:0; }
  .switch.on{ background:var(--wine); }
  .switch .knob{ position:absolute; top:3px; left:3px; width:19px; height:19px; border-radius:50%; background:#fff; transition:.2s; }
  .switch.on .knob{ left:22px; }

  .total-box{ background:var(--wine); color:var(--paper); border-radius:var(--radius); padding:18px; display:flex; align-items:center; justify-content:space-between; margin-top:8px; }
  .total-box .label{ font-size:11px; opacity:.8; text-transform:uppercase; letter-spacing:.08em; font-weight:700; }
  .total-box .valor{ font-family:var(--display); font-size:25px; font-weight:600; }

  .alert-box{ background:var(--alert-bg); border:1.5px solid #d9b8a9; color:var(--alert); border-radius:var(--radius); padding:13px 14px; font-size:12.5px; font-weight:700; display:flex; gap:9px; align-items:flex-start; margin-bottom:12px; }
  .ok-box{ background:var(--ok-bg); border:1px solid #c9ded0; color:var(--ok); border-radius:var(--radius); padding:11px 14px; font-size:12.5px; font-weight:700; display:flex; gap:8px; align-items:center; margin-top:10px; }

  .sig-label{ font-family:var(--display); font-size:16px; margin-bottom:10px; }
  canvas.sig-canvas{ width:100%; height:150px; background:var(--paper-soft); border:1.5px dashed #c9b9a5; border-radius:var(--radius); touch-action:none; display:block; }
  .sig-meta{ font-size:11px; color:var(--gray); margin-top:8px; display:flex; justify-content:space-between; flex-wrap:wrap; gap:4px;}
  .sig-actions{ display:flex; gap:8px; margin-top:10px; }
  .sig-actions button{ flex:1; }

  .btn-primary{ width:100%; background:var(--wine); color:var(--paper); border:1.5px solid transparent; border-radius:var(--radius); padding:15px; font-family:var(--body); font-size:14.5px; font-weight:700; cursor:pointer; }
  .btn-primary:active{ background:var(--wine-dark); }
  .btn-primary:disabled{ background:#c9b9bb; cursor:not-allowed; }
  .btn-secondary{ width:100%; background:transparent; color:var(--wine); border:1.5px solid var(--wine); border-radius:var(--radius); padding:14px; font-family:var(--body); font-size:14px; font-weight:700; cursor:pointer; margin-top:8px; }
  .btn-secondary.alt{ color:var(--ok); border-color:var(--ok); }
  .btn-secondary.mini{ padding:10px; font-size:12.5px; margin-top:0; }

  .link-box{ background:var(--paper-soft); border:1px solid var(--line); border-radius:var(--radius); padding:12px; font-family:var(--mono); font-size:11px; color:var(--gray); word-break:break-all; margin-bottom:10px; }
  .copied-msg{ font-size:11.5px; color:var(--ok); font-weight:700; margin-top:6px; display:none; }

  .pdf-cond{ background:var(--paper-soft); border-left:3px solid var(--gold); padding:8px 10px; font-size:11.5px; color:var(--ink-soft); margin-bottom:14px; }

  .note{ font-size:11.5px; color:var(--gray); text-align:center; margin-top:10px; line-height:1.5; }
  .center-msg{ text-align:center; padding:40px 10px; }
  .center-msg .big{ font-family:var(--display); font-size:19px; margin-bottom:8px; }

  .cartucho-block{ padding:11px 0; border-bottom:1px solid var(--line); }
  .cartucho-block:last-child{ border-bottom:none; }
  .cartucho-block .cartucho-row{ padding:0 0 8px; border-bottom:none; }
  .meter.diverge{ box-shadow:inset 0 0 0 1.5px var(--gold), inset 0 2px 4px rgba(0,0,0,.4); }
  .foto-block{ margin-top:2px; }
  .banner-condicoes{ background:var(--paper-soft); border-left:3px solid var(--wine); border-radius:var(--radius); padding:9px 11px; margin-bottom:14px; }
  .banner-label{ font-size:11px; font-weight:700; color:var(--wine); text-transform:uppercase; letter-spacing:.3px; margin-bottom:4px; }
  .banner-text{ font-size:13px; color:var(--ink-soft); line-height:1.5; }
  .banner-row{ display:flex; justify-content:space-between; font-size:13px; color:var(--ink-soft); padding:2px 0; }
  .foto-btn{ width:auto; display:inline-block; }
  .foto-actions{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .foto-actions .btn-secondary.mini{ width:auto; margin-top:0; }
  .foto-row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .foto-row .foto-retake-wrap{ display:flex; gap:8px; flex-shrink:0; }
  .foto-thumb{ width:52px; height:52px; object-fit:cover; border-radius:var(--radius); border:1.5px solid var(--line); flex-shrink:0; }
  .foto-meta{ flex:1; min-width:0; }
  .foto-status{ font-size:11.5px; font-weight:700; color:var(--gray); display:block; }
  .foto-status.ok{ color:var(--ok); }
  .foto-status.warn{ color:var(--gold); }
  .foto-status.offline{ color:var(--alert); }
  .foto-ts{ font-size:10px; color:var(--gray-soft); margin-top:2px; }
  .foto-row .btn-secondary.mini{ width:auto; flex-shrink:0; margin-top:0; }
  .foto-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; }
  .foto-grid-item{ text-align:center; }
  .foto-grid-item img{ width:100%; height:90px; object-fit:cover; border-radius:var(--radius); border:1.5px solid var(--line); }
  .foto-grid-item .cap{ font-size:10.5px; color:var(--gray); margin-top:4px; }
  .foto-grid-item.missing{ display:flex; align-items:center; justify-content:center; height:90px; background:var(--paper-soft); border:1.5px dashed #c9b9a5; border-radius:var(--radius); color:var(--gray-soft); font-size:11px; }
</style>
</head>
<body>
<div class="device">
  <header class="topbar">
    <div class="brand"><img id="logo-header" alt="RJX Locações"><span>Insumos</span></div>
    <div class="eyebrow" id="eyebrowText">Carregando</div>
    <div class="locacao-chip" id="chipText">—</div>
  </header>
  <main id="app"></main>
</div>

function formatDateBR(iso){
  if(!iso) return '';
  const parts = String(iso).split('-');
  if(parts.length !== 3) return iso;
  const [y,m,d] = parts;
  return d + '/' + m + '/' + y;
}

/* ---------------- helpers ---------------- */
function b64encode(obj){
  return encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(obj)))));
}
function b64decode(str){
  try{ return JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(str))))); }
  catch(e){ return null; }
}
function parseMoney(str){
  if(typeof str === 'number') return str;
  if(!str) return 0;
  let s = String(str).replace(/[^\d,.-]/g,'').trim();
  if(s.indexOf(',') > -1 && s.indexOf('.') > -1){ s = s.replace(/\./g,'').replace(',', '.'); }
  else if(s.indexOf(',') > -1){ s = s.replace(',', '.'); }
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}
function fmtMoney(n){
  return (n||0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
}
function parseInt0(str){
  const n = parseInt(String(str||'').replace(/[^\d]/g,''), 10);
  return isNaN(n) ? 0 : n;
}
function nowMeta(){ return {ts: new Date().toISOString()}; }
function fmtDateTime(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('pt-BR') + ' · ' + d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}
function getGeo(){
  return new Promise((resolve)=>{
    if(!navigator.geolocation){ resolve(null); return; }
    const t = setTimeout(()=>resolve(null), 6000);
    navigator.geolocation.getCurrentPosition(
      (pos)=>{ clearTimeout(t); resolve({lat:pos.coords.latitude.toFixed(5), lon:pos.coords.longitude.toFixed(5)}); },
      ()=>{ clearTimeout(t); resolve(null); },
      {timeout:5500}
    );
  });
}
function fmtGeo(geo){ return geo ? (geo.lat+', '+geo.lon) : 'localização não disponível'; }

/* ---------------- fotos: compressão + leitura por IA ---------------- */
function compressImage(file, maxDim, quality){
  maxDim = maxDim || 900; quality = quality || 0.55;
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > h){ if(w > maxDim){ h = Math.round(h*maxDim/w); w = maxDim; } }
        else { if(h > maxDim){ w = Math.round(w*maxDim/h); h = maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function lerDisparoIA(imgDataUrl){
  try{
    const controller = new AbortController();
    const timer = setTimeout(()=>controller.abort(), 12000);
    const resp = await fetch('/api/ler-disparo', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({image: imgDataUrl}),
      signal: controller.signal
    });
    clearTimeout(timer);
    if(!resp.ok) return {ok:false};
    const data = await resp.json();
    if(typeof data.valor === 'number' && !isNaN(data.valor)) return {ok:true, valor: data.valor};
    return {ok:false};
  }catch(e){ return {ok:false}; }
}

let activeCaptureCallback = null;
function ensureHiddenFileInput(daGaleria){
  if(daGaleria){
    if(hiddenFileInputGaleria) return hiddenFileInputGaleria;
    hiddenFileInputGaleria = document.createElement('input');
    hiddenFileInputGaleria.type = 'file';
    hiddenFileInputGaleria.accept = 'image/*';
    hiddenFileInputGaleria.style.display = 'none';
    document.body.appendChild(hiddenFileInputGaleria);
    hiddenFileInputGaleria.addEventListener('change', ()=>{
      const file = hiddenFileInputGaleria.files[0];
      const cb = activeCaptureCallback; activeCaptureCallback = null;
      if(file && cb) cb(file);
    });
    return hiddenFileInputGaleria;
  }
  if(hiddenFileInput) return hiddenFileInput;
  hiddenFileInput = document.createElement('input');
  hiddenFileInput.type = 'file';
  hiddenFileInput.accept = 'image/*';
  hiddenFileInput.setAttribute('capture', 'environment');
  hiddenFileInput.style.display = 'none';
  document.body.appendChild(hiddenFileInput);
  hiddenFileInput.addEventListener('change', ()=>{
    const file = hiddenFileInput.files[0];
    const cb = activeCaptureCallback; activeCaptureCallback = null;
    if(file && cb) cb(file);
  });
  return hiddenFileInput;
}
function requestPhoto(callback, daGaleria){
  const input = ensureHiddenFileInput(daGaleria);
  activeCaptureCallback = callback;
  input.value = '';
  input.click();
}

/* ---------------- fotos: bloco genérico (botão / preview / retake) ----------------
   opts: { ai:boolean, targetInputId:string, label:string, onChange:fn } */
function paintFotoBlock(key, photos, opts){
  const el = document.getElementById('foto-block-'+key);
  if(!el) return;
  const p = photos[key];
  if(!p){
    el.innerHTML =
      '<div class="foto-actions">' +
        '<button type="button" class="btn-secondary mini foto-btn">📷 Tirar foto' + (opts.label ? ' — '+escapeHtml(opts.label) : '') + '</button>' +
        '<button type="button" class="btn-secondary mini foto-btn-galeria">🖼️ Escolher da galeria</button>' +
      '</div>';
    el.querySelector('.foto-btn').addEventListener('click', ()=> startCapture(key, photos, opts, false));
    el.querySelector('.foto-btn-galeria').addEventListener('click', ()=> startCapture(key, photos, opts, true));
    return;
  }
  let statusHtml = '';
  if(opts.ai){
    if(p.aiStatus === 'lendo') statusHtml = '<span class="foto-status">Lendo foto...</span>';
    else if(p.aiStatus === 'ok') statusHtml = '<span class="foto-status ok">✓ Lido pela IA: '+p.aiValor+'</span>';
    else if(p.aiStatus === 'divergente') statusHtml = '<span class="foto-status warn">⚠ IA leu '+p.aiValor+' — confira o valor</span>';
    else statusHtml = '<span class="foto-status offline">Sem conexão — valor digitado manualmente</span>';
  } else {
    statusHtml = '<span class="foto-status ok">✓ Foto anexada</span>';
  }
  el.innerHTML =
    '<div class="foto-row">' +
      '<img class="foto-thumb" src="'+p.img+'">' +
      '<div class="foto-meta">'+statusHtml+'<div class="foto-ts">'+fmtDateTime(p.ts)+' · '+fmtGeo(p.geo)+'</div></div>' +
      '<div class="foto-retake-wrap">' +
        '<button type="button" class="btn-secondary mini foto-retake">Tirar de novo</button>' +
        '<button type="button" class="btn-secondary mini foto-retake-galeria">Da galeria</button>' +
      '</div>' +
    '</div>';
  el.querySelector('.foto-retake').addEventListener('click', ()=> startCapture(key, photos, opts, false));
  el.querySelector('.foto-retake-galeria').addEventListener('click', ()=> startCapture(key, photos, opts, true));
}
function startCapture(key, photos, opts, daGaleria){
  requestPhoto(async (file)=>{
    const el = document.getElementById('foto-block-'+key);
    if(el) el.innerHTML = '<span class="foto-status">Processando foto...</span>';
    let dataUrl, geo;
    try{
      [dataUrl, geo] = await Promise.all([compressImage(file), getGeo()]);
    }catch(e){
      if(el) el.innerHTML = '<span class="foto-status offline">Não foi possível processar a foto — tente novamente.</span><button type="button" class="btn-secondary mini foto-retry" style="margin-top:6px;">Tentar de novo</button>';
      const retry = el && el.querySelector('.foto-retry');
      if(retry) retry.addEventListener('click', ()=> startCapture(key, photos, opts, daGaleria));
      return;
    }
    const photo = {img: dataUrl, ts: new Date().toISOString(), geo, aiStatus: opts.ai ? 'lendo' : null};
    photos[key] = photo;
    paintFotoBlock(key, photos, opts);
    if(opts.ai){
      const result = await lerDisparoIA(dataUrl);
      if(result.ok){
        const inputEl = document.getElementById(opts.targetInputId);
        if(inputEl){
          const prevVal = inputEl.value.trim();
          const divergente = prevVal !== '' && parseInt0(prevVal) !== result.valor;
          inputEl.value = result.valor;
          const meterEl = inputEl.closest('.meter');
          if(meterEl) meterEl.classList.toggle('diverge', divergente);
          photo.aiStatus = divergente ? 'divergente' : 'ok';
          photo.aiValor = result.valor;
          inputEl.dispatchEvent(new Event('input', {bubbles:true}));
        }
      } else {
        photo.aiStatus = 'offline';
      }
      paintFotoBlock(key, photos, opts);
    }
    if(opts.onChange) opts.onChange();
  }, daGaleria);
}

/* ---------------- storage ---------------- */
function storageKey(numero, equipamento){ return 'rjx_loc_' + numero + '_' + equipamento; }
function loadRecord(numero, equipamento){
  try{ const raw = localStorage.getItem(storageKey(numero, equipamento)); return raw ? JSON.parse(raw) : null; }
  catch(e){ return null; }
}
function saveRecord(numero, equipamento, data){
  try{ localStorage.setItem(storageKey(numero, equipamento), JSON.stringify(data)); }catch(e){}
}
function clearRecord(numero, equipamento){
  try{ localStorage.removeItem(storageKey(numero, equipamento)); }catch(e){}
}

/* ---------------- app state ---------------- */
const params = new URLSearchParams(window.location.search);
const dParam = params.get('d');
let header = dParam ? b64decode(dParam) : null;
let record = null;
if(header && header.numero){
  record = loadRecord(header.numero, header.equipamento);
  if(!record){
    record = {
      header: header,
      status: 'inicial',
      ultra: { inicial:{}, final:{} },
      crio: { entregues:{}, retornando:{} },
      financeiro: {},
      assinaturas: {},
      fotos: { ultra:{ inicial:{}, final:{} }, crio:{ entrega:{}, retorno:{} } }
    };
    saveRecord(header.numero, header.equipamento, record);
  }
  if(record && !record.fotos){
    record.fotos = { ultra:{ inicial:{}, final:{} }, crio:{ entrega:{}, retorno:{} } };
  }
}

const app = document.getElementById('app');
const eyebrowEl = document.getElementById('eyebrowText');
const chipEl = document.getElementById('chipText');
function setHeaderText(eb, chip){ eyebrowEl.textContent = eb; chipEl.textContent = chip; }

/* ---------------- render dispatch ---------------- */
function render(){
  if(!header){ renderYasmin(); return; }
  if(!record){ record = loadRecord(header.numero, header.equipamento); }
  if(!record){ renderYasmin(); return; }
  if(!record.fotos){ record.fotos = { ultra:{ inicial:{}, final:{} }, crio:{ entrega:{}, retorno:{} } }; }

  setHeaderText(EQUIP_LABEL[header.equipamento] || 'Locação', 'Nº ' + header.numero + ' · ' + (header.doutora||''));

  switch(record.status){
    case 'inicial': renderInicial(); break;
    case 'sig_entrega': renderSigEntrega(); break;
    case 'final': renderFinal(); break;
    case 'condicoes': renderCondicoes(); break;
    case 'sig_fechamento': renderSigFechamento(); break;
    case 'revisao': renderRevisao(); break;
    case 'concluido': renderConcluido(); break;
    default: renderInicial();
  }
}

/* ==================================================
   SCREEN — disparo/entrega inicial
   ================================================== */
function expandCartuchos(list){
  const dup = (header && header.duplicados) || [];
  const out = [];
  list.forEach(c=>{
    if(dup.includes(c.key)){
      out.push({key:c.key+'__1', label:c.label+' — Cartucho 1'});
      out.push({key:c.key+'__2', label:c.label+' — Cartucho 2'});
    } else {
      out.push(c);
    }
  });
  return out;
}
function condicoesBanner(){
  const isCrio = header.equipamento === 'crio';
  const rows = [];
  if(header.valorLocacao) rows.push([isCrio ? 'Valor da locação' : 'Locação Ultraformer', fmtMoney(header.valorLocacao)]);
  if(isCrio){
    if(header.semManta) rows.push(['Manta', 'Sem cobrança de manta']);
    else if(header.valorManta) rows.push(['Valor da manta', fmtMoney(header.valorManta)]);
  } else if(header.valorLavieen){
    rows.push(['Combo Lavieen', fmtMoney(header.valorLavieen)]);
  }
  const hasText = !!header.condicoes;
  const hasRows = rows.length > 0;
  if(!hasText && !hasRows) return '';
  let html = '<div class="banner-condicoes">';
  if(hasText) html += '<div class="banner-label">Condições da locação</div><div class="banner-text">' + escapeHtml(header.condicoes) + '</div>';
  if(hasRows){
    html += '<div' + (hasText ? ' style="border-top:0.5px solid var(--line);padding-top:5px;margin-top:5px;"' : '') + '>';
    rows.forEach(rrow=>{ html += '<div class="banner-row"><span>'+rrow[0]+'</span><span>'+escapeHtml(String(rrow[1]))+'</span></div>'; });
    html += '</div>';
  }
  html += '</div>';
  return html;
}

   ================================================== */
function makeSignaturePad(canvasId){
  const canvas = document.getElementById(canvasId);
  const ctx = canvas.getContext('2d');
  function resize(){
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * 2; canvas.height = rect.height * 2;
    ctx.scale(2,2); ctx.strokeStyle = '#7a1220'; ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.lineJoin='round';
  }
  resize();
  let drawing = false, hasDrawn = false;
  function pos(e){
    const rect = canvas.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return {x: p.clientX - rect.left, y: p.clientY - rect.top};
  }
  function start(e){ e.preventDefault(); drawing = true; hasDrawn = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); }
  function move(e){ if(!drawing) return; e.preventDefault(); const p = pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); }
  function end(e){ drawing = false; }
  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, {passive:false});
  canvas.addEventListener('touchmove', move, {passive:false});
  canvas.addEventListener('touchend', end);
  return {
    clear(){ ctx.clearRect(0,0,canvas.width,canvas.height); hasDrawn = false; },
    isEmpty(){ return !hasDrawn; },
    dataUrl(){ return canvas.toDataURL('image/png'); }
  };
}

    const inicial = record.ultra.inicial;
    function checkRow(c){
      const el = document.getElementById('inp-'+c.key);

      const ini = inicial[c.key] || 0;
      if(el.value === ''){ meterEl.classList.remove('invalid'); errRow.style.display = 'none'; return null; }
      const fin = parseInt0(el.value);
      const invalid = fin > ini;
      meterEl.classList.toggle('invalid', invalid);
      errRow.style.display = invalid ? 'block' : 'none';
      return invalid;
    }

      let anyInvalid = false, anyMissing = false;

      });

      record.ultra.final = vals;
      record.fotos.ultra.final = photos;
    }

    saveRecord(header.numero, header.equipamento, record);

  });

function computeUltraSaldos(){
  const ini = record.ultra.inicial, fin = record.ultra.final;
  const linear = expandCartuchos(LINEAR).map(c=>({...c, saldo: Math.max(0,(ini[c.key]||0)-(fin[c.key]||0))}));
  const booster = expandCartuchos(BOOSTER).map(c=>({...c, saldo: Math.max(0,(ini[c.key]||0)-(fin[c.key]||0))}));
  const totalLinear = linear.reduce((s,c)=>s+c.saldo,0);
  const totalBooster = booster.reduce((s,c)=>s+c.saldo,0);
  return {linear, booster, totalLinear, totalBooster, totalGeral: totalLinear+totalBooster};
}

    <div class="total-box"><span class="label">Total geral a pagar</span><span class="valor" id="total-geral">R$ 0,00</span></div>
    ${isCrio && calc.cobranca ? `
      <div class="card" style="margin-top:14px;">
        <h3>Assinatura — cinta ausente</h3>
        <img src="${calc.cobranca.assinatura.img}" style="width:100%; max-width:220px; display:block; background:var(--paper-soft); border:1px solid var(--line); border-radius:var(--radius);">
        <div class="sig-meta"><span>${fmtDateTime(calc.cobranca.assinatura.ts)}</span><span>${fmtGeo(calc.cobranca.assinatura.geo)}</span></div>
      </div>
    ` : ''}
    <div class="field-error" id="err-cond" style="margin-top:10px;"></div>
    <button class="btn-primary" style="margin-top:14px;" id="btn-confirmar-cond">Confirmar fechamento</button>
    <p class="note" id="calc-explain"></p>
  `;

  let swGratuita;
  if(!isCrio){
    swGratuita = document.getElementById('sw-gratuita');
    swGratuita.addEventListener('click', ()=>{
      swGratuita.classList.toggle('on');
      recalc();
    });
  }

  function recalc(){
    let total = 0, explain = '';
    const btnCond = document.getElementById('btn-confirmar-cond');
    if(isCrio){
      const valorManta = header.valorManta || 0;
      const cobrancaTotal = calc.cobranca ? calc.cobranca.total : 0;
      const subtotal = header.semManta ? 0 : calc.utilizadas * valorManta;
      total = subtotal + valorLocacaoYasmin + valorFrete + cobrancaTotal;
      explain = (header.semManta ? 'Sem cobrança de manta' : `${calc.utilizadas} mantas × ${fmtMoney(valorManta)} = ${fmtMoney(subtotal)}`)
        + ` + locação ${fmtMoney(valorLocacaoYasmin)}`
        + (freteAtivo ? ` + frete ${fmtMoney(valorFrete)}` : '')
        + (cobrancaTotal ? ` + cinta ausente ${fmtMoney(cobrancaTotal)}` : '');
      if(btnCond) btnCond.disabled = header.semManta ? false : !valorManta;
    } else {
      const valorDisparo = parseMoney(document.getElementById('f-valor-disparo').value);
      const gratuita = swGratuita.classList.contains('on');
      const valorLocacaoAplicado = gratuita ? 0 : valorLocacaoYasmin;
      const subtotal = calc.totalGeral * valorDisparo;
      total = subtotal + valorLocacaoAplicado + valorLavieenYasmin + valorFrete;
      explain = `${calc.totalGeral} Disparos × ${fmtMoney(valorDisparo)} = ${fmtMoney(subtotal)}`
        + (valorLocacaoAplicado ? ` + locação ${fmtMoney(valorLocacaoAplicado)}` : ' + locação gratuita')
        + (valorLavieenYasmin ? ` + combo Lavieen ${fmtMoney(valorLavieenYasmin)}` : '')
        + (freteAtivo ? ` + frete ${fmtMoney(valorFrete)}` : '');
      if(btnCond) btnCond.disabled = !valorDisparo;
    }
    document.getElementById('total-geral').textContent = fmtMoney(total);
    document.getElementById('calc-explain').textContent = explain;
    return total;
  }
  app.querySelectorAll('input[type=text]').forEach(inp=> inp.addEventListener('input', recalc));
  recalc();

  document.getElementById('btn-confirmar-cond').addEventListener('click', ()=>{
    const errEl = document.getElementById('err-cond');
    if(isCrio){
      const valorManta = header.valorManta || 0;
      if(!header.semManta && !valorManta){ errEl.textContent = 'A Yasmin não definiu o valor da manta para essa locação.'; return; }
      record.financeiro = {valorManta: header.semManta ? 0 : valorManta, valorLocacao: valorLocacaoYasmin, frete: freteAtivo, valorFrete, utilizadas: calc.utilizadas, cobrancaCinta: calc.cobranca, total: recalc()};
    } else {
      const valorDisparo = parseMoney(document.getElementById('f-valor-disparo').value);
      const gratuita = swGratuita.classList.contains('on');
      const valorLocacaoAplicado = gratuita ? 0 : valorLocacaoYasmin;
      if(!valorDisparo){ errEl.textContent = 'Informe o valor do disparo negociado antes de continuar.'; return; }
      record.financeiro = {valorDisparo, gratuita, valorLocacao: valorLocacaoAplicado, valorLavieen: valorLavieenYasmin, frete: freteAtivo, valorFrete, ...calc, total: recalc()};
    }
    errEl.textContent = '';
    record.status = 'sig_fechamento';
    saveRecord(header.numero, header.equipamento, record);
    render();
  });
}

function fotoGridItem(cap, photo){
  if(!photo){
    return `<div class="foto-grid-item missing">Sem foto</div><div class="cap">${escapeHtml(cap)}</div>`;
  }
  return `<div class="foto-grid-item"><img src="${photo.img}"></div><div class="cap">${escapeHtml(cap)} · ${fmtDateTime(photo.ts)}</div>`;
}
function renderRevisao(){
  const isCrio = header.equipamento === 'crio';
  let gridHtml = '';
  if(isCrio){
    const fe = record.fotos.crio.entrega, fr = record.fotos.crio.retorno;
    gridHtml = '<div class="foto-grid">'
      + (header.semManta ? '' : fotoGridItem('Mantas — entrega', fe.mantasE))
      + fotoGridItem('Cintas — entrega', fe.cintasE)
      + (header.semManta ? '' : fotoGridItem('Mantas — retorno', fr.mantasR))
      + fotoGridItem('Cintas — retorno', fr.cintasR)
      + '</div>';
  } else {
    const linearList = expandCartuchos(LINEAR), boosterList = expandCartuchos(BOOSTER);
    const fi = record.fotos.ultra.inicial, ff = record.fotos.ultra.final;
    gridHtml = '<div class="foto-grid">' + [...linearList, ...boosterList].map(c=>
      fotoGridItem(c.label+' — inicial', fi[c.key]) + fotoGridItem(c.label+' — final', ff[c.key])
    ).join('') + '</div>';
  }
  app.innerHTML = `
    <h2 class="section-title">Revisão de fotos</h2>
    <p class="section-sub">Confira se todas as fotos foram tiradas antes de gerar o PDF final.</p>
    ${gridHtml}
    <button class="btn-primary" id="btn-gerar-final">Gerar PDF e concluir locação</button>
    <button class="btn-secondary" id="btn-revisao-voltar">Voltar</button>
    <p class="note">Depois de gerar o PDF, os dados desta locação são apagados automaticamente deste aparelho.</p>
  `;
  document.getElementById('btn-revisao-voltar').addEventListener('click', ()=>{
    record.status = 'sig_fechamento';
    saveRecord(header.numero, header.equipamento, record);
    render();
  });
  document.getElementById('btn-gerar-final').addEventListener('click', ()=>{
    gerarPDF(record, header);
    clearRecord(header.numero, header.equipamento);
    app.innerHTML = `
      <div class="center-msg">
        <div class="big">Locação fechada ✓</div>
        <p class="section-sub">PDF baixado. Os dados desta locação já foram apagados deste aparelho.</p>

}

  y += 12;

  if(isCrio){

    doc.text('DISPARO INICIAL', marginX, y); y += 7;
    doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(54,47,41);
    [...expandCartuchos(LINEAR), ...expandCartuchos(BOOSTER)].forEach(c=>{
      doc.text(c.label + ': ' + (ini[c.key]||0), marginX, y); y += 5;
    });
    y += 4;
  }

  // fotos da entrega
  const fotoItems = [];
  if(isCrio){
    const fe = record.fotos.crio.entrega || {};
    if(!header.semManta) fotoItems.push({label:'Mantas — entrega', photo: fe.mantasE});
    fotoItems.push({label:'Cintas — entrega', photo: fe.cintasE});
  } else {
    const fi = record.fotos.ultra.inicial || {};
    [...expandCartuchos(LINEAR), ...expandCartuchos(BOOSTER)].forEach(c=>{
      fotoItems.push({label: c.label+' — inicial', photo: fi[c.key]});

  const comFoto = fotoItems.filter(it=>it.photo);
  if(comFoto.length){

      doc.text(fmtDateTime(item.photo.ts), x, rowY+photoH+6.5);

    doc.text(fmtGeo(sigE.geo), marginX, y+33.5);
  }

  const filename = 'RJX_Relatorio_Entrega_' + header.numero + '_' + (header.equipamento||'') + '.pdf';
  doc.save(filename);
}

/* ==================================================
   PDF generation
   ================================================== */
function gerarPDF(record, header){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'mm', format:'a4'});
  const isCrio = header.equipamento === 'crio';
  const marginX = 16;
  let y = 10;

  const logoW = 34, logoH = logoW * (501/900);
  try{ doc.addImage(LOGO_PDF_DATAURL, 'PNG', marginX, y, logoW, logoH); }catch(e){}
  doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(90,85,78);
  doc.text('CNPJ 51.797.671/0001-66 · AFE 8.34727-6', marginX, y + logoH + 5);
  doc.setFontSize(9); doc.setTextColor(23,19,15);
  doc.text('Locação nº ' + header.numero, 194, y+6, {align:'right'});
  doc.text(formatDateBR(header.data) || '', 194, y+11, {align:'right'});
  y += Math.max(logoH + 9, 16);
  doc.setDrawColor(122,18,32); doc.setLineWidth(1); doc.line(marginX, y, 194, y);
  y += 8;

  doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(23,19,15);
  doc.text(header.doutora || '', marginX, y);
  doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(90,85,78);
  doc.text(EQUIP_LABEL[header.equipamento] + (header.motorista ? ' · Motorista: '+header.motorista : ''), marginX, y+5);
  y += 10;
  if(header.cpfCnpj){
    doc.setFontSize(8.5); doc.setTextColor(90,85,78);
    doc.text('CPF/CNPJ: ' + header.cpfCnpj, marginX, y);
    y += 5;
  }
  const eqDetails = EQUIP_DETAILS[header.equipamento];
  if(eqDetails){
    doc.setFontSize(8); doc.setTextColor(140,131,119);
    doc.text('Nº de série: ' + eqDetails.serie + '  ·  Registro Anvisa: ' + eqDetails.anvisa, marginX, y);
    y += 5;
  }
  y += 2;

  if(header.condicoes){
    doc.setFillColor(241,235,225);
    const lines = doc.splitTextToSize('Condições: ' + header.condicoes, 172);
    doc.rect(marginX, y-4, 178, lines.length*4.5+4, 'F');
    doc.setFontSize(8.5); doc.setTextColor(54,47,41);
    doc.text(lines, marginX+3, y);
    y += lines.length*4.5 + 7;
  }

  function tableHeader(cols, widths){
    doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.setTextColor(140,131,119);
    let x = marginX;
    cols.forEach((c,i)=>{ doc.text(c.toUpperCase(), x, y); x += widths[i]; });
    y += 2; doc.setDrawColor(23,19,15); doc.setLineWidth(0.3); doc.line(marginX, y, marginX+widths.reduce((a,b)=>a+b,0), y);
    y += 4.5;
  }
  function tableRow(vals, widths){
    doc.setFont('courier','normal'); doc.setFontSize(8.5); doc.setTextColor(23,19,15);
    let x = marginX;
    vals.forEach((v,i)=>{ doc.text(String(v), x, y); x += widths[i]; });
    y += 5.2;
  }

  let totalGeral = 0, resumoLinhas = [];

  if(isCrio){
    const ent = record.crio.entregues, ret = record.crio.retornando;
    doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(122,18,32);
    doc.text('CRIODERMIS 2.0', marginX, y); y += 6;
    const widths = [70,40,40,40];
    tableHeader(['Item','Entregue','Retornou','Utilizado'], widths);
    if(!header.semManta) tableRow(['Mantas', ent.mantas, ret.mantas, ent.mantas-ret.mantas], widths);
    tableRow(['Cintas (sem custo)', ent.cintas, ret.cintas, '—'], widths);
    y += 4;
    const f = record.financeiro;
    resumoLinhas = [];
    if(!header.semManta){
      resumoLinhas.push(
        ['Mantas utilizadas', String(f.utilizadas)],
        ['Valor por manta', fmtMoney(f.valorManta)],
        ['Total manta', fmtMoney(f.utilizadas * f.valorManta)],
      );
    }
    resumoLinhas.push(
      ['Locação', fmtMoney(f.valorLocacao)],
      ['Frete', f.frete ? fmtMoney(f.valorFrete) : '—'],
    );
    if(f.cobrancaCinta){
      resumoLinhas.push(['Cinta ausente (' + f.cobrancaCinta.qtd + ' × R$18)', fmtMoney(f.cobrancaCinta.total)]);
    }
    totalGeral = f.total;
  } else {
    const calc = computeUltraSaldos();
    const widths = [55,40,40,35];
    doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(122,18,32);
    doc.text('CARTUCHOS LINEAR', marginX, y); y += 6;
    tableHeader(['Cartucho','Inicial','Final','Saldo'], widths);
    calc.linear.forEach(c=> tableRow([c.label, record.ultra.inicial[c.key], record.ultra.final[c.key], c.saldo+' Disparos'], widths));
    y += 3;
    doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(122,18,32);
    doc.text('CARTUCHOS BOOSTER', marginX, y); y += 6;
    tableHeader(['Cartucho','Inicial','Final','Saldo'], widths);
    calc.booster.forEach(c=> tableRow([c.label, record.ultra.inicial[c.key], record.ultra.final[c.key], c.saldo+' Disparos'], widths));
    y += 4;
    const f = record.financeiro;
    resumoLinhas = [
      ['Total linear', calc.totalLinear+' Disparos'],
      ['Total booster', calc.totalBooster+' Disparos'],
      ['Total geral utilizado', calc.totalGeral+' Disparos'],
      ['Valor do disparo', fmtMoney(f.valorDisparo)],
      ['Locação', f.gratuita ? 'Gratuita' : fmtMoney(f.valorLocacao)],
      ...(f.valorLavieen ? [['Locação combo Lavieen', fmtMoney(f.valorLavieen)]] : []),
      ['Frete', f.frete ? fmtMoney(f.valorFrete) : '—'],
    ];
    totalGeral = f.total;
  }

  resumoLinhas.forEach(([label,val])=>{
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(54,47,41);
    doc.text(label, marginX, y);
    doc.setFont('courier','bold');
    doc.text(String(val), 194, y, {align:'right'});
    y += 5.5;
  });

  y += 3;
  doc.setFillColor(122,18,32);
  doc.rect(marginX, y, 178, 14, 'F');
  doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(250,247,242);
  doc.text('TOTAL GERAL', marginX+5, y+9);
  doc.setFontSize(15);
  doc.text(fmtMoney(totalGeral), 189, y+9.5, {align:'right'});
  y += 24;

  // fotos (antes/depois) — anexadas no contrato, tamanho reduzido
  function addFotoSection(items){
    const photoW = 40, photoH = 30, gap = 6, perRow = 4;
    const usableW = 178;
    const cellW = (usableW - gap*(perRow-1)) / perRow;
    items.forEach((item, idx)=>{
      if(!item.photo) return;
      const col = idx % perRow;
      if(col === 0 && idx !== 0){ /* handled by row break below */ }
      const rowIdx = Math.floor(idx / perRow);
      const x = marginX + col*(cellW+gap);
      if(col === 0){
        if(y + photoH + 12 > 285){ doc.addPage(); y = 14; }
      }
      const rowY = y;
      try{ doc.addImage(item.photo.img, 'JPEG', x, rowY, cellW, photoH); }catch(e){}
      doc.setFont('helvetica','normal'); doc.setFontSize(6); doc.setTextColor(90,85,78);
      doc.text(doc.splitTextToSize(item.label, cellW), x, rowY+photoH+3);
      doc.text(fmtDateTime(item.photo.ts), x, rowY+photoH+6.5);
      doc.text(fmtGeo(item.photo.geo), x, rowY+photoH+9.5);
      if(col === perRow-1 || idx === items.length-1){ y = rowY + photoH + 13; }
    });
  }
  const fotoItems = [];
  if(isCrio){
    const fe = record.fotos.crio.entrega || {}, fr = record.fotos.crio.retorno || {};
    if(!header.semManta) fotoItems.push({label:'Mantas — entrega', photo: fe.mantasE});
    fotoItems.push({label:'Cintas — entrega', photo: fe.cintasE});
    if(!header.semManta) fotoItems.push({label:'Mantas — retorno', photo: fr.mantasR});
    fotoItems.push({label:'Cintas — retorno', photo: fr.cintasR});
  } else {
    const fi = record.fotos.ultra.inicial || {}, ff = record.fotos.ultra.final || {};
    [...expandCartuchos(LINEAR), ...expandCartuchos(BOOSTER)].forEach(c=>{
      fotoItems.push({label: c.label+' — inicial', photo: fi[c.key]});
      fotoItems.push({label: c.label+' — final', photo: ff[c.key]});
    });
  }
  const fotoItemsComFoto = fotoItems.filter(it=>it.photo);
  if(fotoItemsComFoto.length){
    if(y + 14 > 285){ doc.addPage(); y = 14; }
    doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(122,18,32);
    doc.text('FOTOS DAS TELAS / ITENS', marginX, y); y += 6;
    addFotoSection(fotoItemsComFoto);
    y += 4;
  }

  // signatures
  if(y + 45 > 290){ doc.addPage(); y = 14; }
  const sigH = 20;
  const cpfLine = header.cpfCnpj ? ('CPF/CNPJ: ' + header.cpfCnpj) : '';
  const sigs = header.equipamento
    ? [
        {name: header.doutora || 'Dr(a)', sub:'Entrega', cpf: cpfLine, s: record.assinaturas.entrega},
        {name: header.doutora || 'Dr(a)', sub:'Retirada', cpf: cpfLine, s: record.assinaturas.retirada},
        {name: header.motorista || 'Motorista', sub:'Logística', cpf:'', s: record.assinaturas.logistica},
      ]
    : [];
  if(isCrio && record.financeiro.cobrancaCinta){
    sigs.push({name: header.doutora || 'Dr(a)', sub:'Cinta ausente', cpf: cpfLine, s: record.financeiro.cobrancaCinta.assinatura});
  }
  const sigGap = 7;
  const sigW = Math.min(55, (178 - (sigs.length-1)*sigGap) / sigs.length);
  let sx = marginX;
  sigs.forEach(sig=>{
    if(sig.s && sig.s.img){
      try{ doc.addImage(sig.s.img, 'PNG', sx, y, sigW, sigH); }catch(e){}
    }
    doc.setDrawColor(23,19,15); doc.setLineWidth(0.3); doc.line(sx, y+sigH+2, sx+sigW, y+sigH+2);
    let ty = y+sigH+6;
    doc.setFont('helvetica','bold'); doc.setFontSize(7); doc.setTextColor(23,19,15);
    doc.text(doc.splitTextToSize(sig.name, sigW), sx, ty); ty += 4;
    doc.setFont('helvetica','normal'); doc.setFontSize(6.5); doc.setTextColor(90,85,78);
    doc.text(sig.sub, sx, ty); ty += 3.5;
    if(sig.cpf){ doc.text(sig.cpf, sx, ty); ty += 3.5; }
    if(sig.s){
      doc.text(fmtDateTime(sig.s.ts), sx, ty); ty += 3.5;
      doc.text(fmtGeo(sig.s.geo), sx, ty);
    }
    sx += sigW + sigGap;
  });

  const filename = 'RJX_Locacao_' + header.numero + '_' + (header.equipamento||'') + '.pdf';
  doc.save(filename);
}

/* ---------------- boot ---------------- */
render();

})();
</script>
</body>
</html>
